llow company rules."], ["<ruby>医者<rt>いしゃ</rt></ruby>の <ruby>指示<rt>しじ</rt></ruby>に <ruby>従<rt>したが</rt></ruby>って、 <ruby>薬<rt>くすり</rt></ruby>を <ruby>飲<rt>の</rt></ruby>んでいる。", "I take my medicine following my doctor's instructions."], ["<ruby>説明書<rt>せつめいしょ</rt></ruby>に <ruby>従<rt>したが</rt></ruby>って <ruby>組<rt>く</rt></ruby>み <ruby>立<rt>た</rt></ruby>ててください。", "Please assemble it following the manual."]], "n": "〜に従って also = as ~ changes (grammar point). Takes に."}, {"w": "任せる", "wf": "<ruby>任<rt>まか</rt></ruby>せる", "r": "まかせる", "m": "to entrust; to leave (to someone)", "p": "v1 transitive", "t": "verb", "d": 6, "ex": [["この <ruby>仕事<rt>しごと</rt></ruby>は <ruby>私<rt>わたし</rt></ruby>に <ruby>任<rt>まか</rt></ruby>せてください。", "Please leave this job to me."], ["<ruby>店<rt>みせ</rt></ruby> <ruby>選<rt>えら</rt></ruby>びは <ruby>君<rt>きみ</rt></ruby>に <ruby>任<rt>まか</rt></ruby>せるよ。", "I will leave the choice of restaurant to you."], ["<ruby>大事<rt>だいじ</rt></ruby>なことを <ruby>人<rt>ひと</rt></ruby>に <ruby>任<rt>まか</rt></ruby>せきりにしない <ruby>方<rt>ほう</rt></ruby>がいい。", "It is better not to leave important things entirely to others."]], "n": "おまかせ at a sushi shop = chef's choice. 任せきり = leaving it all to someone."}, {"w": "確かめる", "wf": "<ruby>確<rt>たし</rt></ruby>かめる", "r": "たしかめる", "m": "to confirm; to make sure", "p": "v1 transitive", "t": "verb", "d": 6, "ex": [["<ruby>出<rt>で</rt></ruby>かける <ruby>前<rt>まえ</rt></ruby>に、ドアの <ruby>鍵<rt>かぎ</rt></ruby>を <ruby>確<rt>たし</rt></ruby>かめた。", "Before going out, I checked the door lock."], ["<ruby>事実<rt>じじつ</rt></ruby>かどうか、 <ruby>自分<rt>じぶん</rt></ruby>の <ruby>目<rt>め</rt></ruby>で <ruby>確<rt>たし</rt></ruby>かめたい。", "I want to confirm with my own eyes whether it is true."], ["<ruby>電話<rt>でんわ</rt></ruby>で <ruby>時間<rt>じかん</rt></ruby>を <ruby>確<rt>たし</rt></ruby>かめてから <ruby>行<rt>い</rt></ruby>こう。", "Let us check the time by phone before going."]], "n": "Same family as 確認する (formal) and 確か. Spoken: チェックする."}, {"w": "思いつく", "wf": "<ruby>思<rt>おも</rt></ruby>いつく", "r": "おもいつく", "m": "to think of; to come up with", "p": "v5 transitive", "t": "verb", "d": 6, "ex": [["いいアイデアを <ruby>思<rt>おも</rt></ruby>いついた。", "I came up with a good idea."], ["<ruby>名前<rt>なまえ</rt></ruby>がどうしても <ruby>思<rt>おも</rt></ruby>いつかない。", "I just cannot think of a name."], ["<ruby>思<rt>おも</rt></ruby>いついたことを <ruby>全部<rt>ぜんぶ</rt></ruby>メモしておこう。", "Let us note down everything that comes to mind."]], "n": "思い出す = recall (existing memory); 思いつく = a new idea pops up."}, {"w": "申し込む", "wf": "<ruby>申<rt>もう</rt></ruby>し <ruby>込<rt>こ</rt></ruby>む", "r": "もうしこむ", "m": "to apply; to sign up", "p": "v5 transitive", "t": "verb", "d": 6, "ex": [["<ruby>十二月<rt>じゅうにがつ</rt></ruby>の <ruby>試験<rt>しけん</rt></ruby>に <ruby>申<rt>もう</rt></ruby>し <ruby>込<rt>こ</rt></ruby>んだ。", "I applied for the December exam."], ["インターネットで <ruby>簡単<rt>かんたん</rt></ruby>に <ruby>申<rt>もう</rt></ruby>し <ruby>込<rt>こ</rt></ruby>むことができます。", "You can easily apply online."], ["<ruby>参加<rt>さんか</rt></ruby>を <ruby>希望<rt>きぼう</rt></ruby>する <ruby>人<rt>ひと</rt></ruby>は、 <ruby>金曜日<rt>きんようび</rt></ruby>までに <ruby>申<rt>もう</rt></ruby>し <ruby>込<rt>こ</rt></ruby>んでください。", "Those who wish to participate, please apply by Friday."]], "n": "Noun 申し込み pairs with 締め切り (batch 1). Register for JLPT = 試験に申し込む."}, {"w": "受け取る", "wf": "<ruby>受<rt>う</rt></ruby>け <ruby>取<rt>と</rt></ruby>る", "r": "うけとる", "m": "to receive; to accept", "p": "v5 transitive", "t": "verb", "d": 6, "ex": [["コンビニで <ruby>荷物<rt>にもつ</rt></ruby>を <ruby>受<rt>う</rt></ruby>け <ruby>取<rt>と</rt></ruby>った。", "I picked up my package at the convenience store."], ["メールを <ruby>受<rt>う</rt></ruby>け <ruby>取<rt>と</rt></ruby>りました。", "I received your email."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>私<rt>わたし</rt></ruby>の <ruby>冗談<rt>じょうだん</rt></ruby>を <ruby>本気<rt>ほんき</rt></ruby>に <ruby>受<rt>う</rt></ruby>け <ruby>取<rt>と</rt></ruby>った。", "He took my joke seriously."]], "n": "もらう (casual) → 受け取る (neutral/formal). Also = interpret."}, {"w": "引き受ける", "wf": "<ruby>引<rt>ひ</rt></ruby>き <ruby>受<rt>う</rt></ruby>ける", "r": "ひきうける", "m": "to take on; to accept (a task)", "p": "v1 transitive", "t": "verb", "d": 6, "ex": [["<ruby>難<rt>むずか</rt></ruby>しい <ruby>仕事<rt>しごと</rt></ruby>だが、 <ruby>引<rt>ひ</rt></ruby>き <ruby>受<rt>う</rt></ruby>けることにした。", "It is a difficult job, but I decided to take it on."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>会<rt>かい</rt></ruby>の <ruby>司会<rt>しかい</rt></ruby>を <ruby>引<rt>ひ</rt></ruby>き <ruby>受<rt>う</rt></ruby>けてくれた。", "He agreed to be the MC for the event."], ["<ruby>何<rt>なん</rt></ruby>でも <ruby>引<rt>ひ</rt></ruby>き <ruby>受<rt>う</rt></ruby>けると、 <ruby>後<rt>あと</rt></ruby>で <ruby>大変<rt>たいへん</rt></ruby>になる。", "If you take on everything, it gets tough later."]], "n": "Accept responsibility/work. Opposite move: 断る (batch 1)."}, {"w": "取り消す", "wf": "<ruby>取<rt>と</rt></ruby>り <ruby>消<rt>け</rt></ruby>す", "r": "とりけす", "m": "to cancel; to retract", "p": "v5 transitive", "t": "verb", "d": 6, "ex": [["ホテルの <ruby>予約<rt>よやく</rt></ruby>を <ruby>取<rt>と</rt></ruby>り <ruby>消<rt>け</rt></ruby>した。", "I cancelled the hotel reservation."], ["<ruby>今<rt>いま</rt></ruby>の <ruby>発言<rt>はつげん</rt></ruby>を <ruby>取<rt>と</rt></ruby>り <ruby>消<rt>け</rt></ruby>します。", "I retract what I just said."], ["<ruby>一度<rt>いちど</rt></ruby> <ruby>送<rt>おく</rt></ruby>った <ruby>注文<rt>ちゅうもん</rt></ruby>は <ruby>取<rt>と</rt></ruby>り <ruby>消<rt>け</rt></ruby>せません。", "Orders once placed cannot be cancelled."]], "n": "キャンセルする is the everyday word; 取り消す is native/formal. 取消ボタン on forms."}, {"w": "変更", "wf": "<ruby>変更<rt>へんこう</rt></ruby>", "r": "へんこう", "m": "change; alteration (plans, settings)", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>予定<rt>よてい</rt></ruby>を <ruby>変更<rt>へんこう</rt></ruby>しました。", "I changed the schedule."], ["<ruby>出発<rt>しゅっぱつ</rt></ruby> <ruby>時間<rt>じかん</rt></ruby>に <ruby>変更<rt>へんこう</rt></ruby>があります。", "There is a change to the departure time."], ["パスワードは <ruby>定期的<rt>ていきてき</rt></ruby>に <ruby>変更<rt>へんこう</rt></ruby>した <ruby>方<rt>ほう</rt></ruby>がいい。", "You should change your password regularly."]], "n": "変更 = deliberate change to plans/settings; 変化 = natural change."}, {"w": "中止", "wf": "<ruby>中止<rt>ちゅうし</rt></ruby>", "r": "ちゅうし", "m": "cancellation; calling off", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>台風<rt>たいふう</rt></ruby>のため、 <ruby>祭<rt>まつ</rt></ruby>りは <ruby>中止<rt>ちゅうし</rt></ruby>になった。", "The festival was called off because of the typhoon."], ["<ruby>雨<rt>あめ</rt></ruby>でも <ruby>試合<rt>しあい</rt></ruby>は <ruby>中止<rt>ちゅうし</rt></ruby>しません。", "Even if it rains, the match will not be cancelled."], ["<ruby>計画<rt>けいかく</rt></ruby>は <ruby>中止<rt>ちゅうし</rt></ruby>するべきだと <ruby>思<rt>おも</rt></ruby>う。", "I think the plan should be stopped."]], "n": "中止になる (it gets cancelled) vs 中止する (someone cancels). Pair with 延期. Listening staple."}, {"w": "延期", "wf": "<ruby>延期<rt>えんき</rt></ruby>", "r": "えんき", "m": "postponement", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>運動会<rt>うんどうかい</rt></ruby>は <ruby>来週<rt>らいしゅう</rt></ruby>に <ruby>延期<rt>えんき</rt></ruby>された。", "The sports day was postponed to next week."], ["<ruby>会議<rt>かいぎ</rt></ruby>の <ruby>延期<rt>えんき</rt></ruby>をお <ruby>知<rt>し</rt></ruby>らせします。", "We inform you of the meeting's postponement."], ["<ruby>出発<rt>しゅっぱつ</rt></ruby>を <ruby>一日<rt>いちにち</rt></ruby> <ruby>延期<rt>えんき</rt></ruby>することにした。", "We decided to postpone departure by one day."]], "n": "中止 = cancelled entirely; 延期 = moved to later. Both on the listening section constantly."}, {"w": "到着", "wf": "<ruby>到着<rt>とうちゃく</rt></ruby>", "r": "とうちゃく", "m": "arrival", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>電車<rt>でんしゃ</rt></ruby>は <ruby>十五分<rt>じゅうごふん</rt></ruby> <ruby>遅<rt>おく</rt></ruby>れて <ruby>到着<rt>とうちゃく</rt></ruby>した。", "The train arrived fifteen minutes late."], ["<ruby>到着<rt>とうちゃく</rt></ruby>したら、 <ruby>連絡<rt>れんらく</rt></ruby>してください。", "Please contact me when you arrive."], ["ホテルへの <ruby>到着<rt>とうちゃく</rt></ruby> <ruby>時間<rt>じかん</rt></ruby>を <ruby>教<rt>おし</rt></ruby>えてください。", "Please tell me your arrival time at the hotel."]], "n": "Opposite: 出発. 着く is the everyday verb."}, {"w": "遅刻", "wf": "<ruby>遅刻<rt>ちこく</rt></ruby>", "r": "ちこく", "m": "being late (for a set time)", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>寝坊<rt>ねぼう</rt></ruby>して、 <ruby>学校<rt>がっこう</rt></ruby>に <ruby>遅刻<rt>ちこく</rt></ruby>した。", "I overslept and was late for school."], ["<ruby>遅刻<rt>ちこく</rt></ruby>する <ruby>場合<rt>ばあい</rt></ruby>は、 <ruby>必<rt>かなら</rt></ruby>ず <ruby>連絡<rt>れんらく</rt></ruby>してください。", "If you are going to be late, be sure to contact us."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>遅刻<rt>ちこく</rt></ruby>が <ruby>多<rt>おお</rt></ruby>い。", "He is often late."]], "n": "遅刻 = late for a set time; 遅れる = be delayed generally. 寝坊 = oversleeping."}, {"w": "移動", "wf": "<ruby>移動<rt>いどう</rt></ruby>", "r": "いどう", "m": "movement; moving (place to place)", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>会場<rt>かいじょう</rt></ruby>まではバスで <ruby>移動<rt>いどう</rt></ruby>します。", "We will move to the venue by bus."], ["<ruby>席<rt>せき</rt></ruby>を <ruby>移動<rt>いどう</rt></ruby>してもいいですか。", "May I move seats?"], ["<ruby>移動<rt>いどう</rt></ruby> <ruby>中<rt>ちゅう</rt></ruby>に <ruby>資料<rt>しりょう</rt></ruby>を <ruby>読<rt>よ</rt></ruby>んだ。", "I read the materials while in transit."]], "n": "引っ越し = moving house; 移動 = moving position. 移動中 = on the move."}, {"w": "料金", "wf": "<ruby>料金<rt>りょうきん</rt></ruby>", "r": "りょうきん", "m": "fee; charge; fare", "p": "noun", "t": "noun", "d": 6, "ex": [["<ruby>電気<rt>でんき</rt></ruby> <ruby>料金<rt>りょうきん</rt></ruby>が <ruby>上<rt>あ</rt></ruby>がった。", "Electricity charges went up."], ["この <ruby>駐車場<rt>ちゅうしゃじょう</rt></ruby>の <ruby>料金<rt>りょうきん</rt></ruby>は <ruby>一時間<rt>いちじかん</rt></ruby> <ruby>三百円<rt>さんびゃくえん</rt></ruby>だ。", "This parking lot's fee is 300 yen per hour."], ["<ruby>追加<rt>ついか</rt></ruby> <ruby>料金<rt>りょうきん</rt></ruby>はかかりません。", "There is no additional charge."]], "n": "料金 = charge for a service; 値段 = price of goods; 費用 = expenses overall."}, {"w": "費用", "wf": "<ruby>費用<rt>ひよう</rt></ruby>", "r": "ひよう", "m": "expense; cost", "p": "noun", "t": "noun", "d": 6, "ex": [["<ruby>旅行<rt>りょこう</rt></ruby>の <ruby>費用<rt>ひよう</rt></ruby>は <ruby>一人<rt>ひとり</rt></ruby> <ruby>五万円<rt>ごまんえん</rt></ruby>ぐらいだ。", "The cost of the trip is about 50,000 yen per person."], ["<ruby>引<rt>ひ</rt></ruby>っ <ruby>越<rt>こ</rt></ruby>しには <ruby>思<rt>おも</rt></ruby>ったより <ruby>費用<rt>ひよう</rt></ruby>がかかった。", "Moving cost more than I expected."], ["<ruby>費用<rt>ひよう</rt></ruby>を <ruby>抑<rt>おさ</rt></ruby>える <ruby>方法<rt>ほうほう</rt></ruby>を <ruby>考<rt>かんが</rt></ruby>えよう。", "Let us think of ways to keep costs down."]], "n": "費用 = total costs; 料金 = a set fee. 〜費 suffix: 交通費, 生活費, 参加費."}, {"w": "割引", "wf": "<ruby>割引<rt>わりびき</rt></ruby>", "r": "わりびき", "m": "discount", "p": "noun / suru-verb", "t": "noun", "d": 6, "ex": [["<ruby>学生<rt>がくせい</rt></ruby>は <ruby>二割引<rt>にわりびき</rt></ruby>になります。", "Students get 20 percent off."], ["<ruby>割引<rt>わりびき</rt></ruby>クーポンを <ruby>使<rt>つか</rt></ruby>った。", "I used a discount coupon."], ["この <ruby>商品<rt>しょうひん</rt></ruby>は <ruby>割引<rt>わりびき</rt></ruby>できません。", "This item cannot be discounted."]], "n": "二割引 = 20% off (割 = 10%). 学割 = student discount (abbreviation)."}, {"w": "計算", "wf": "<ruby>計算<rt>けいさん</rt></ruby>", "r": "けいさん", "m": "calculation", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>合計<rt>ごうけい</rt></ruby>を <ruby>計算<rt>けいさん</rt></ruby>してください。", "Please calculate the total."], ["<ruby>計算<rt>けいさん</rt></ruby>が <ruby>合<rt>あ</rt></ruby>わない。", "The numbers do not add up."], ["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>計算<rt>けいさん</rt></ruby>が <ruby>速<rt>はや</rt></ruby>い。", "She is quick at arithmetic."]], "n": "計算に入れる = take into account. 暗算 = mental arithmetic."}, {"w": "貯金", "wf": "<ruby>貯金<rt>ちょきん</rt></ruby>", "r": "ちょきん", "m": "savings; saving money", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>毎月<rt>まいつき</rt></ruby> <ruby>三万円<rt>さんまんえん</rt></ruby> <ruby>貯金<rt>ちょきん</rt></ruby>している。", "I save 30,000 yen every month."], ["<ruby>貯金<rt>ちょきん</rt></ruby>が <ruby>少<rt>すこ</rt></ruby>しずつ <ruby>増<rt>ふ</rt></ruby>えてきた。", "My savings have been growing little by little."], ["<ruby>旅行<rt>りょこう</rt></ruby>のために <ruby>貯金<rt>ちょきん</rt></ruby>を <ruby>始<rt>はじ</rt></ruby>めた。", "I started saving for a trip."]], "n": "貯金 = savings; 預金 (よきん) = bank deposit (formal). Verb: 貯める."}, {"w": "節約", "wf": "<ruby>節約<rt>せつやく</rt></ruby>", "r": "せつやく", "m": "saving; economizing", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>電気<rt>でんき</rt></ruby>を <ruby>節約<rt>せつやく</rt></ruby>しましょう。", "Let us save electricity."], ["<ruby>外食<rt>がいしょく</rt></ruby>を <ruby>減<rt>へ</rt></ruby>らして、 <ruby>食費<rt>しょくひ</rt></ruby>を <ruby>節約<rt>せつやく</rt></ruby>している。", "I am cutting eating out to economize on food costs."], ["<ruby>時間<rt>じかん</rt></ruby>の <ruby>節約<rt>せつやく</rt></ruby>になる <ruby>方法<rt>ほうほう</rt></ruby>を <ruby>探<rt>さが</rt></ruby>している。", "I am looking for ways to save time."]], "n": "節約 = using less; 貯金 = putting money aside. 節電・節水 = saving electricity/water."}, {"w": "給料", "wf": "<ruby>給料<rt>きゅうりょう</rt></ruby>", "r": "きゅうりょう", "m": "salary; pay", "p": "noun", "t": "noun", "d": 6, "ex": [["<ruby>給料<rt>きゅうりょう</rt></ruby>は <ruby>毎月<rt>まいつき</rt></ruby> <ruby>二十五日<rt>にじゅうごにち</rt></ruby>に <ruby>出<rt>で</rt></ruby>る。", "Pay comes out on the 25th of each month."], ["<ruby>給料<rt>きゅうりょう</rt></ruby>が <ruby>上<rt>あ</rt></ruby>がってうれしい。", "I am happy my salary went up."], ["<ruby>給料日<rt>きゅうりょうび</rt></ruby> <ruby>前<rt>まえ</rt></ruby>で、お <ruby>金<rt>かね</rt></ruby>がない。", "It is just before payday and I have no money."]], "n": "給料 = everyday word; 給与 = formal HR term. 月給/時給 = monthly/hourly pay."}, {"w": "税金", "wf": "<ruby>税金<rt>ぜいきん</rt></ruby>", "r": "ぜいきん", "m": "tax", "p": "noun", "t": "noun", "d": 6, "ex": [["<ruby>給料<rt>きゅうりょう</rt></ruby>から <ruby>税金<rt>ぜいきん</rt></ruby>が <ruby>引<rt>ひ</rt></ruby>かれる。", "Taxes are deducted from your salary."], ["<ruby>税金<rt>ぜいきん</rt></ruby>の <ruby>使<rt>つか</rt></ruby>い <ruby>方<rt>かた</rt></ruby>に <ruby>関心<rt>かんしん</rt></ruby>がある。", "I am interested in how taxes are used."], ["この <ruby>値段<rt>ねだん</rt></ruby>に <ruby>税金<rt>ぜいきん</rt></ruby>は <ruby>含<rt>ふく</rt></ruby>まれていますか。", "Is tax included in this price?"]], "n": "消費税 = consumption tax; 税込 = tax included. 〜税 suffix works widely."}, {"w": "残業", "wf": "<ruby>残業<rt>ざんぎょう</rt></ruby>", "r": "ざんぎょう", "m": "overtime work", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>今日<rt>きょう</rt></ruby>は <ruby>残業<rt>ざんぎょう</rt></ruby>で <ruby>帰<rt>かえ</rt></ruby>りが <ruby>遅<rt>おそ</rt></ruby>くなる。", "I will be home late today because of overtime."], ["<ruby>毎日<rt>まいにち</rt></ruby> <ruby>残業<rt>ざんぎょう</rt></ruby>するのは <ruby>体<rt>からだ</rt></ruby>に <ruby>良<rt>よ</rt></ruby>くない。", "Working overtime every day is not good for your health."], ["<ruby>残業代<rt>ざんぎょうだい</rt></ruby>はちゃんと <ruby>出<rt>で</rt></ruby>ますか。", "Is overtime actually paid?"]], "n": "Japan-life essential. 定時 = regular closing time; 定時で帰る = leave on time."}, {"w": "出張", "wf": "<ruby>出張<rt>しゅっちょう</rt></ruby>", "r": "しゅっちょう", "m": "business trip", "p": "noun / suru-verb", "t": "verb", "d": 6, "ex": [["<ruby>来週<rt>らいしゅう</rt></ruby>、 <ruby>大阪<rt>おおさか</rt></ruby>に <ruby>出張<rt>しゅっちょう</rt></ruby>します。", "I am going on a business trip to Osaka next week."], ["<ruby>部長<rt>ぶちょう</rt></ruby>は <ruby>今<rt>いま</rt></ruby> <ruby>出張<rt>しゅっちょう</rt></ruby> <ruby>中<rt>ちゅう</rt></ruby>です。", "The department head is away on business now."], ["<ruby>出張<rt>しゅっちょう</rt></ruby>の <ruby>予定<rt>よてい</rt></ruby>が <ruby>急<rt>きゅう</rt></ruby>に <ruby>決<rt>き</rt></ruby>まった。", "The business trip was suddenly decided."]], "n": "出張中 = away on business (phone phrase). 日帰り出張 = a day business trip."}, {"w": "進める", "wf": "<ruby>進<rt>すす</rt></ruby>める", "r": "すすめる", "m": "to advance; to move forward (work, plans)", "p": "v1 transitive", "t": "verb", "d": 7, "ex": [["<ruby>計画<rt>けいかく</rt></ruby>を <ruby>予定<rt>よてい</rt></ruby> <ruby>通<rt>どお</rt></ruby>りに <ruby>進<rt>すす</rt></ruby>めましょう。", "Let us move the plan forward as scheduled."], ["<ruby>準備<rt>じゅんび</rt></ruby>を <ruby>進<rt>すす</rt></ruby>めています。", "We are proceeding with preparations."], ["<ruby>話<rt>はなし</rt></ruby>を <ruby>先<rt>さき</rt></ruby>に <ruby>進<rt>すす</rt></ruby>めてもいいですか。", "May I move the discussion forward?"]], "n": "Homophone trap: 進める (advance) vs 勧める (recommend). Exam loves this pair."}, {"w": "勧める", "wf": "<ruby>勧<rt>すす</rt></ruby>める", "r": "すすめる", "m": "to recommend; to encourage", "p": "v1 transitive", "t": "verb", "d": 7, "ex": [["<ruby>医者<rt>いしゃ</rt></ruby>に <ruby>運動<rt>うんどう</rt></ruby>を <ruby>勧<rt>すす</rt></ruby>められた。", "The doctor recommended I exercise."], ["<ruby>友達<rt>ともだち</rt></ruby>に <ruby>勧<rt>すす</rt></ruby>められた <ruby>本<rt>ほん</rt></ruby>を <ruby>読<rt>よ</rt></ruby>んでいる。", "I am reading a book my friend recommended."], ["この <ruby>店<rt>みせ</rt></ruby>のカレーはお <ruby>勧<rt>すす</rt></ruby>めです。", "The curry at this place is recommended."]], "n": "おすすめ on menus = house recommendation. See 進める note — same reading."}, {"w": "加える", "wf": "<ruby>加<rt>くわ</rt></ruby>える", "r": "くわえる", "m": "to add", "p": "v1 transitive", "t": "verb", "d": 7, "ex": [["スープに <ruby>塩<rt>しお</rt></ruby>を <ruby>少<rt>すこ</rt></ruby>し <ruby>加<rt>くわ</rt></ruby>えてください。", "Please add a little salt to the soup."], ["リストに <ruby>名前<rt>なまえ</rt></ruby>を <ruby>加<rt>くわ</rt></ruby>えた。", "I added a name to the list."], ["<ruby>説明<rt>せつめい</rt></ruby>を <ruby>付<rt>つ</rt></ruby>け <ruby>加<rt>くわ</rt></ruby>えます。", "I will add an explanation."]], "n": "加える (vt) ↔ 加わる (vi). 〜に加えて = in addition to (N3 grammar)."}, {"w": "加わる", "wf": "<ruby>加<rt>くわ</rt></ruby>わる", "r": "くわわる", "m": "to join; to be added", "p": "v5 intransitive", "t": "verb", "d": 7, "ex": [["<ruby>新<rt>あたら</rt></ruby>しいメンバーがチームに <ruby>加<rt>くわ</rt></ruby>わった。", "A new member joined the team."], ["<ruby>議論<rt>ぎろん</rt></ruby>に <ruby>加<rt>くわ</rt></ruby>わってもいいですか。", "May I join the discussion?"], ["<ruby>寒<rt>さむ</rt></ruby>さに <ruby>風<rt>かぜ</rt></ruby>も <ruby>加<rt>くわ</rt></ruby>わって、 <ruby>外<rt>そと</rt></ruby>は <ruby>大変<rt>たいへん</rt></ruby>だ。", "With wind added to the cold, it is rough outside."]], "n": "Pair with 加える. 参加する is the suru-verb for joining events."}, {"w": "伸びる", "wf": "<ruby>伸<rt>の</rt></ruby>びる", "r": "のびる", "m": "to stretch; to grow; to improve", "p": "v1 intransitive", "t": "verb", "d": 7, "ex": [["<ruby>髪<rt>かみ</rt></ruby>がずいぶん <ruby>伸<rt>の</rt></ruby>びましたね。", "Your hair has grown quite a bit."], ["<ruby>日本語<rt>にほんご</rt></ruby>の <ruby>力<rt>ちから</rt></ruby>が <ruby>伸<rt>の</rt></ruby>びてきた。", "My Japanese ability has been improving."], ["<ruby>売<rt>う</rt></ruby>り <ruby>上<rt>あ</rt></ruby>げが <ruby>伸<rt>の</rt></ruby>びている。", "Sales are growing."]], "n": "Growth in length/ability/sales. Pair: 伸ばす (vt). ラーメンが伸びる = noodles go soggy."}, {"w": "伸ばす", "wf": "<ruby>伸<rt>の</rt></ruby>ばす", "r": "のばす", "m": "to stretch out; to grow (hair); to develop", "p": "v5 transitive", "t": "verb", "d": 7, "ex": [["<ruby>手<rt>て</rt></ruby>を <ruby>伸<rt>の</rt></ruby>ばして、 <ruby>棚<rt>たな</rt></ruby>の <ruby>上<rt>うえ</rt></ruby>の <ruby>本<rt>ほん</rt></ruby>を <ruby>取<rt>と</rt></ruby>った。", "I stretched out my hand and took the book from the shelf."], ["<ruby>髪<rt>かみ</rt></ruby>を <ruby>伸<rt>の</rt></ruby>ばすことにした。", "I decided to grow my hair out."], ["<ruby>子<rt>こ</rt></ruby>どもの <ruby>長所<rt>ちょうしょ</rt></ruby>を <ruby>伸<rt>の</rt></ruby>ばしたい。", "I want to develop my child's strengths."]], "n": "Pair: 伸びる (vi). 背筋を伸ばす = straighten your back."}, {"w": "支える", "wf": "<ruby>支<rt>ささ</rt></ruby>える", "r": "ささえる", "m": "to support", "p": "v1 transitive", "t": "verb", "d": 7, "ex": [["<ruby>家族<rt>かぞく</rt></ruby>を <ruby>支<rt>ささ</rt></ruby>えるために <ruby>働<rt>はたら</rt></ruby>いている。", "I work to support my family."], ["<ruby>倒<rt>たお</rt></ruby>れそうな <ruby>木<rt>き</rt></ruby>を <ruby>棒<rt>ぼう</rt></ruby>で <ruby>支<rt>ささ</rt></ruby>えた。", "We propped up the tree that was about to fall with a pole."], ["<ruby>多<rt>おお</rt></ruby>くの <ruby>人<rt>ひと</rt></ruby>に <ruby>支<rt>ささ</rt></ruby>えられて、ここまで <ruby>来<rt>こ</rt></ruby>られた。", "Supported by many people, I have made it this far."]], "n": "Physical and emotional support. Speech staple: 支えてくれた皆さん."}, {"w": "助かる", "wf": "<ruby>助<rt>たす</rt></ruby>かる", "r": "たすかる", "m": "to be saved; to be a great help", "p": "v5 intransitive", "t": "verb", "d": 7, "ex": [["<ruby>手伝<rt>てつだ</rt></ruby>ってくれて、 <ruby>助<rt>たす</rt></ruby>かりました。", "Thanks for helping — that was a big help."], ["<ruby>乗客<rt>じょうきゃく</rt></ruby>は <ruby>全員<rt>ぜんいん</rt></ruby> <ruby>助<rt>たす</rt></ruby>かった。", "All the passengers were saved."], ["<ruby>家賃<rt>やちん</rt></ruby>が <ruby>安<rt>やす</rt></ruby>いと <ruby>助<rt>たす</rt></ruby>かる。", "Cheap rent really helps."]], "n": "助かります = softened thank-you in business. Pair: 助ける (vt, N4)."}, {"w": "防ぐ", "wf": "<ruby>防<rt>ふせ</rt></ruby>ぐ", "r": "ふせぐ", "m": "to prevent; to protect against", "p": "v5 transitive", "t": "verb", "d": 7, "ex": [["<ruby>手洗<rt>てあら</rt></ruby>いで <ruby>病気<rt>びょうき</rt></ruby>を <ruby>防<rt>ふせ</rt></ruby>ぐことができる。", "You can prevent illness by washing your hands."], ["<ruby>事故<rt>じこ</rt></ruby>を <ruby>防<rt>ふせ</rt></ruby>ぐために、スピードを <ruby>落<rt>お</rt></ruby>としてください。", "To prevent accidents, please reduce speed."], ["カーテンで <ruby>寒<rt>さむ</rt></ruby>さを <ruby>防<rt>ふせ</rt></ruby>いだ。", "We kept out the cold with curtains."]], "n": "予防 = prevention (medical). 防犯 = crime prevention."}, {"w": "避ける", "wf": "<ruby>避<rt>さ</rt></ruby>ける", "r": "さける", "m": "to avoid", "p": "v1 transitive", "t": "verb", "d": 7, "ex": [["ラッシュアワーを <ruby>避<rt>さ</rt></ruby>けて <ruby>出<rt>で</rt></ruby>かけた。", "I went out avoiding rush hour."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>最近<rt>さいきん</rt></ruby>、 <ruby>私<rt>わたし</rt></ruby>を <ruby>避<rt>さ</rt></ruby>けている <ruby>気<rt>き</rt></ruby>がする。", "I feel like he has been avoiding me lately."], ["<ruby>危険<rt>きけん</rt></ruby>な <ruby>場所<rt>ばしょ</rt></ruby>は <ruby>避<rt>さ</rt></ruby>けた <ruby>方<rt>ほう</rt></ruby>がいい。", "It is better to avoid dangerous places."]], "n": "〜を避けるため often in notices. 避難 (ひなん) = evacuation, same kanji."}, {"w": "追う", "wf": "<ruby>追<rt>お</rt></ruby>う", "r": "おう", "m": "to chase; to pursue", "p": "v5 transitive", "t": "verb", "d": 7, "ex": [["<ruby>警察<rt>けいさつ</rt></ruby>が <ruby>犯人<rt>はんにん</rt></ruby>を <ruby>追<rt>お</rt></ruby>っている。", "The police are pursuing the culprit."], ["<ruby>流行<rt>りゅうこう</rt></ruby>を <ruby>追<rt>お</rt></ruby>うのに <ruby>疲<rt>つか</rt></ruby>れた。", "I am tired of chasing trends."], ["<ruby>毎日<rt>まいにち</rt></ruby>、 <ruby>仕事<rt>しごと</rt></ruby>に <ruby>追<rt>お</rt></ruby>われている。", "Every day I am swamped with work."]], "n": "追われる (passive) = be pressed by. 追いつく = catch up; 追い越す = overtake."}, {"w": "落ち着く", "wf": "<ruby>落<rt>お</rt></ruby>ち <ruby>着<rt>つ</rt></ruby>く", "r": "おちつく", "m": "to calm down; to settle down", "p": "v5 intransitive", "t": "verb", "d": 7, "ex": [["<ruby>深呼吸<rt>しんこきゅう</rt></ruby>をして、 <ruby>気持<rt>きも</rt></ruby>ちを <ruby>落<rt>お</rt></ruby>ち <ruby>着<rt>つ</rt></ruby>かせた。", "I took a deep breath and calmed myself down."], ["この <ruby>喫茶店<rt>きっさてん</rt></ruby>は <ruby>落<rt>お</rt></ruby>ち <ruby>着<rt>つ</rt></ruby>いた <ruby>雰囲気<rt>ふんいき</rt></ruby>だ。", "This cafe has a calm atmosphere."], ["<ruby>新<rt>あたら</rt></ruby>しい <ruby>生活<rt>せいかつ</rt></ruby>にやっと <ruby>落<rt>お</rt></ruby>ち <ruby>着<rt>つ</rt></ruby>いてきた。", "I have finally settled into my new life."]], "n": "落ち着いて！ = Calm down! 落ち着いた色 = subdued colour."}, {"w": "慌てる", "wf": "<ruby>慌<rt>あわ</rt></ruby>てる", "r": "あわてる", "m": "to panic; to be flustered", "p": "v1 intransitive", "t": "verb", "d": 7, "ex": [["<ruby>地震<rt>じしん</rt></ruby>のときは、 <ruby>慌<rt>あわ</rt></ruby>てないで <ruby>行動<rt>こうどう</rt></ruby>しましょう。", "In an earthquake, act without panicking."], ["<ruby>時間<rt>じかん</rt></ruby>に <ruby>遅<rt>おく</rt></ruby>れそうで、 <ruby>慌<rt>あわ</rt></ruby>てて <ruby>家<rt>いえ</rt></ruby>を <ruby>出<rt>で</rt></ruby>た。", "About to be late, I rushed out of the house."], ["そんなに <ruby>慌<rt>あわ</rt></ruby>てなくても <ruby>大丈夫<rt>だいじょうぶ</rt></ruby>ですよ。", "You do not need to be in such a rush."]], "n": "慌てて = in a fluster. Opposite: 落ち着く."}, {"w": "貯める", "wf": "<ruby>貯<rt>た</rt></ruby>める", "r": "ためる", "m": "to save up (money, points)", "p": "v1 transitive", "t": "verb", "d": 7, "ex": [["<ruby>車<rt>くるま</rt></ruby>を <ruby>買<rt>か</rt></ruby>うために、お <ruby>金<rt>かね</rt></ruby>を <ruby>貯<rt>た</rt></ruby>めている。", "I am saving money to buy a car."], ["ポイントを <ruby>貯<rt>た</rt></ruby>めると、 <ruby>割引<rt>わりびき</rt></ruby>が <ruby>受<rt>う</rt></ruby>けられる。", "If you collect points, you can get discounts."], ["<ruby>百万円<rt>ひゃくまんえん</rt></ruby> <ruby>貯<rt>た</rt></ruby>めるのに <ruby>二年<rt>にねん</rt></ruby>かかった。", "It took two years to save one million yen."]], "n": "貯める (vt) ↔ 貯まる/溜まる (vi). Related noun: 貯金."}, {"w": "溜まる", "wf": "<ruby>溜<rt>た</rt></ruby>まる", "r": "たまる", "m": "to accumulate; to build up", "p": "v5 intransitive", "t": "verb", "d": 7, "ex": [["ストレスが <ruby>溜<rt>た</rt></ruby>まっている。", "Stress has been building up."], ["やることが <ruby>溜<rt>た</rt></ruby>まって、 <ruby>大変<rt>たいへん</rt></ruby>だ。", "Things to do have piled up — it is rough."], ["<ruby>洗濯物<rt>せんたくもの</rt></ruby>が <ruby>溜<rt>た</rt></ruby>まってしまった。", "The laundry has piled up."]], "n": "ストレスが溜まる is the collocation. Money sense usually written 貯まる."}, {"w": "稼ぐ", "wf": "<ruby>稼<rt>かせ</rt></ruby>ぐ", "r": "かせぐ", "m": "to earn", "p": "v5 transitive", "t": "verb", "d": 7, "ex": [["アルバイトで <ruby>学費<rt>がくひ</rt></ruby>を <ruby>稼<rt>かせ</rt></ruby>いでいる。", "I am earning my tuition through a part-time job."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>若<rt>わか</rt></ruby>いうちにたくさん <ruby>稼<rt>かせ</rt></ruby>ぎたいと <ruby>言<rt>い</rt></ruby>っている。", "He says he wants to earn a lot while he is young."], ["<ruby>時間<rt>じかん</rt></ruby>を <ruby>稼<rt>かせ</rt></ruby>ぐために、 <ruby>質問<rt>しつもん</rt></ruby>を <ruby>続<rt>つづ</rt></ruby>けた。", "I kept asking questions to buy time."]], "n": "時間を稼ぐ = buy time. もうける = make a profit (business nuance)."}, {"w": "片付ける", "wf": "<ruby>片付<rt>かたづ</rt></ruby>ける", "r": "かたづける", "m": "to tidy up; to put away; to finish off", "p": "v1 transitive", "t": "verb", "d": 7, "ex": [["<ruby>部屋<rt>へや</rt></ruby>を <ruby>片付<rt>かたづ</rt></ruby>けてから <ruby>出<rt>で</rt></ruby>かけよう。", "Let us tidy the room before going out."], ["<ruby>机<rt>つくえ</rt></ruby>の <ruby>上<rt>うえ</rt></ruby>の <ruby>書類<rt>しょるい</rt></ruby>を <ruby>片付<rt>かたづ</rt></ruby>けた。", "I cleared away the documents on the desk."], ["<ruby>先<rt>さき</rt></ruby>にこの <ruby>仕事<rt>しごと</rt></ruby>を <ruby>片付<rt>かたづ</rt></ruby>けてしまいたい。", "I want to knock out this job first."]], "n": "Rooms and tasks both. 片付く (vi) = get tidied. 整理する = organize (formal)."}, {"w": "汚れる", "wf": "<ruby>汚<rt>よご</rt></ruby>れる", "r": "よごれる", "m": "to get dirty", "p": "v1 intransitive", "t": "verb", "d": 7, "ex": [["<ruby>白<rt>しろ</rt></ruby>いシャツはすぐ <ruby>汚<rt>よご</rt></ruby>れる。", "White shirts get dirty quickly."], ["<ruby>靴<rt>くつ</rt></ruby>が <ruby>泥<rt>どろ</rt></ruby>で <ruby>汚<rt>よご</rt></ruby>れてしまった。", "My shoes got dirty with mud."], ["<ruby>汚<rt>よご</rt></ruby>れた <ruby>手<rt>て</rt></ruby>で <ruby>食<rt>た</rt></ruby>べ <ruby>物<rt>もの</rt></ruby>に <ruby>触<rt>さわ</rt></ruby>らないで。", "Do not touch food with dirty hands."]], "n": "汚れる (vi) ↔ 汚す (vt). 汚い (きたない) = dirty (adjective)."}, {"w": "触れる", "wf": "<ruby>触<rt>ふ</rt></ruby>れる", "r": "ふれる", "m": "to touch; to touch on (a topic)", "p": "v1 intransitive", "t": "verb", "d": 7, "ex": [["<ruby>展示品<rt>てんじひん</rt></ruby>に <ruby>触<rt>ふ</rt></ruby>れないでください。", "Please do not touch the exhibits."], ["スピーチで <ruby>彼<rt>かれ</rt></ruby>は <ruby>環境<rt>かんきょう</rt></ruby> <ruby>問題<rt>もんだい</rt></ruby>に <ruby>触<rt>ふ</rt></ruby>れた。", "In his speech, he touched on environmental issues."], ["<ruby>日本<rt>にほん</rt></ruby>の <ruby>文化<rt>ぶんか</rt></ruby>に <ruby>触<rt>ふ</rt></ruby>れる <ruby>機会<rt>きかい</rt></ruby>が <ruby>増<rt>ふ</rt></ruby>えた。", "Opportunities to experience Japanese culture have increased."]], "n": "触る (さわる) = physically touch (casual); 触れる = light touch / touch on / come into contact with."}, {"w": "抱える", "wf": "<ruby>抱<rt>かか</rt></ruby>える", "r": "かかえる", "m": "to hold in one's arms; to have (problems, debt)", "p": "v1 transitive", "t": "verb", "d": 7, "ex": [["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>大<rt>おお</rt></ruby>きな <ruby>荷物<rt>にもつ</rt></ruby>を <ruby>抱<rt>かか</rt></ruby>えて <ruby>歩<rt>ある</rt></ruby>いていた。", "She was walking holding a big load in her arms."], ["<ruby>多<rt>おお</rt></ruby>くの <ruby>人<rt>ひと</rt></ruby>が <ruby>悩<rt>なや</rt></ruby>みを <ruby>抱<rt>かか</rt></ruby>えている。", "Many people carry worries."], ["<ruby>会社<rt>かいしゃ</rt></ruby>は <ruby>大<rt>おお</rt></ruby>きな <ruby>問題<rt>もんだい</rt></ruby>を <ruby>抱<rt>かか</rt></ruby>えている。", "The company has a big problem on its hands."]], "n": "Abstract use (問題を抱える) is the exam use. 頭を抱える = be at wits' end."}, {"w": "破る", "wf": "<ruby>破<rt>やぶ</rt></ruby>る", "r": "やぶる", "m": "to tear; to break (promise, rule, record)", "p": "v5 transitive", "t": "verb", "d": 7, "ex": [["<ruby>約束<rt>やくそく</rt></ruby>を <ruby>破<rt>やぶ</rt></ruby>ってはいけない。", "You must not break promises."], ["<ruby>弟<rt>おとうと</rt></ruby>が <ruby>大事<rt>だいじ</rt></ruby>な <ruby>手紙<rt>てがみ</rt></ruby>を <ruby>破<rt>やぶ</rt></ruby>ってしまった。", "My little brother tore up an important letter."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>大会<rt>たいかい</rt></ruby>の <ruby>記録<rt>きろく</rt></ruby>を <ruby>破<rt>やぶ</rt></ruby>った。", "He broke the tournament record."]], "n": "Opposite of 守る (batch 1). 破れる (vi) = get torn."}, {"w": "離れる", "wf": "<ruby>離<rt>はな</rt></ruby>れる", "r": "はなれる", "m": "to leave; to be separated; to be distant", "p": "v1 intransitive", "t": "verb", "d": 7, "ex": [["<ruby>大学<rt>だいがく</rt></ruby> <ruby>入学<rt>にゅうがく</rt></ruby>のとき、 <ruby>家族<rt>かぞく</rt></ruby>と <ruby>離<rt>はな</rt></ruby>れて <ruby>暮<rt>く</rt></ruby>らし <ruby>始<rt>はじ</rt></ruby>めた。", "When I entered university, I began living apart from my family."], ["<ruby>駅<rt>えき</rt></ruby>から <ruby>少<rt>すこ</rt></ruby>し <ruby>離<rt>はな</rt></ruby>れた <ruby>静<rt>しず</rt></ruby>かな <ruby>場所<rt>ばしょ</rt></ruby>に <ruby>住<rt>す</rt></ruby>んでいる。", "I live in a quiet place a little away from the station."], ["<ruby>仕事<rt>しごと</rt></ruby>のことが <ruby>頭<rt>あたま</rt></ruby>から <ruby>離<rt>はな</rt></ruby>れない。", "I cannot get work off my mind."]], "n": "離れる (vi) ↔ 離す (vt). 目を離す = take one's eyes off."}, {"w": "移る", "wf": "<ruby>移<rt>うつ</rt></ruby>る", "r": "うつる", "m": "to move to; to transfer; to shift", "p": "v5 intransitive", "t": "verb", "d": 7, "ex": [["<ruby>来月<rt>らいげつ</rt></ruby>、 <ruby>新<rt>あたら</rt></ruby>しい <ruby>部署<rt>ぶしょ</rt></ruby>に <ruby>移<rt>うつ</rt></ruby>ります。", "Next month I am moving to a new department."], ["<ruby>話題<rt>わだい</rt></ruby>が <ruby>別<rt>べつ</rt></ruby>の <ruby>話<rt>はなし</rt></ruby>に <ruby>移<rt>うつ</rt></ruby>った。", "The topic shifted to something else."], ["<ruby>風邪<rt>かぜ</rt></ruby>が <ruby>家族<rt>かぞく</rt></ruby>に <ruby>移<rt>うつ</rt></ruby>ってしまった。", "The cold spread to my family."]], "n": "Also = a cold being passed on. 引っ越す = move house (everyday). 移す (vt)."}, {"w": "預ける", "wf": "<ruby>預<rt>あず</rt></ruby>ける", "r": "あずける", "m": "to deposit; to leave in someone's care", "p": "v1 transitive", "t": "verb", "d": 7, "ex": [["<ruby>銀行<rt>ぎんこう</rt></ruby>にお <ruby>金<rt>かね</rt></ruby>を <ruby>預<rt>あず</rt></ruby>けている。", "I keep my money in the bank."], ["<ruby>子<rt>こ</rt></ruby>どもを <ruby>保育園<rt>ほいくえん</rt></ruby>に <ruby>預<rt>あず</rt></ruby>けて <ruby>働<rt>はたら</rt></ruby>いている。", "I leave my child at daycare and work."], ["ホテルのフロントに <ruby>荷物<rt>にもつ</rt></ruby>を <ruby>預<rt>あず</rt></ruby>けた。", "I left my luggage at the hotel front desk."]], "n": "Pair: 預ける (give into care) ↔ 預かる (take into care). Both exam regulars."}, {"w": "預かる", "wf": "<ruby>預<rt>あず</rt></ruby>かる", "r": "あずかる", "m": "to look after; to keep (for someone)", "p": "v5 transitive", "t": "verb", "d": 7, "ex": [["<ruby>友達<rt>ともだち</rt></ruby>の <ruby>犬<rt>いぬ</rt></ruby>を <ruby>一週間<rt>いっしゅうかん</rt></ruby> <ruby>預<rt>あず</rt></ruby>かることになった。", "I ended up looking after my friend's dog for a week."], ["お <ruby>荷物<rt>にもつ</rt></ruby>をお <ruby>預<rt>あず</rt></ruby>かりします。", "I will take your luggage. (service phrase)"], ["<ruby>隣<rt>となり</rt></ruby>の <ruby>家<rt>いえ</rt></ruby>の <ruby>鍵<rt>かぎ</rt></ruby>を <ruby>預<rt>あず</rt></ruby>かっている。", "I am keeping the neighbor's key."]], "n": "Direction matters: 預ける = hand over; 預かる = receive to look after. Shop phrase: 一万円お預かりします."}, {"w": "過去", "wf": "<ruby>過去<rt>かこ</rt></ruby>", "r": "かこ", "m": "the past", "p": "noun", "t": "noun", "d": 8, "ex": [["<ruby>過去<rt>かこ</rt></ruby>のことを <ruby>気<rt>き</rt></ruby>にしすぎない <ruby>方<rt>ほう</rt></ruby>がいい。", "It is better not to worry too much about the past."], ["この <ruby>町<rt>まち</rt></ruby>は <ruby>過去<rt>かこ</rt></ruby> <ruby>十年<rt>じゅうねん</rt></ruby>で <ruby>大<rt>おお</rt></ruby>きく <ruby>変<rt>か</rt></ruby>わった。", "This town has changed greatly in the past ten years."], ["<ruby>過去<rt>かこ</rt></ruby>の <ruby>試験<rt>しけん</rt></ruby> <ruby>問題<rt>もんだい</rt></ruby>を <ruby>解<rt>と</rt></ruby>いてみよう。", "Let us try solving past exam questions."]], "n": "過去問 (かこもん) = past exam papers — you will use this word a lot. Set: 過去・現在・未来."}, {"w": "当時", "wf": "<ruby>当時<rt>とうじ</rt></ruby>", "r": "とうじ", "m": "at that time; in those days", "p": "noun / adverb", "t": "noun", "d": 8, "ex": [["<ruby>当時<rt>とうじ</rt></ruby>、 <ruby>私<rt>わたし</rt></ruby>はまだ <ruby>学生<rt>がくせい</rt></ruby>だった。", "At that time, I was still a student."], ["<ruby>当時<rt>とうじ</rt></ruby>の <ruby>写真<rt>しゃしん</rt></ruby>を <ruby>見<rt>み</rt></ruby>ると <ruby>懐<rt>なつ</rt></ruby>かしい。", "Looking at photos from those days makes me nostalgic."], ["<ruby>事故<rt>じこ</rt></ruby> <ruby>当時<rt>とうじ</rt></ruby>の <ruby>状況<rt>じょうきょう</rt></ruby>を <ruby>説明<rt>せつめい</rt></ruby>した。", "I explained the situation at the time of the accident."]], "n": "Points to a past time already mentioned. その時 is the plain version."}, {"w": "記録", "wf": "<ruby>記録<rt>きろく</rt></ruby>", "r": "きろく", "m": "record", "p": "noun / suru-verb", "t": "noun", "d": 8, "ex": [["<ruby>毎日<rt>まいにち</rt></ruby>の <ruby>勉強<rt>べんきょう</rt></ruby> <ruby>時間<rt>じかん</rt></ruby>を <ruby>記録<rt>きろく</rt></ruby>している。", "I keep a record of my daily study time."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>世界<rt>せかい</rt></ruby> <ruby>記録<rt>きろく</rt></ruby>を <ruby>持<rt>も</rt></ruby>っている。", "He holds the world record."], ["<ruby>会議<rt>かいぎ</rt></ruby>の <ruby>内容<rt>ないよう</rt></ruby>を <ruby>記録<rt>きろく</rt></ruby>に <ruby>残<rt>のこ</rt></ruby>した。", "We kept a record of the meeting's contents."]], "n": "Sports records and written records. 記録的な暑さ = record heat."}, {"w": "記憶", "wf": "<ruby>記憶<rt>きおく</rt></ruby>", "r": "きおく", "m": "memory", "p": "noun / suru-verb", "t": "noun", "d": 8, "ex": [["<ruby>子<rt>こ</rt></ruby>どもの <ruby>頃<rt>ころ</rt></ruby>の <ruby>記憶<rt>きおく</rt></ruby>があまりない。", "I do not have many memories from childhood."], ["その <ruby>日<rt>ひ</rt></ruby>のことは、はっきり <ruby>記憶<rt>きおく</rt></ruby>している。", "I remember that day clearly."], ["<ruby>人<rt>ひと</rt></ruby>の <ruby>名前<rt>なまえ</rt></ruby>を <ruby>記憶<rt>きおく</rt></ruby>するのが <ruby>苦手<rt>にがて</rt></ruby>だ。", "I am bad at memorizing people's names."]], "n": "記憶 = memory (faculty/stored); 思い出 = cherished memories. 記憶力 = memory power."}, {"w": "記事", "wf": "<ruby>記事<rt>きじ</rt></ruby>", "r": "きじ", "m": "article (news)", "p": "noun", "t": "noun", "d": 8, "ex": [["<ruby>新聞<rt>しんぶん</rt></ruby>の <ruby>記事<rt>きじ</rt></ruby>を <ruby>読<rt>よ</rt></ruby>んで、その <ruby>事件<rt>じけん</rt></ruby>を <ruby>知<rt>し</rt></ruby>った。", "I learned of the incident from a newspaper article."], ["この <ruby>記事<rt>きじ</rt></ruby>によると、 <ruby>物価<rt>ぶっか</rt></ruby>はまだ <ruby>上<rt>あ</rt></ruby>がるらしい。", "According to this article, prices will apparently keep rising."], ["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>雑誌<rt>ざっし</rt></ruby>に <ruby>記事<rt>きじ</rt></ruby>を <ruby>書<rt>か</rt></ruby>いている。", "She writes articles for a magazine."]], "n": "記事によると〜らしい/そうだ = reported-speech pattern on the exam."}, {"w": "放送", "wf": "<ruby>放送<rt>ほうそう</rt></ruby>", "r": "ほうそう", "m": "broadcast; announcement", "p": "noun / suru-verb", "t": "noun", "d": 8, "ex": [["その <ruby>番組<rt>ばんぐみ</rt></ruby>は <ruby>毎週<rt>まいしゅう</rt></ruby> <ruby>日曜日<rt>にちようび</rt></ruby>に <ruby>放送<rt>ほうそう</rt></ruby>される。", "That program is broadcast every Sunday."], ["<ruby>試合<rt>しあい</rt></ruby>の <ruby>様子<rt>ようす</rt></ruby>が <ruby>生<rt>なま</rt></ruby>で <ruby>放送<rt>ほうそう</rt></ruby>された。", "The match was broadcast live."], ["<ruby>駅<rt>えき</rt></ruby>の <ruby>放送<rt>ほうそう</rt></ruby>が <ruby>聞<rt>き</rt></ruby>き <ruby>取<rt>と</rt></ruby>れなかった。", "I could not catch the station announcement."]], "n": "Station and in-store announcements are also 放送. 生放送 = live broadcast."}, {"w": "翻訳", "wf": "<ruby>翻訳<rt>ほんやく</rt></ruby>", "r": "ほんやく", "m": "translation (written)", "p": "noun / suru-verb", "t": "noun", "d": 8, "ex": [["この <ruby>小説<rt>しょうせつ</rt></ruby>は <ruby>多<rt>おお</rt></ruby>くの <ruby>言語<rt>げんご</rt></ruby>に <ruby>翻訳<rt>ほんやく</rt></ruby>されている。", "This novel has been translated into many languages."], ["<ruby>日本語<rt>にほんご</rt></ruby>の <ruby>記事<rt>きじ</rt></ruby>を <ruby>英語<rt>えいご</rt></ruby>に <ruby>翻訳<rt>ほんやく</rt></ruby>した。", "I translated a Japanese article into English."], ["<ruby>翻訳<rt>ほんやく</rt></ruby>アプリは <ruby>便利<rt>べんり</rt></ruby>だが、 <ruby>完全<rt>かんぜん</rt></ruby>ではない。", "Translation apps are handy but not perfect."]], "n": "翻訳 = written; 通訳 (つうやく) = interpreting (spoken)."}, {"w": "誤解", "wf": "<ruby>誤解<rt>ごかい</rt></ruby>", "r": "ごかい", "m": "misunderstanding", "p": "noun / suru-verb", "t": "noun", "d": 8, "ex": [["<ruby>私<rt>わたし</rt></ruby>の <ruby>言<rt>い</rt></ruby>い <ruby>方<rt>かた</rt></ruby>が <ruby>悪<rt>わる</rt></ruby>くて、 <ruby>誤解<rt>ごかい</rt></ruby>させてしまった。", "My phrasing was bad and caused a misunderstanding."], ["それは <ruby>誤解<rt>ごかい</rt></ruby>です。", "That is a misunderstanding."], ["<ruby>誤解<rt>ごかい</rt></ruby>を <ruby>解<rt>と</rt></ruby>くために、 <ruby>直接<rt>ちょくせつ</rt></ruby> <ruby>話<rt>はな</rt></ruby>した。", "To clear up the misunderstanding, I spoke directly."]], "n": "誤解を招く = invite misunderstanding; 誤解を解く = clear it up."}, {"w": "通じる", "wf": "<ruby>通<rt>つう</rt></ruby>じる", "r": "つうじる", "m": "to get through; to be understood; to lead to", "p": "v1 intransitive", "t": "verb", "d": 8, "ex": [["<ruby>私<rt>わたし</rt></ruby>の <ruby>日本語<rt>にほんご</rt></ruby>は <ruby>何<rt>なん</rt></ruby>とか <ruby>通<rt>つう</rt></ruby>じた。", "My Japanese somehow got through."], ["<ruby>電話<rt>でんわ</rt></ruby>が <ruby>通<rt>つう</rt></ruby>じない。", "I cannot get through on the phone."], ["この <ruby>道<rt>みち</rt></ruby>は <ruby>駅前<rt>えきまえ</rt></ruby>に <ruby>通<rt>つう</rt></ruby>じている。", "This road leads to the station front."]], "n": "話が通じない = we are not communicating. 共通 shares the kanji."}, {"w": "測る", "wf": "<ruby>測<rt>はか</rt></ruby>る", "r": "はかる", "m": "to measure", "p": "v5 transitive", "t": "verb", "d": 8, "ex": [["<ruby>熱<rt>ねつ</rt></ruby>を <ruby>測<rt>はか</rt></ruby>ったら、 <ruby>三十八度<rt>さんじゅうはちど</rt></ruby>あった。", "When I took my temperature, it was 38 degrees."], ["<ruby>部屋<rt>へや</rt></ruby>の <ruby>広<rt>ひろ</rt></ruby>さを <ruby>測<rt>はか</rt></ruby>ってから、 <ruby>家具<rt>かぐ</rt></ruby>を <ruby>買<rt>か</rt></ruby>おう。", "Let us measure the room before buying furniture."], ["<ruby>走<rt>はし</rt></ruby>る <ruby>速<rt>はや</rt></ruby>さを <ruby>測<rt>はか</rt></ruby>ってみた。", "I tried measuring my running speed."]], "n": "Kanji trio: 測る (length/temp), 量る (weight/volume), 計る (time). N3 kanji-section bait."}, {"w": "数える", "wf": "<ruby>数<rt>かぞ</rt></ruby>える", "r": "かぞえる", "m": "to count", "p": "v1 transitive", "t": "verb", "d": 8, "ex": [["<ruby>参加者<rt>さんかしゃ</rt></ruby>の <ruby>数<rt>かず</rt></ruby>を <ruby>数<rt>かぞ</rt></ruby>えてください。", "Please count the number of participants."], ["<ruby>眠<rt>ねむ</rt></ruby>れないときは <ruby>羊<rt>ひつじ</rt></ruby>を <ruby>数<rt>かぞ</rt></ruby>える。", "When I cannot sleep, I count sheep."], ["<ruby>数<rt>かぞ</rt></ruby>えきれないほど <ruby>失敗<rt>しっぱい</rt></ruby>した。", "I have failed more times than I can count."]], "n": "数えきれない = countless (V-stem＋きれない, N3 grammar)."}, {"w": "平均", "wf": "<ruby>平均<rt>へいきん</rt></ruby>", "r": "へいきん", "m": "average", "p": "noun / suru-verb", "t": "noun", "d": 8, "ex": [["クラスの <ruby>平均<rt>へいきん</rt></ruby> <ruby>点<rt>てん</rt></ruby>は <ruby>七十点<rt>ななじゅってん</rt></ruby>だった。", "The class average was 70 points."], ["<ruby>一日<rt>いちにち</rt></ruby> <ruby>平均<rt>へいきん</rt></ruby> <ruby>二時間<rt>にじかん</rt></ruby> <ruby>勉強<rt>べんきょう</rt></ruby>している。", "I study an average of two hours a day."], ["<ruby>日本人<rt>にほんじん</rt></ruby>の <ruby>平均<rt>へいきん</rt></ruby> <ruby>寿命<rt>じゅみょう</rt></ruby>は <ruby>長<rt>なが</rt></ruby>い。", "The average lifespan of Japanese people is long."]], "n": "平均点 = average score — you will track this on mocks."}, {"w": "割合", "wf": "<ruby>割合<rt>わりあい</rt></ruby>", "r": "わりあい", "m": "ratio; percentage", "p": "noun", "t": "noun", "d": 8, "ex": [["<ruby>外国人<rt>がいこくじん</rt></ruby> <ruby>社員<rt>しゃいん</rt></ruby>の <ruby>割合<rt>わりあい</rt></ruby>が <ruby>増<rt>ふ</rt></ruby>えている。", "The proportion of foreign employees is increasing."], ["<ruby>三人<rt>さんにん</rt></ruby>に <ruby>一人<rt>ひとり</rt></ruby>の <ruby>割合<rt>わりあい</rt></ruby>で <ruby>眼鏡<rt>めがね</rt></ruby>をかけている。", "One in three people wears glasses."], ["<ruby>賛成<rt>さんせい</rt></ruby>と <ruby>反対<rt>はんたい</rt></ruby>の <ruby>割合<rt>わりあい</rt></ruby>は <ruby>半々<rt>はんはん</rt></ruby>だった。", "The ratio of for and against was fifty-fifty."]], "n": "Graph-question word (listening/reading). 割 = 10% (三割 = 30%)."}, {"w": "程度", "wf": "<ruby>程度<rt>ていど</rt></ruby>", "r": "ていど", "m": "degree; extent; about", "p": "noun", "t": "noun", "d": 8, "ex": [["<ruby>被害<rt>ひがい</rt></ruby>の <ruby>程度<rt>ていど</rt></ruby>はまだ <ruby>分<rt>わ</rt></ruby>からない。", "The extent of the damage is still unknown."], ["<ruby>十五分<rt>じゅうごふん</rt></ruby> <ruby>程度<rt>ていど</rt></ruby> <ruby>休<rt>やす</rt></ruby>みましょう。", "Let us rest for about fifteen minutes."], ["<ruby>冗談<rt>じょうだん</rt></ruby>にも <ruby>程度<rt>ていど</rt></ruby>がある。", "Even jokes have their limits."]], "n": "N＋程度 = about (like ぐらい, but formal). ある程度 = to some extent."}, {"w": "特徴", "wf": "<ruby>特徴<rt>とくちょう</rt></ruby>", "r": "とくちょう", "m": "characteristic; feature", "p": "noun", "t": "noun", "d": 8, "ex": [["この <ruby>犬<rt>いぬ</rt></ruby>の <ruby>特徴<rt>とくちょう</rt></ruby>は <ruby>耳<rt>みみ</rt></ruby>が <ruby>大<rt>おお</rt></ruby>きいことだ。", "This dog's distinctive feature is its big ears."], ["それぞれの <ruby>地方<rt>ちほう</rt></ruby>に <ruby>食文化<rt>しょくぶんか</rt></ruby>の <ruby>特徴<rt>とくちょう</rt></ruby>がある。", "Each region has its own distinctive food culture."], ["<ruby>犯人<rt>はんにん</rt></ruby>の <ruby>特徴<rt>とくちょう</rt></ruby>を <ruby>警察<rt>けいさつ</rt></ruby>に <ruby>伝<rt>つた</rt></ruby>えた。", "I described the culprit's features to the police."]], "n": "特徴 = neutral feature; 長所/短所 = strong/weak points."}, {"w": "共通", "wf": "<ruby>共通<rt>きょうつう</rt></ruby>", "r": "きょうつう", "m": "common; shared", "p": "noun / suru-verb / na-adjective", "t": "noun", "d": 8, "ex": [["<ruby>二人<rt>ふたり</rt></ruby>には <ruby>共通<rt>きょうつう</rt></ruby>の <ruby>趣味<rt>しゅみ</rt></ruby>がある。", "The two have a common hobby."], ["この <ruby>問題<rt>もんだい</rt></ruby>は <ruby>多<rt>おお</rt></ruby>くの <ruby>国<rt>くに</rt></ruby>に <ruby>共通<rt>きょうつう</rt></ruby>している。", "This problem is common to many countries."], ["<ruby>共通点<rt>きょうつうてん</rt></ruby>が <ruby>多<rt>おお</rt></ruby>いほど、 <ruby>話<rt>はなし</rt></ruby>が <ruby>合<rt>あ</rt></ruby>う。", "The more you have in common, the better you get along."]], "n": "共通点 = things in common. 共通語 = common language."}, {"w": "課題", "wf": "<ruby>課題<rt>かだい</rt></ruby>", "r": "かだい", "m": "task; issue; assignment", "p": "noun", "t": "noun", "d": 8, "ex": [["<ruby>今週<rt>こんしゅう</rt></ruby>の <ruby>課題<rt>かだい</rt></ruby>はレポートを <ruby>書<rt>か</rt></ruby>くことだ。", "This week's assignment is writing a report."], ["<ruby>人口<rt>じんこう</rt></ruby> <ruby>減少<rt>げんしょう</rt></ruby>は <ruby>日本<rt>にほん</rt></ruby>の <ruby>大<rt>おお</rt></ruby>きな <ruby>課題<rt>かだい</rt></ruby>だ。", "Population decline is a big issue for Japan."], ["<ruby>今後<rt>こんご</rt></ruby>の <ruby>課題<rt>かだい</rt></ruby>について <ruby>話<rt>はな</rt></ruby>し <ruby>合<rt>あ</rt></ruby>った。", "We discussed the issues going forward."]], "n": "School assignment and social issue. 問題 = problem; 課題 = issue to tackle."}, {"w": "傾向", "wf": "<ruby>傾向<rt>けいこう</rt></ruby>", "r": "けいこう", "m": "tendency; trend", "p": "noun", "t": "noun", "d": 8, "ex": [["<ruby>最近<rt>さいきん</rt></ruby>の <ruby>若者<rt>わかもの</rt></ruby>は <ruby>車<rt>くるま</rt></ruby>を <ruby>買<rt>か</rt></ruby>わない <ruby>傾向<rt>けいこう</rt></ruby>がある。", "Young people these days tend not to buy cars."], ["<ruby>物価<rt>ぶっか</rt></ruby>は <ruby>上<rt>あ</rt></ruby>がる <ruby>傾向<rt>けいこう</rt></ruby>にある。", "Prices are on an upward trend."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>物事<rt>ものごと</rt></ruby>を <ruby>悪<rt>わる</rt></ruby>く <ruby>考<rt>かんが</rt></ruby>える <ruby>傾向<rt>けいこう</rt></ruby>がある。", "He has a tendency to think negatively about things."]], "n": "〜傾向がある = graph and reading-passage staple."}, {"w": "規則", "wf": "<ruby>規則<rt>きそく</rt></ruby>", "r": "きそく", "m": "rule; regulation", "p": "noun", "t": "noun", "d": 8, "ex": [["<ruby>学校<rt>がっこう</rt></ruby>の <ruby>規則<rt>きそく</rt></ruby>を <ruby>守<rt>まも</rt></ruby>りましょう。", "Let us follow the school rules."], ["<ruby>規則<rt>きそく</rt></ruby>を <ruby>破<rt>やぶ</rt></ruby>ると、 <ruby>罰<rt>ばつ</rt></ruby>があります。", "If you break the rules, there are penalties."], ["<ruby>規則<rt>きそく</rt></ruby> <ruby>正<rt>ただ</rt></ruby>しい <ruby>生活<rt>せいかつ</rt></ruby>を <ruby>心<rt>こころ</rt></ruby>がけている。", "I try to keep a well-regulated lifestyle."]], "n": "規則正しい生活 = regular (healthy) routine. ルール is the casual word."}, {"w": "法律", "wf": "<ruby>法律<rt>ほうりつ</rt></ruby>", "r": "ほうりつ", "m": "law", "p": "noun", "t": "noun", "d": 8, "ex": [["それは <ruby>法律<rt>ほうりつ</rt></ruby>で <ruby>禁止<rt>きんし</rt></ruby>されています。", "That is prohibited by law."], ["<ruby>新<rt>あたら</rt></ruby>しい <ruby>法律<rt>ほうりつ</rt></ruby>が <ruby>来月<rt>らいげつ</rt></ruby>から <ruby>始<rt>はじ</rt></ruby>まる。", "A new law takes effect from next month."], ["<ruby>法律<rt>ほうりつ</rt></ruby>を <ruby>学<rt>まな</rt></ruby>ぶために <ruby>大学<rt>だいがく</rt></ruby>に <ruby>入<rt>はい</rt></ruby>った。", "I entered university to study law."]], "n": "法律で〜されている = by-law pattern."}, {"w": "政治", "wf": "<ruby>政治<rt>せいじ</rt></ruby>", "r": "せいじ", "m": "politics", "p": "noun", "t": "noun", "d": 8, "ex": [["<ruby>若<rt>わか</rt></ruby>い <ruby>人<rt>ひと</rt></ruby>の <ruby>政治<rt>せいじ</rt></ruby>への <ruby>関心<rt>かんしん</rt></ruby>が <ruby>低<rt>ひく</rt></ruby>い。", "Young people's interest in politics is low."], ["<ruby>政治<rt>せいじ</rt></ruby>の <ruby>話<rt>はなし</rt></ruby>は <ruby>難<rt>むずか</rt></ruby>しい。", "Talk of politics is difficult."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>大学<rt>だいがく</rt></ruby>で <ruby>政治<rt>せいじ</rt></ruby>を <ruby>学<rt>まな</rt></ruby>んでいる。", "He studies politics at university."]], "n": "政治家 = politician. News cluster with 経済, 政府."}, {"w": "経済", "wf": "<ruby>経済<rt>けいざい</rt></ruby>", "r": "けいざい", "m": "economy; economics", "p": "noun", "t": "noun", "d": 8, "ex": [["<ruby>日本<rt>にほん</rt></ruby>の <ruby>経済<rt>けいざい</rt></ruby>は <ruby>少<rt>すこ</rt></ruby>しずつ <ruby>回復<rt>かいふく</rt></ruby>している。", "Japan's economy is recovering little by little."], ["<ruby>経済<rt>けいざい</rt></ruby>のニュースを <ruby>毎朝<rt>まいあさ</rt></ruby> <ruby>読<rt>よ</rt></ruby>んでいる。", "I read economic news every morning."], ["<ruby>円安<rt>えんやす</rt></ruby>は <ruby>経済<rt>けいざい</rt></ruby>に <ruby>大<rt>おお</rt></ruby>きな <ruby>影響<rt>えいきょう</rt></ruby>を <ruby>与<rt>あた</rt></ruby>える。", "A weak yen has a big impact on the economy."]], "n": "経済的 = economic AND economical (cheap). 円安/円高 = weak/strong yen."}, {"w": "調査", "wf": "<ruby>調査<rt>ちょうさ</rt></ruby>", "r": "ちょうさ", "m": "survey; investigation", "p": "noun / suru-verb", "t": "noun", "d": 8, "ex": [["アンケート <ruby>調査<rt>ちょうさ</rt></ruby>を <ruby>行<rt>おこな</rt></ruby>った。", "We conducted a questionnaire survey."], ["<ruby>事故<rt>じこ</rt></ruby>の <ruby>原因<rt>げんいん</rt></ruby>を <ruby>調査<rt>ちょうさ</rt></ruby>している。", "They are investigating the cause of the accident."], ["<ruby>調査<rt>ちょうさ</rt></ruby>の <ruby>結果<rt>けっか</rt></ruby>、 <ruby>意外<rt>いがい</rt></ruby>な <ruby>事実<rt>じじつ</rt></ruby>が <ruby>分<rt>わ</rt></ruby>かった。", "As a result of the survey, a surprising fact came to light."]], "n": "調査によると = reading-passage opener. 調べる is the everyday verb."}, {"w": "実験", "wf": "<ruby>実験<rt>じっけん</rt></ruby>", "r": "じっけん", "m": "experiment", "p": "noun / suru-verb", "t": "noun", "d": 8, "ex": [["<ruby>理科<rt>りか</rt></ruby>の <ruby>授業<rt>じゅぎょう</rt></ruby>で <ruby>実験<rt>じっけん</rt></ruby>をした。", "We did an experiment in science class."], ["<ruby>新<rt>あたら</rt></ruby>しい <ruby>薬<rt>くすり</rt></ruby>の <ruby>実験<rt>じっけん</rt></ruby>が <ruby>続<rt>つづ</rt></ruby>いている。", "Experiments on the new medicine are continuing."], ["<ruby>実験<rt>じっけん</rt></ruby>に <ruby>成功<rt>せいこう</rt></ruby>した。", "The experiment succeeded."]], "n": "実験に成功する takes に (see 成功, batch 1)."}, {"w": "感情", "wf": "<ruby>感情<rt>かんじょう</rt></ruby>", "r": "かんじょう", "m": "emotion; feelings", "p": "noun", "t": "noun", "d": 8, "ex": [["<ruby>感情<rt>かんじょう</rt></ruby>を <ruby>顔<rt>かお</rt></ruby>に <ruby>出<rt>だ</rt></ruby>さない <ruby>人<rt>ひと</rt></ruby>もいる。", "Some people do not show their emotions on their face."], ["<ruby>感情的<rt>かんじょうてき</rt></ruby>にならないで、 <ruby>冷静<rt>れいせい</rt></ruby>に <ruby>話<rt>はな</rt></ruby>しましょう。", "Let us talk calmly without getting emotional."], ["<ruby>音楽<rt>おんがく</rt></ruby>は <ruby>人<rt>ひと</rt></ruby>の <ruby>感情<rt>かんじょう</rt></ruby>を <ruby>動<rt>うご</rt></ruby>かす。", "Music moves people's emotions."]], "n": "感情的になる = get emotional. 気持ち = everyday feelings; 感情 = formal."}, {"w": "増加", "wf": "<ruby>増加<rt>ぞうか</rt></ruby>", "r": "ぞうか", "m": "increase", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["<ruby>外国人<rt>がいこくじん</rt></ruby> <ruby>観光客<rt>かんこうきゃく</rt></ruby>の <ruby>数<rt>かず</rt></ruby>が <ruby>増加<rt>ぞうか</rt></ruby>している。", "The number of foreign tourists is increasing."], ["<ruby>人口<rt>じんこう</rt></ruby>の <ruby>増加<rt>ぞうか</rt></ruby>が <ruby>問題<rt>もんだい</rt></ruby>になっている。", "Population increase has become a problem."], ["<ruby>売<rt>う</rt></ruby>り <ruby>上<rt>あ</rt></ruby>げは <ruby>前年<rt>ぜんねん</rt></ruby>より <ruby>十<rt>じゅっ</rt></ruby>パーセント <ruby>増加<rt>ぞうか</rt></ruby>した。", "Sales increased ten percent over the previous year."]], "n": "Written form of 増える. News/graph word. Pair: 減少."}, {"w": "減少", "wf": "<ruby>減少<rt>げんしょう</rt></ruby>", "r": "げんしょう", "m": "decrease", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["<ruby>子<rt>こ</rt></ruby>どもの <ruby>数<rt>かず</rt></ruby>が <ruby>年々<rt>ねんねん</rt></ruby> <ruby>減少<rt>げんしょう</rt></ruby>している。", "The number of children is decreasing year by year."], ["<ruby>事故<rt>じこ</rt></ruby>の <ruby>件数<rt>けんすう</rt></ruby>は <ruby>減少<rt>げんしょう</rt></ruby> <ruby>傾向<rt>けいこう</rt></ruby>にある。", "The number of accidents is on a downward trend."], ["<ruby>販売数<rt>はんばいすう</rt></ruby>の <ruby>減少<rt>げんしょう</rt></ruby>が <ruby>続<rt>つづ</rt></ruby>いている。", "The decline in sales numbers continues."]], "n": "Written form of 減る. 少子化 = declining birthrate (related news word)."}, {"w": "進歩", "wf": "<ruby>進歩<rt>しんぽ</rt></ruby>", "r": "しんぽ", "m": "progress", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["<ruby>技術<rt>ぎじゅつ</rt></ruby>の <ruby>進歩<rt>しんぽ</rt></ruby>は <ruby>速<rt>はや</rt></ruby>い。", "Technological progress is fast."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>日本語<rt>にほんご</rt></ruby>は <ruby>大<rt>おお</rt></ruby>きく <ruby>進歩<rt>しんぽ</rt></ruby>した。", "His Japanese has progressed greatly."], ["<ruby>医学<rt>いがく</rt></ruby>の <ruby>進歩<rt>しんぽ</rt></ruby>のおかげで、 <ruby>多<rt>おお</rt></ruby>くの <ruby>命<rt>いのち</rt></ruby>が <ruby>救<rt>すく</rt></ruby>われている。", "Thanks to progress in medicine, many lives are being saved."]], "n": "進歩 = progress (skill/tech); 発展 = development (scale)."}, {"w": "発展", "wf": "<ruby>発展<rt>はってん</rt></ruby>", "r": "はってん", "m": "development; growth", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["この <ruby>町<rt>まち</rt></ruby>は <ruby>工業<rt>こうぎょう</rt></ruby> <ruby>都市<rt>とし</rt></ruby>として <ruby>発展<rt>はってん</rt></ruby>した。", "This town developed as an industrial city."], ["<ruby>会社<rt>かいしゃ</rt></ruby>の <ruby>発展<rt>はってん</rt></ruby>のために <ruby>頑張<rt>がんば</rt></ruby>ります。", "I will work hard for the company's development."], ["<ruby>話<rt>はなし</rt></ruby>が <ruby>思<rt>おも</rt></ruby>わぬ <ruby>方向<rt>ほうこう</rt></ruby>に <ruby>発展<rt>はってん</rt></ruby>した。", "The conversation developed in an unexpected direction."]], "n": "発展途上国 = developing country. 発達 = development of abilities or weather systems."}, {"w": "輸入", "wf": "<ruby>輸入<rt>ゆにゅう</rt></ruby>", "r": "ゆにゅう", "m": "import", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["<ruby>日本<rt>にほん</rt></ruby>は <ruby>石油<rt>せきゆ</rt></ruby>のほとんどを <ruby>輸入<rt>ゆにゅう</rt></ruby>している。", "Japan imports most of its oil."], ["<ruby>輸入品<rt>ゆにゅうひん</rt></ruby>は <ruby>値段<rt>ねだん</rt></ruby>が <ruby>高<rt>たか</rt></ruby>いことが <ruby>多<rt>おお</rt></ruby>い。", "Imported goods are often expensive."], ["この <ruby>果物<rt>くだもの</rt></ruby>は <ruby>外国<rt>がいこく</rt></ruby>から <ruby>輸入<rt>ゆにゅう</rt></ruby>されたものだ。", "This fruit was imported from abroad."]], "n": "Pair: 輸入 ↔ 輸出. Reading ゆにゅう (not しゅにゅう)."}, {"w": "輸出", "wf": "<ruby>輸出<rt>ゆしゅつ</rt></ruby>", "r": "ゆしゅつ", "m": "export", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["<ruby>日本<rt>にほん</rt></ruby>は <ruby>車<rt>くるま</rt></ruby>を <ruby>世界中<rt>せかいじゅう</rt></ruby>に <ruby>輸出<rt>ゆしゅつ</rt></ruby>している。", "Japan exports cars all over the world."], ["<ruby>輸出<rt>ゆしゅつ</rt></ruby>が <ruby>増<rt>ふ</rt></ruby>えると、 <ruby>経済<rt>けいざい</rt></ruby>に <ruby>良<rt>よ</rt></ruby>い <ruby>影響<rt>えいきょう</rt></ruby>がある。", "When exports increase, it has a good effect on the economy."], ["この <ruby>会社<rt>かいしゃ</rt></ruby>は <ruby>輸出<rt>ゆしゅつ</rt></ruby> <ruby>向<rt>む</rt></ruby>けの <ruby>製品<rt>せいひん</rt></ruby>を <ruby>作<rt>つく</rt></ruby>っている。", "This company makes products for export."]], "n": "Pair with 輸入. Kanji 輸 appears in both — learn once."}, {"w": "生産", "wf": "<ruby>生産<rt>せいさん</rt></ruby>", "r": "せいさん", "m": "production", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["この <ruby>工場<rt>こうじょう</rt></ruby>では <ruby>車<rt>くるま</rt></ruby>を <ruby>生産<rt>せいさん</rt></ruby>している。", "This factory produces cars."], ["<ruby>米<rt>こめ</rt></ruby>の <ruby>生産量<rt>せいさんりょう</rt></ruby>が <ruby>減<rt>へ</rt></ruby>っている。", "Rice production volume is decreasing."], ["<ruby>生産<rt>せいさん</rt></ruby>コストを <ruby>下<rt>さ</rt></ruby>げる <ruby>必要<rt>ひつよう</rt></ruby>がある。", "We need to lower production costs."]], "n": "Pair: 生産 ↔ 消費. 国産 = domestically produced."}, {"w": "消費", "wf": "<ruby>消費<rt>しょうひ</rt></ruby>", "r": "しょうひ", "m": "consumption", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["<ruby>若者<rt>わかもの</rt></ruby>の <ruby>消費<rt>しょうひ</rt></ruby>が <ruby>減<rt>へ</rt></ruby>っているそうだ。", "They say young people's consumption is falling."], ["この <ruby>車<rt>くるま</rt></ruby>はガソリンの <ruby>消費<rt>しょうひ</rt></ruby>が <ruby>少<rt>すく</rt></ruby>ない。", "This car consumes little gasoline."], ["<ruby>消費税<rt>しょうひぜい</rt></ruby>が <ruby>上<rt>あ</rt></ruby>がると、 <ruby>生活<rt>せいかつ</rt></ruby>が <ruby>苦<rt>くる</rt></ruby>しくなる。", "When the consumption tax rises, life gets harder."]], "n": "消費者 = consumer; 消費期限 = use-by date (on food)."}, {"w": "販売", "wf": "<ruby>販売<rt>はんばい</rt></ruby>", "r": "はんばい", "m": "sales; selling", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["この <ruby>商品<rt>しょうひん</rt></ruby>はコンビニでも <ruby>販売<rt>はんばい</rt></ruby>されている。", "This product is also sold at convenience stores."], ["チケットの <ruby>販売<rt>はんばい</rt></ruby>は <ruby>明日<rt>あした</rt></ruby>から <ruby>始<rt>はじ</rt></ruby>まります。", "Ticket sales start tomorrow."], ["インターネット <ruby>販売<rt>はんばい</rt></ruby>が <ruby>増<rt>ふ</rt></ruby>えている。", "Online sales are increasing."]], "n": "販売 = selling (activity); 発売 = release of a product. Both on signs everywhere."}, {"w": "募集", "wf": "<ruby>募集<rt>ぼしゅう</rt></ruby>", "r": "ぼしゅう", "m": "recruitment; wanted", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["あの <ruby>店<rt>みせ</rt></ruby>はアルバイトを <ruby>募集<rt>ぼしゅう</rt></ruby>している。", "That shop is recruiting part-timers."], ["<ruby>参加者<rt>さんかしゃ</rt></ruby>を <ruby>募集<rt>ぼしゅう</rt></ruby> <ruby>中<rt>ちゅう</rt></ruby>です。", "We are currently recruiting participants."], ["<ruby>意見<rt>いけん</rt></ruby>を <ruby>募集<rt>ぼしゅう</rt></ruby>します。", "We invite your opinions."]], "n": "スタッフ募集 signs on every shop. Pair with 応募."}, {"w": "応募", "wf": "<ruby>応募<rt>おうぼ</rt></ruby>", "r": "おうぼ", "m": "application (in response to recruitment)", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["その <ruby>仕事<rt>しごと</rt></ruby>に <ruby>応募<rt>おうぼ</rt></ruby>することにした。", "I decided to apply for that job."], ["コンテストに <ruby>応募<rt>おうぼ</rt></ruby>した <ruby>作品<rt>さくひん</rt></ruby>が <ruby>選<rt>えら</rt></ruby>ばれた。", "The piece I entered in the contest was selected."], ["<ruby>応募者<rt>おうぼしゃ</rt></ruby>が <ruby>多<rt>おお</rt></ruby>くて、 <ruby>競争<rt>きょうそう</rt></ruby>が <ruby>激<rt>はげ</rt></ruby>しい。", "There are many applicants and competition is fierce."]], "n": "募集 (they recruit) ↔ 応募 (you apply). 申し込む = general sign-up."}, {"w": "面接", "wf": "<ruby>面接<rt>めんせつ</rt></ruby>", "r": "めんせつ", "m": "interview (job)", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["<ruby>明日<rt>あした</rt></ruby>、 <ruby>会社<rt>かいしゃ</rt></ruby>の <ruby>面接<rt>めんせつ</rt></ruby>を <ruby>受<rt>う</rt></ruby>ける。", "Tomorrow I have a job interview."], ["<ruby>面接<rt>めんせつ</rt></ruby>では <ruby>自分<rt>じぶん</rt></ruby>の <ruby>経験<rt>けいけん</rt></ruby>をしっかり <ruby>伝<rt>つた</rt></ruby>えよう。", "In the interview, communicate your experience well."], ["<ruby>面接官<rt>めんせつかん</rt></ruby>の <ruby>質問<rt>しつもん</rt></ruby>に <ruby>落<rt>お</rt></ruby>ち <ruby>着<rt>つ</rt></ruby>いて <ruby>答<rt>こた</rt></ruby>えた。", "I answered the interviewer's questions calmly."]], "n": "面接を受ける = take an interview. インタビュー = media interview."}, {"w": "禁止", "wf": "<ruby>禁止<rt>きんし</rt></ruby>", "r": "きんし", "m": "prohibition", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["ここは <ruby>駐車<rt>ちゅうしゃ</rt></ruby> <ruby>禁止<rt>きんし</rt></ruby>です。", "Parking is prohibited here."], ["<ruby>館内<rt>かんない</rt></ruby>では <ruby>写真<rt>しゃしん</rt></ruby> <ruby>撮影<rt>さつえい</rt></ruby>が <ruby>禁止<rt>きんし</rt></ruby>されている。", "Photography is prohibited inside the building."], ["<ruby>医者<rt>いしゃ</rt></ruby>にお <ruby>酒<rt>さけ</rt></ruby>を <ruby>禁止<rt>きんし</rt></ruby>された。", "The doctor forbade me alcohol."]], "n": "Sign language of Japan: 立入禁止 = no entry, 使用禁止 = do not use."}, {"w": "許可", "wf": "<ruby>許可<rt>きょか</rt></ruby>", "r": "きょか", "m": "permission", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["<ruby>上司<rt>じょうし</rt></ruby>の <ruby>許可<rt>きょか</rt></ruby>をもらってから <ruby>進<rt>すす</rt></ruby>めます。", "I will proceed after getting my boss's permission."], ["ここに <ruby>入<rt>はい</rt></ruby>るには <ruby>許可<rt>きょか</rt></ruby>が <ruby>必要<rt>ひつよう</rt></ruby>です。", "You need permission to enter here."], ["<ruby>写真<rt>しゃしん</rt></ruby> <ruby>撮影<rt>さつえい</rt></ruby>は <ruby>許可<rt>きょか</rt></ruby>されています。", "Photography is permitted."]], "n": "Opposite of 禁止. 許す (ゆるす) = forgive/permit (verb)."}, {"w": "不足", "wf": "<ruby>不足<rt>ふそく</rt></ruby>", "r": "ふそく", "m": "shortage; lack", "p": "noun / suru-verb", "t": "noun", "d": 9, "ex": [["<ruby>睡眠<rt>すいみん</rt></ruby> <ruby>不足<rt>ぶそく</rt></ruby>で <ruby>頭<rt>あたま</rt></ruby>が <ruby>働<rt>はたら</rt></ruby>かない。", "My head is not working due to lack of sleep."], ["<ruby>人手<rt>ひとで</rt></ruby>が <ruby>不足<rt>ふそく</rt></ruby>している。", "We are short-handed."], ["<ruby>説明<rt>せつめい</rt></ruby> <ruby>不足<rt>ぶそく</rt></ruby>で <ruby>誤解<rt>ごかい</rt></ruby>が <ruby>生<rt>う</rt></ruby>まれた。", "A lack of explanation created a misunderstanding."]], "n": "N＋不足 pattern everywhere: 寝不足, 運動不足, 人手不足. In compounds often read ぶそく."}, {"w": "余裕", "wf": "<ruby>余裕<rt>よゆう</rt></ruby>", "r": "よゆう", "m": "leeway; room; composure", "p": "noun", "t": "noun", "d": 9, "ex": [["<ruby>時間<rt>じかん</rt></ruby>に <ruby>余裕<rt>よゆう</rt></ruby>を <ruby>持<rt>も</rt></ruby>って <ruby>出発<rt>しゅっぱつ</rt></ruby>しよう。", "Let us leave with time to spare."], ["<ruby>今月<rt>こんげつ</rt></ruby>はお <ruby>金<rt>かね</rt></ruby>に <ruby>余裕<rt>よゆう</rt></ruby>がない。", "I have no financial leeway this month."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>忙<rt>いそが</rt></ruby>しいのに <ruby>余裕<rt>よゆう</rt></ruby>がありそうに <ruby>見<rt>み</rt></ruby>える。", "Even though he is busy, he looks composed."]], "n": "Time, money, mental room — all 余裕. Spoken: 余裕！ = Easy!"}, {"w": "最中", "wf": "<ruby>最中<rt>さいちゅう</rt></ruby>", "r": "さいちゅう", "m": "in the middle of", "p": "noun", "t": "noun", "d": 9, "ex": [["<ruby>食事<rt>しょくじ</rt></ruby>の <ruby>最中<rt>さいちゅう</rt></ruby>に <ruby>電話<rt>でんわ</rt></ruby>が <ruby>鳴<rt>な</rt></ruby>った。", "The phone rang right in the middle of the meal."], ["<ruby>会議<rt>かいぎ</rt></ruby>の <ruby>最中<rt>さいちゅう</rt></ruby>ですから、 <ruby>後<rt>あと</rt></ruby>でかけ <ruby>直<rt>なお</rt></ruby>します。", "We are in the middle of a meeting, so I will call back later."], ["<ruby>試合<rt>しあい</rt></ruby>の <ruby>最中<rt>さいちゅう</rt></ruby>に <ruby>雨<rt>あめ</rt></ruby>が <ruby>降<rt>ふ</rt></ruby>り <ruby>出<rt>だ</rt></ruby>した。", "It started raining in the middle of the match."]], "n": "N3 grammar point: 〜最中に = right in the middle (often interrupted). Reading さいちゅう."}, {"w": "当日", "wf": "<ruby>当日<rt>とうじつ</rt></ruby>", "r": "とうじつ", "m": "the day (of the event)", "p": "noun", "t": "noun", "d": 9, "ex": [["<ruby>試験<rt>しけん</rt></ruby> <ruby>当日<rt>とうじつ</rt></ruby>は、 <ruby>早<rt>はや</rt></ruby>めに <ruby>会場<rt>かいじょう</rt></ruby>に <ruby>行<rt>い</rt></ruby>きましょう。", "On exam day, go to the venue early."], ["<ruby>当日券<rt>とうじつけん</rt></ruby>は <ruby>販売<rt>はんばい</rt></ruby>しません。", "Same-day tickets will not be sold."], ["<ruby>詳<rt>くわ</rt></ruby>しいことは <ruby>当日<rt>とうじつ</rt></ruby>、お <ruby>知<rt>し</rt></ruby>らせします。", "Details will be announced on the day."]], "n": "Listening-section regular (event announcements). 前日 = day before; 翌日 = day after."}, {"w": "喜ぶ", "wf": "<ruby>喜<rt>よろこ</rt></ruby>ぶ", "r": "よろこぶ", "m": "to be glad; to be delighted", "p": "v5 intransitive", "t": "verb", "d": 9, "ex": [["<ruby>合格<rt>ごうかく</rt></ruby>の <ruby>知<rt>し</rt></ruby>らせを <ruby>聞<rt>き</rt></ruby>いて、 <ruby>家族<rt>かぞく</rt></ruby>は <ruby>喜<rt>よろこ</rt></ruby>んだ。", "Hearing the news of my passing, my family was delighted."], ["プレゼントをあげたら、とても <ruby>喜<rt>よろこ</rt></ruby>んでくれた。", "When I gave the present, they were really pleased."], ["<ruby>喜<rt>よろこ</rt></ruby>んでお <ruby>手伝<rt>てつだ</rt></ruby>いします。", "I would be glad to help."]], "n": "喜んで〜します = gladly (polite acceptance). Noun: 喜び."}, {"w": "必ずしも", "wf": "<ruby>必<rt>かなら</rt></ruby>ずしも", "r": "かならずしも", "m": "not necessarily (with negative)", "p": "adverb", "t": "adv", "d": 9, "ex": [["<ruby>高<rt>たか</rt></ruby>い <ruby>物<rt>もの</rt></ruby>が <ruby>必<rt>かなら</rt></ruby>ずしも <ruby>良<rt>よ</rt></ruby>いとは <ruby>限<rt>かぎ</rt></ruby>らない。", "Expensive things are not necessarily good."], ["<ruby>努力<rt>どりょく</rt></ruby>が <ruby>必<rt>かなら</rt></ruby>ずしも <ruby>成功<rt>せいこう</rt></ruby>につながるわけではない。", "Effort does not necessarily lead to success."], ["その <ruby>方法<rt>ほうほう</rt></ruby>が <ruby>必<rt>かなら</rt></ruby>ずしも <ruby>正<rt>ただ</rt></ruby>しいとは <ruby>言<rt>い</rt></ruby>えない。", "You cannot say that method is necessarily right."]], "n": "Always with a negative pattern. Grammar and vocab sections both test it."}, {"w": "決して", "wf": "<ruby>決<rt>けっ</rt></ruby>して", "r": "けっして", "m": "never; by no means (with negative)", "p": "adverb", "t": "adv", "d": 9, "ex": [["<ruby>決<rt>けっ</rt></ruby>して <ruby>嘘<rt>うそ</rt></ruby>をつかないでください。", "Never tell lies."], ["この <ruby>恩<rt>おん</rt></ruby>は <ruby>決<rt>けっ</rt></ruby>して <ruby>忘<rt>わす</rt></ruby>れません。", "I will never forget this kindness."], ["<ruby>決<rt>けっ</rt></ruby>して <ruby>簡単<rt>かんたん</rt></ruby>な <ruby>試験<rt>しけん</rt></ruby>ではないが、 <ruby>合格<rt>ごうかく</rt></ruby>できる。", "It is by no means an easy exam, but you can pass."]], "n": "Always with a negative. Stronger than 絶対に in written tone."}, {"w": "全く", "wf": "<ruby>全<rt>まった</rt></ruby>く", "r": "まったく", "m": "completely; (not) at all", "p": "adverb", "t": "adv", "d": 9, "ex": [["<ruby>彼<rt>かれ</rt></ruby>の <ruby>言<rt>い</rt></ruby>っていることが <ruby>全<rt>まった</rt></ruby>く <ruby>分<rt>わ</rt></ruby>からない。", "I do not understand what he is saying at all."], ["<ruby>二人<rt>ふたり</rt></ruby>の <ruby>意見<rt>いけん</rt></ruby>は <ruby>全<rt>まった</rt></ruby>く <ruby>同<rt>おな</rt></ruby>じだった。", "The two's opinions were exactly the same."], ["<ruby>全<rt>まった</rt></ruby>くその <ruby>通<rt>とお</rt></ruby>りです。", "That is exactly right."]], "n": "With negative = not at all; positive = utterly. Spoken sigh: まったく… = honestly..."}, {"w": "しばらく", "wf": "しばらく", "r": "しばらく", "m": "for a while", "p": "adverb", "t": "adv", "d": 9, "ex": [["しばらくお <ruby>待<rt>ま</rt></ruby>ちください。", "Please wait a moment."], ["しばらく <ruby>会<rt>あ</rt></ruby>わないうちに、 <ruby>彼<rt>かれ</rt></ruby>は <ruby>大人<rt>おとな</rt></ruby>っぽくなった。", "In the while we did not meet, he became more grown-up."], ["しばらく <ruby>日本<rt>にほん</rt></ruby>を <ruby>離<rt>はな</rt></ruby>れることになりました。", "I will be away from Japan for a while."]], "n": "しばらくですね = it has been a while. Kana only."}, {"w": "わざわざ", "wf": "わざわざ", "r": "わざわざ", "m": "going out of one's way; specially", "p": "adverb", "t": "adv", "d": 9, "ex": [["わざわざ <ruby>駅<rt>えき</rt></ruby>まで <ruby>迎<rt>むか</rt></ruby>えに <ruby>来<rt>き</rt></ruby>てくれてありがとう。", "Thanks for going out of your way to meet me at the station."], ["わざわざ <ruby>買<rt>か</rt></ruby>いに <ruby>行<rt>い</rt></ruby>かなくても、ネットで <ruby>注文<rt>ちゅうもん</rt></ruby>できるよ。", "You do not have to make a special trip — you can order online."], ["<ruby>遠<rt>とお</rt></ruby>い <ruby>所<rt>ところ</rt></ruby>をわざわざお <ruby>越<rt>こ</rt></ruby>しいただき、ありがとうございます。", "Thank you for coming all this way."]], "n": "Gratitude or no-need-to-bother. わざと = on purpose (deliberate) — different!"}, {"w": "随分", "wf": "<ruby>随分<rt>ずいぶん</rt></ruby>", "r": "ずいぶん", "m": "very; considerably", "p": "adverb", "t": "adv", "d": 9, "ex": [["<ruby>随分<rt>ずいぶん</rt></ruby> <ruby>日本語<rt>にほんご</rt></ruby>が <ruby>上手<rt>じょうず</rt></ruby>になりましたね。", "Your Japanese has gotten a lot better."], ["<ruby>今日<rt>きょう</rt></ruby>は <ruby>随分<rt>ずいぶん</rt></ruby> <ruby>暖<rt>あたた</rt></ruby>かい。", "It is considerably warm today."], ["<ruby>随分<rt>ずいぶん</rt></ruby> <ruby>待<rt>ま</rt></ruby>ちましたか。", "Did you wait long?"]], "n": "Often written ずいぶん. Feels like more than expected. かなり is more objective."}, {"w": "貧しい", "wf": "<ruby>貧<rt>まず</rt></ruby>しい", "r": "まずしい", "m": "poor", "p": "i-adjective", "t": "adj", "d": 10, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>貧<rt>まず</rt></ruby>しい <ruby>家庭<rt>かてい</rt></ruby>に <ruby>生<rt>う</rt></ruby>まれた。", "He was born into a poor family."], ["<ruby>貧<rt>まず</rt></ruby>しい <ruby>国<rt>くに</rt></ruby>への <ruby>支援<rt>しえん</rt></ruby>が <ruby>必要<rt>ひつよう</rt></ruby>だ。", "Support for poor countries is needed."], ["<ruby>心<rt>こころ</rt></ruby>まで <ruby>貧<rt>まず</rt></ruby>しくなってはいけない。", "You must not become poor in spirit as well."]], "n": "Opposite: 豊か. 貧乏 (びんぼう) is the casual noun/na-adjective."}, {"w": "豊か", "wf": "<ruby>豊<rt>ゆた</rt></ruby>か", "r": "ゆたか", "m": "rich; abundant", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["<ruby>自然<rt>しぜん</rt></ruby>が <ruby>豊<rt>ゆた</rt></ruby>かな <ruby>町<rt>まち</rt></ruby>に <ruby>住<rt>す</rt></ruby>みたい。", "I want to live in a town rich in nature."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>経験<rt>けいけん</rt></ruby>が <ruby>豊<rt>ゆた</rt></ruby>かだ。", "He is rich in experience."], ["<ruby>読書<rt>どくしょ</rt></ruby>は <ruby>心<rt>こころ</rt></ruby>を <ruby>豊<rt>ゆた</rt></ruby>かにする。", "Reading enriches the mind."]], "n": "豊富 (ほうふ) = abundant (supply/knowledge) is the harder cousin."}, {"w": "親しい", "wf": "<ruby>親<rt>した</rt></ruby>しい", "r": "したしい", "m": "close; intimate", "p": "i-adjective", "t": "adj", "d": 10, "ex": [["<ruby>彼<rt>かれ</rt></ruby>とは <ruby>高校<rt>こうこう</rt></ruby> <ruby>時代<rt>じだい</rt></ruby>から <ruby>親<rt>した</rt></ruby>しい。", "He and I have been close since high school."], ["<ruby>親<rt>した</rt></ruby>しい <ruby>友人<rt>ゆうじん</rt></ruby>だけを <ruby>結婚式<rt>けっこんしき</rt></ruby>に <ruby>呼<rt>よ</rt></ruby>んだ。", "We invited only close friends to the wedding."], ["<ruby>二人<rt>ふたり</rt></ruby>は <ruby>親<rt>した</rt></ruby>しくなった。", "The two became close."]], "n": "親 kanji but not family — closeness. 仲がいい is the spoken version."}, {"w": "珍しい", "wf": "<ruby>珍<rt>めずら</rt></ruby>しい", "r": "めずらしい", "m": "rare; unusual", "p": "i-adjective", "t": "adj", "d": 10, "ex": [["<ruby>今日<rt>きょう</rt></ruby>は <ruby>珍<rt>めずら</rt></ruby>しく <ruby>早<rt>はや</rt></ruby>く <ruby>起<rt>お</rt></ruby>きた。", "Unusually for me, I got up early today."], ["この <ruby>鳥<rt>とり</rt></ruby>は <ruby>日本<rt>にほん</rt></ruby>では <ruby>珍<rt>めずら</rt></ruby>しい。", "This bird is rare in Japan."], ["<ruby>珍<rt>めずら</rt></ruby>しい <ruby>名前<rt>なまえ</rt></ruby>ですね。", "That is an unusual name."]], "n": "珍しく = uncharacteristically."}, {"w": "怪しい", "wf": "<ruby>怪<rt>あや</rt></ruby>しい", "r": "あやしい", "m": "suspicious; doubtful", "p": "i-adjective", "t": "adj", "d": 10, "ex": [["<ruby>家<rt>いえ</rt></ruby>の <ruby>前<rt>まえ</rt></ruby>に <ruby>怪<rt>あや</rt></ruby>しい <ruby>人<rt>ひと</rt></ruby>が <ruby>立<rt>た</rt></ruby>っている。", "A suspicious person is standing in front of the house."], ["その <ruby>話<rt>はなし</rt></ruby>はどうも <ruby>怪<rt>あや</rt></ruby>しい。", "That story is somehow fishy."], ["<ruby>明日<rt>あした</rt></ruby>の <ruby>天気<rt>てんき</rt></ruby>は <ruby>怪<rt>あや</rt></ruby>しい。", "Tomorrow's weather looks iffy."]], "n": "People, stories, weather, memory — all can be 怪しい. 怪しいメール = phishing."}, {"w": "悔しい", "wf": "<ruby>悔<rt>くや</rt></ruby>しい", "r": "くやしい", "m": "frustrating; vexing (after losing)", "p": "i-adjective", "t": "adj", "d": 10, "ex": [["<ruby>一点<rt>いってん</rt></ruby> <ruby>差<rt>さ</rt></ruby>で <ruby>負<rt>ま</rt></ruby>けて、とても <ruby>悔<rt>くや</rt></ruby>しい。", "We lost by one point — so frustrating."], ["<ruby>悔<rt>くや</rt></ruby>しかったら、もっと <ruby>練習<rt>れんしゅう</rt></ruby>しなさい。", "If you are frustrated, practice more."], ["あと <ruby>少<rt>すこ</rt></ruby>しで <ruby>合格<rt>ごうかく</rt></ruby>だったのに、 <ruby>悔<rt>くや</rt></ruby>しい。", "I was so close to passing — how vexing."]], "n": "The sports-loss emotion; no clean English equivalent. Post-game interviews: 悔しいです！"}, {"w": "懐かしい", "wf": "<ruby>懐<rt>なつ</rt></ruby>かしい", "r": "なつかしい", "m": "nostalgic; dear (past)", "p": "i-adjective", "t": "adj", "d": 10, "ex": [["この <ruby>歌<rt>うた</rt></ruby>を <ruby>聞<rt>き</rt></ruby>くと、 <ruby>学生<rt>がくせい</rt></ruby> <ruby>時代<rt>じだい</rt></ruby>が <ruby>懐<rt>なつ</rt></ruby>かしい。", "Hearing this song makes me nostalgic for my student days."], ["<ruby>懐<rt>なつ</rt></ruby>かしい <ruby>味<rt>あじ</rt></ruby>がする。", "It has a nostalgic taste."], ["<ruby>故郷<rt>ふるさと</rt></ruby>の <ruby>景色<rt>けしき</rt></ruby>が <ruby>懐<rt>なつ</rt></ruby>かしい。", "I miss the scenery of my hometown."]], "n": "Feeling toward the past. 懐かしい！ = spoken That takes me back!"}, {"w": "大人しい", "wf": "<ruby>大人<rt>おとな</rt></ruby>しい", "r": "おとなしい", "m": "quiet; gentle; well-behaved", "p": "i-adjective", "t": "adj", "d": 10, "ex": [["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>大人<rt>おとな</rt></ruby>しい <ruby>性格<rt>せいかく</rt></ruby>だ。", "She has a quiet personality."], ["うちの <ruby>犬<rt>いぬ</rt></ruby>はとても <ruby>大人<rt>おとな</rt></ruby>しい。", "Our dog is very gentle."], ["<ruby>子<rt>こ</rt></ruby>どもたちは <ruby>大人<rt>おとな</rt></ruby>しく <ruby>待<rt>ま</rt></ruby>っていた。", "The children waited quietly."]], "n": "From 大人 (adult-like). For colours: 大人しい色 = subdued colour."}, {"w": "苦しい", "wf": "<ruby>苦<rt>くる</rt></ruby>しい", "r": "くるしい", "m": "painful; hard; strained", "p": "i-adjective", "t": "adj", "d": 10, "ex": [["<ruby>熱<rt>ねつ</rt></ruby>で <ruby>息<rt>いき</rt></ruby>が <ruby>苦<rt>くる</rt></ruby>しい。", "It is hard to breathe because of the fever."], ["<ruby>生活<rt>せいかつ</rt></ruby>が <ruby>苦<rt>くる</rt></ruby>しい <ruby>家庭<rt>かてい</rt></ruby>が <ruby>増<rt>ふ</rt></ruby>えている。", "Households struggling to get by are increasing."], ["<ruby>苦<rt>くる</rt></ruby>しいときこそ、 <ruby>笑<rt>わら</rt></ruby>おう。", "It is precisely in hard times that we should smile."]], "n": "Physical and financial hardship. 苦しむ (v) = to suffer. 辛い is the emotional cousin."}, {"w": "辛い", "wf": "<ruby>辛<rt>つら</rt></ruby>い", "r": "つらい", "m": "hard; painful (emotionally)", "p": "i-adjective", "t": "adj", "d": 10, "ex": [["<ruby>家族<rt>かぞく</rt></ruby>と <ruby>離<rt>はな</rt></ruby>れて <ruby>暮<rt>く</rt></ruby>らすのは <ruby>辛<rt>つら</rt></ruby>い。", "Living apart from family is hard."], ["<ruby>辛<rt>つら</rt></ruby>いことがあったら、 <ruby>話<rt>はな</rt></ruby>してください。", "If something painful happens, please talk to me."], ["<ruby>毎朝<rt>まいあさ</rt></ruby> <ruby>五時<rt>ごじ</rt></ruby>に <ruby>起<rt>お</rt></ruby>きるのは <ruby>辛<rt>つら</rt></ruby>い。", "Getting up at five every morning is rough."]], "n": "Same kanji as 辛い (からい, spicy)! Context decides. つらい = emotional/physical strain."}, {"w": "新鮮", "wf": "<ruby>新鮮<rt>しんせん</rt></ruby>", "r": "しんせん", "m": "fresh", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["この <ruby>市場<rt>いちば</rt></ruby>の <ruby>魚<rt>さかな</rt></ruby>は <ruby>新鮮<rt>しんせん</rt></ruby>だ。", "The fish at this market is fresh."], ["<ruby>朝<rt>あさ</rt></ruby>の <ruby>新鮮<rt>しんせん</rt></ruby>な <ruby>空気<rt>くうき</rt></ruby>を <ruby>吸<rt>す</rt></ruby>った。", "I breathed the fresh morning air."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>意見<rt>いけん</rt></ruby>は <ruby>新鮮<rt>しんせん</rt></ruby>に <ruby>感<rt>かん</rt></ruby>じた。", "His opinion felt fresh."]], "n": "Food, air, and ideas can all be 新鮮."}, {"w": "盛ん", "wf": "<ruby>盛<rt>さか</rt></ruby>ん", "r": "さかん", "m": "thriving; popular; active", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["この <ruby>地方<rt>ちほう</rt></ruby>は <ruby>農業<rt>のうぎょう</rt></ruby>が <ruby>盛<rt>さか</rt></ruby>んだ。", "Agriculture thrives in this region."], ["<ruby>日本<rt>にほん</rt></ruby>では <ruby>野球<rt>やきゅう</rt></ruby>が <ruby>盛<rt>さか</rt></ruby>んです。", "Baseball is very popular in Japan."], ["<ruby>二国<rt>にこく</rt></ruby> <ruby>間<rt>かん</rt></ruby>の <ruby>交流<rt>こうりゅう</rt></ruby>が <ruby>盛<rt>さか</rt></ruby>んになってきた。", "Exchange between the two countries has become active."]], "n": "Pattern 〜では〜が盛んだ (region + industry/sport) is an exam favourite."}, {"w": "適当", "wf": "<ruby>適当<rt>てきとう</rt></ruby>", "r": "てきとう", "m": "suitable; (also) half-hearted", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["<ruby>適当<rt>てきとう</rt></ruby>な <ruby>大<rt>おお</rt></ruby>きさに <ruby>切<rt>き</rt></ruby>ってください。", "Please cut it to a suitable size."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>何<rt>なん</rt></ruby>でも <ruby>適当<rt>てきとう</rt></ruby>にやる。", "He does everything half-heartedly."], ["<ruby>適当<rt>てきとう</rt></ruby>な <ruby>言葉<rt>ことば</rt></ruby>が <ruby>見<rt>み</rt></ruby>つからない。", "I cannot find the right word."]], "n": "Two OPPOSITE meanings: proper/suitable (formal, tested on exam) and sloppy/random (spoken, used in life)."}, {"w": "単純", "wf": "<ruby>単純<rt>たんじゅん</rt></ruby>", "r": "たんじゅん", "m": "simple", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["<ruby>仕組<rt>しく</rt></ruby>みはとても <ruby>単純<rt>たんじゅん</rt></ruby>だ。", "The mechanism is very simple."], ["<ruby>単純<rt>たんじゅん</rt></ruby>な <ruby>計算<rt>けいさん</rt></ruby>ミスで <ruby>点<rt>てん</rt></ruby>を <ruby>落<rt>お</rt></ruby>とした。", "I lost points on a simple calculation mistake."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>単純<rt>たんじゅん</rt></ruby>な <ruby>性格<rt>せいかく</rt></ruby>で、すぐ <ruby>信<rt>しん</rt></ruby>じる。", "He has a simple nature and believes things right away."]], "n": "Opposite: 複雑 (batch 1). About people it can be mildly negative."}, {"w": "素直", "wf": "<ruby>素直<rt>すなお</rt></ruby>", "r": "すなお", "m": "honest; obedient; open-minded", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>素直<rt>すなお</rt></ruby>に <ruby>謝<rt>あやま</rt></ruby>った。", "He apologized honestly."], ["<ruby>素直<rt>すなお</rt></ruby>な <ruby>子<rt>こ</rt></ruby>どもですね。", "What an obedient child."], ["<ruby>人<rt>ひと</rt></ruby>の <ruby>意見<rt>いけん</rt></ruby>を <ruby>素直<rt>すなお</rt></ruby>に <ruby>聞<rt>き</rt></ruby>くことも <ruby>大切<rt>たいせつ</rt></ruby>だ。", "It is also important to listen to others' opinions with an open mind."]], "n": "Praised trait in Japan: accepts advice without resistance. 素直になれない = cannot be honest with one's feelings."}, {"w": "熱心", "wf": "<ruby>熱心<rt>ねっしん</rt></ruby>", "r": "ねっしん", "m": "enthusiastic; eager", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>熱心<rt>ねっしん</rt></ruby>に <ruby>日本語<rt>にほんご</rt></ruby>を <ruby>勉強<rt>べんきょう</rt></ruby>している。", "She is studying Japanese eagerly."], ["<ruby>熱心<rt>ねっしん</rt></ruby>な <ruby>先生<rt>せんせい</rt></ruby>のおかげで、 <ruby>成績<rt>せいせき</rt></ruby>が <ruby>上<rt>あ</rt></ruby>がった。", "Thanks to an enthusiastic teacher, my grades went up."], ["<ruby>仕事<rt>しごと</rt></ruby>に <ruby>熱心<rt>ねっしん</rt></ruby>な <ruby>人<rt>ひと</rt></ruby>は <ruby>信頼<rt>しんらい</rt></ruby>される。", "People who are dedicated to their work are trusted."]], "n": "勉強熱心 = studious. 熱 = heat → enthusiasm cluster: 熱中する."}, {"w": "積極的", "wf": "<ruby>積極的<rt>せっきょくてき</rt></ruby>", "r": "せっきょくてき", "m": "proactive; positive", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["<ruby>会議<rt>かいぎ</rt></ruby>では <ruby>積極的<rt>せっきょくてき</rt></ruby>に <ruby>発言<rt>はつげん</rt></ruby>しましょう。", "Let us speak up proactively in meetings."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>何事<rt>なにごと</rt></ruby>にも <ruby>積極的<rt>せっきょくてき</rt></ruby>だ。", "He is proactive about everything."], ["<ruby>積極的<rt>せっきょくてき</rt></ruby>な <ruby>態度<rt>たいど</rt></ruby>が <ruby>評価<rt>ひょうか</rt></ruby>された。", "His proactive attitude was appreciated."]], "n": "Opposite: 消極的 (しょうきょくてき) = passive/reserved. Interview keyword."}, {"w": "具体的", "wf": "<ruby>具体的<rt>ぐたいてき</rt></ruby>", "r": "ぐたいてき", "m": "concrete; specific", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["もっと <ruby>具体的<rt>ぐたいてき</rt></ruby>に <ruby>説明<rt>せつめい</rt></ruby>してください。", "Please explain more concretely."], ["<ruby>具体的<rt>ぐたいてき</rt></ruby>な <ruby>例<rt>れい</rt></ruby>を <ruby>挙<rt>あ</rt></ruby>げましょう。", "Let me give a concrete example."], ["<ruby>計画<rt>けいかく</rt></ruby>はまだ <ruby>具体的<rt>ぐたいてき</rt></ruby>ではない。", "The plan is not yet concrete."]], "n": "Opposite: 抽象的 (N2). 具体例 = concrete example."}, {"w": "一般的", "wf": "<ruby>一般的<rt>いっぱんてき</rt></ruby>", "r": "いっぱんてき", "m": "general; common; typical", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["<ruby>日本<rt>にほん</rt></ruby>では <ruby>一般的<rt>いっぱんてき</rt></ruby>に、 <ruby>家<rt>いえ</rt></ruby>の <ruby>中<rt>なか</rt></ruby>で <ruby>靴<rt>くつ</rt></ruby>を <ruby>脱<rt>ぬ</rt></ruby>ぐ。", "In Japan, people generally take off their shoes indoors."], ["それは <ruby>一般的<rt>いっぱんてき</rt></ruby>な <ruby>考<rt>かんが</rt></ruby>え <ruby>方<rt>かた</rt></ruby>です。", "That is a common way of thinking."], ["この <ruby>名前<rt>なまえ</rt></ruby>は <ruby>女性<rt>じょせい</rt></ruby>に <ruby>一般的<rt>いっぱんてき</rt></ruby>だ。", "This name is common among women."]], "n": "一般 = the general public. 一般的に言えば = generally speaking."}, {"w": "完全", "wf": "<ruby>完全<rt>かんぜん</rt></ruby>", "r": "かんぜん", "m": "complete; perfect", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["けがは <ruby>完全<rt>かんぜん</rt></ruby>に <ruby>治<rt>なお</rt></ruby>った。", "The injury has healed completely."], ["<ruby>完全<rt>かんぜん</rt></ruby>な <ruby>答<rt>こた</rt></ruby>えはないかもしれない。", "There may be no perfect answer."], ["<ruby>準備<rt>じゅんび</rt></ruby>はまだ <ruby>完全<rt>かんぜん</rt></ruby>ではない。", "Preparations are not yet complete."]], "n": "完全に = completely (most common use). 不完全 = incomplete. 完璧 (かんぺき) = flawless."}, {"w": "無駄", "wf": "<ruby>無駄<rt>むだ</rt></ruby>", "r": "むだ", "m": "waste; futile", "p": "na-adjective / noun", "t": "adj", "d": 10, "ex": [["<ruby>時間<rt>じかん</rt></ruby>を <ruby>無駄<rt>むだ</rt></ruby>にしないでください。", "Please do not waste time."], ["<ruby>電気<rt>でんき</rt></ruby>の <ruby>無駄<rt>むだ</rt></ruby> <ruby>遣<rt>づか</rt></ruby>いをやめよう。", "Let us stop wasting electricity."], ["<ruby>努力<rt>どりょく</rt></ruby>は <ruby>無駄<rt>むだ</rt></ruby>にはならない。", "Effort will not go to waste."]], "n": "無駄遣い = wasteful spending. もったいない = what-a-waste feeling."}, {"w": "順調", "wf": "<ruby>順調<rt>じゅんちょう</rt></ruby>", "r": "じゅんちょう", "m": "smooth; going well", "p": "na-adjective", "t": "adj", "d": 10, "ex": [["<ruby>仕事<rt>しごと</rt></ruby>は <ruby>順調<rt>じゅんちょう</rt></ruby>に <ruby>進<rt>すす</rt></ruby>んでいます。", "Work is progressing smoothly."], ["<ruby>手術<rt>しゅじゅつ</rt></ruby>の <ruby>後<rt>あと</rt></ruby>、 <ruby>回復<rt>かいふく</rt></ruby>は <ruby>順調<rt>じゅんちょう</rt></ruby>だ。", "After the surgery, recovery is going well."], ["<ruby>全<rt>すべ</rt></ruby>てが <ruby>順調<rt>じゅんちょう</rt></ruby>というわけではない。", "Not everything is going smoothly."]], "n": "Status-report word: 順調です = on track. 調子がいい is the spoken version."}, {"w": "主に", "wf": "<ruby>主<rt>おも</rt></ruby>に", "r": "おもに", "m": "mainly", "p": "adverb", "t": "adv", "d": 10, "ex": [["この <ruby>教室<rt>きょうしつ</rt></ruby>では、 <ruby>主<rt>おも</rt></ruby>に <ruby>会話<rt>かいわ</rt></ruby>を <ruby>練習<rt>れんしゅう</rt></ruby>する。", "In this class, we mainly practice conversation."], ["<ruby>客<rt>きゃく</rt></ruby>は <ruby>主<rt>おも</rt></ruby>に <ruby>近所<rt>きんじょ</rt></ruby>の <ruby>人<rt>ひと</rt></ruby>たちだ。", "The customers are mainly people from the neighborhood."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>主<rt>おも</rt></r
