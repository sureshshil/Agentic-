on; feeling", "p": "noun", "t": "noun", "d": 14, "ex": [["<ruby>寒<rt>さむ</rt></ruby>さで <ruby>指<rt>ゆび</rt></ruby>の <ruby>感覚<rt>かんかく</rt></ruby>がなくなった。", "My fingers went numb from the cold."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>言葉<rt>ことば</rt></ruby>の <ruby>感覚<rt>かんかく</rt></ruby>がいい。", "He has a good feel for language."], ["<ruby>若<rt>わか</rt></ruby>い <ruby>人<rt>ひと</rt></ruby>の <ruby>感覚<rt>かんかく</rt></ruby>では、それは <ruby>普通<rt>ふつう</rt></ruby>のことらしい。", "By young people's sensibilities, that is apparently normal."]], "n": "Physical sensation and intuitive sense. 感覚がない = numb."}, {"w": "希望", "wf": "<ruby>希望<rt>きぼう</rt></ruby>", "r": "きぼう", "m": "hope; wish; request", "p": "noun / suru-verb", "t": "noun", "d": 14, "ex": [["<ruby>希望<rt>きぼう</rt></ruby>を <ruby>捨<rt>す</rt></ruby>てずに <ruby>頑張<rt>がんば</rt></ruby>ろう。", "Let us keep going without abandoning hope."], ["<ruby>参加<rt>さんか</rt></ruby>を <ruby>希望<rt>きぼう</rt></ruby>する <ruby>方<rt>かた</rt></ruby>は、ご <ruby>連絡<rt>れんらく</rt></ruby>ください。", "Those who wish to participate, please contact us."], ["<ruby>第一<rt>だいいち</rt></ruby> <ruby>希望<rt>きぼう</rt></ruby>の <ruby>会社<rt>かいしゃ</rt></ruby>から <ruby>内定<rt>ないてい</rt></ruby>をもらった。", "I got an offer from my first-choice company."]], "n": "Forms ask ご希望 = your preference. 第一希望 = first choice (job/school hunting)."}, {"w": "飽きる", "wf": "<ruby>飽<rt>あ</rt></ruby>きる", "r": "あきる", "m": "to get tired of; to get bored with", "p": "v1 intransitive", "t": "verb", "d": 14, "ex": [["<ruby>毎日<rt>まいにち</rt></ruby> <ruby>同<rt>おな</rt></ruby>じ <ruby>弁当<rt>べんとう</rt></ruby>で、さすがに <ruby>飽<rt>あ</rt></ruby>きた。", "The same lunch every day — I am finally sick of it."], ["このゲームは <ruby>何時間<rt>なんじかん</rt></ruby>やっても <ruby>飽<rt>あ</rt></ruby>きない。", "No matter how many hours I play this game, I do not get bored."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>飽<rt>あ</rt></ruby>きっぽくて、 <ruby>何<rt>なに</rt></ruby>をしても <ruby>続<rt>つづ</rt></ruby>かない。", "He gets bored easily and never sticks with anything."]], "n": "Takes に. 飽きっぽい = quick to lose interest. V-stem＋飽きる: 食べ飽きた."}, {"w": "酔う", "wf": "<ruby>酔<rt>よ</rt></ruby>う", "r": "よう", "m": "to get drunk; to get motion sickness", "p": "v5 intransitive", "t": "verb", "d": 14, "ex": [["<ruby>彼<rt>かれ</rt></ruby>はビール <ruby>一杯<rt>いっぱい</rt></ruby>で <ruby>酔<rt>よ</rt></ruby>ってしまう。", "He gets drunk on a single beer."], ["バスに <ruby>酔<rt>よ</rt></ruby>いやすいので、 <ruby>前<rt>まえ</rt></ruby>の <ruby>席<rt>せき</rt></ruby>に <ruby>座<rt>すわ</rt></ruby>る。", "I get carsick easily, so I sit in the front seat."], ["<ruby>昨日<rt>きのう</rt></ruby>は <ruby>酔<rt>よ</rt></ruby>って、 <ruby>終電<rt>しゅうでん</rt></ruby>を <ruby>逃<rt>のが</rt></ruby>した。", "Yesterday I got drunk and missed the last train."]], "n": "One verb for alcohol and motion sickness. 酔っ払い = a drunk. 二日酔い = hangover."}, {"w": "訪れる", "wf": "<ruby>訪<rt>おとず</rt></ruby>れる", "r": "おとずれる", "m": "to visit; (season) to arrive (written)", "p": "v1 transitive/intransitive", "t": "verb", "d": 14, "ex": [["<ruby>毎年<rt>まいとし</rt></ruby>、 <ruby>多<rt>おお</rt></ruby>くの <ruby>観光客<rt>かんこうきゃく</rt></ruby>が <ruby>京都<rt>きょうと</rt></ruby>を <ruby>訪<rt>おとず</rt></ruby>れる。", "Every year, many tourists visit Kyoto."], ["この <ruby>町<rt>まち</rt></ruby>にも、ようやく <ruby>春<rt>はる</rt></ruby>が <ruby>訪<rt>おとず</rt></ruby>れた。", "Spring has finally arrived in this town too."], ["チャンスは <ruby>突然<rt>とつぜん</rt></ruby> <ruby>訪<rt>おとず</rt></ruby>れる。", "Opportunity arrives suddenly."]], "n": "Written word — news and essays. Spoken: 訪ねる／行く. Seasons and chances 訪れる."}, {"w": "不安", "wf": "<ruby>不安<rt>ふあん</rt></ruby>", "r": "ふあん", "m": "anxious; uneasy", "p": "na-adjective / noun", "t": "adj", "d": 14, "ex": [["<ruby>初<rt>はじ</rt></ruby>めての <ruby>一人<rt>ひとり</rt></ruby> <ruby>暮<rt>ぐ</rt></ruby>らしで、 <ruby>不安<rt>ふあん</rt></ruby>なことが <ruby>多<rt>おお</rt></ruby>い。", "Living alone for the first time, there is much to feel anxious about."], ["<ruby>試験<rt>しけん</rt></ruby>の <ruby>結果<rt>けっか</rt></ruby>が <ruby>不安<rt>ふあん</rt></ruby>で <ruby>眠<rt>ねむ</rt></ruby>れなかった。", "I was so anxious about the exam results I could not sleep."], ["<ruby>将来<rt>しょうらい</rt></ruby>に <ruby>不安<rt>ふあん</rt></ruby>を <ruby>感<rt>かん</rt></ruby>じる <ruby>若者<rt>わかもの</rt></ruby>が <ruby>増<rt>ふ</rt></ruby>えている。", "More young people feel anxiety about the future."]], "n": "Opposite: 安心. 不安がる = show anxiety (about others)."}, {"w": "可能", "wf": "<ruby>可能<rt>かのう</rt></ruby>", "r": "かのう", "m": "possible", "p": "na-adjective / noun", "t": "adj", "d": 14, "ex": [["インターネットがあれば、 <ruby>家<rt>いえ</rt></ruby>で <ruby>仕事<rt>しごと</rt></ruby>をすることも <ruby>可能<rt>かのう</rt></ruby>だ。", "With the internet, working from home is also possible."], ["<ruby>予約<rt>よやく</rt></ruby>の <ruby>変更<rt>へんこう</rt></ruby>は <ruby>前日<rt>ぜんじつ</rt></ruby>まで <ruby>可能<rt>かのう</rt></ruby>です。", "Reservation changes are possible until the day before."], ["<ruby>彼<rt>かれ</rt></ruby>が <ruby>合格<rt>ごうかく</rt></ruby>する <ruby>可能<rt>かのう</rt></ruby> <ruby>性<rt>せい</rt></ruby>は <ruby>高<rt>たか</rt></ruby>い。", "The possibility of him passing is high."]], "n": "可能性 = possibility — N3 reading/listening constant. Opposite: 不可能."}, {"w": "確実", "wf": "<ruby>確実<rt>かくじつ</rt></ruby>", "r": "かくじつ", "m": "certain; reliable", "p": "na-adjective", "t": "adj", "d": 14, "ex": [["この <ruby>方法<rt>ほうほう</rt></ruby>なら <ruby>確実<rt>かくじつ</rt></ruby>に <ruby>覚<rt>おぼ</rt></ruby>えられる。", "With this method you can memorize reliably."], ["<ruby>彼女<rt>かのじょ</rt></ruby>の <ruby>合格<rt>ごうかく</rt></ruby>はほぼ <ruby>確実<rt>かくじつ</rt></ruby>だ。", "Her passing is almost certain."], ["<ruby>急<rt>いそ</rt></ruby>ぐより、 <ruby>確実<rt>かくじつ</rt></ruby>な <ruby>方法<rt>ほうほう</rt></ruby>を <ruby>選<rt>えら</rt></ruby>ぼう。", "Rather than rushing, let us choose the reliable method."]], "n": "確実に = without fail/steadily. 確か (batch 2) = if I recall; 確実 = guaranteed."}, {"w": "番組", "wf": "<ruby>番組<rt>ばんぐみ</rt></ruby>", "r": "ばんぐみ", "m": "(TV/radio) program", "p": "noun", "t": "noun", "d": 15, "ex": [["<ruby>毎週<rt>まいしゅう</rt></ruby> <ruby>見<rt>み</rt></ruby>ている <ruby>番組<rt>ばんぐみ</rt></ruby>がある。", "There is a program I watch every week."], ["<ruby>料理<rt>りょうり</rt></ruby> <ruby>番組<rt>ばんぐみ</rt></ruby>を <ruby>見<rt>み</rt></ruby>て、レシピを <ruby>覚<rt>おぼ</rt></ruby>えた。", "I learned the recipe from a cooking show."], ["その <ruby>番組<rt>ばんぐみ</rt></ruby>は <ruby>子<rt>こ</rt></ruby>どもに <ruby>人気<rt>にんき</rt></ruby>がある。", "That program is popular with children."]], "n": "Suffix use: 料理番組, ニュース番組. Listening section loves TV/radio contexts."}, {"w": "広告", "wf": "<ruby>広告<rt>こうこく</rt></ruby>", "r": "こうこく", "m": "advertisement", "p": "noun / suru-verb", "t": "noun", "d": 15, "ex": [["<ruby>電車<rt>でんしゃ</rt></ruby>の <ruby>中<rt>なか</rt></ruby>は <ruby>広告<rt>こうこく</rt></ruby>だらけだ。", "The inside of the train is covered in ads."], ["<ruby>新聞<rt>しんぶん</rt></ruby>に <ruby>求人<rt>きゅうじん</rt></ruby> <ruby>広告<rt>こうこく</rt></ruby>が <ruby>出<rt>で</rt></ruby>ていた。", "There was a job ad in the newspaper."], ["<ruby>広告<rt>こうこく</rt></ruby>を <ruby>見<rt>み</rt></ruby>て、この <ruby>店<rt>みせ</rt></ruby>に <ruby>来<rt>き</rt></ruby>ました。", "I came to this shop after seeing the ad."]], "n": "広告 = the ad itself; 宣伝 = the promoting activity (next word)."}, {"w": "宣伝", "wf": "<ruby>宣伝<rt>せんでん</rt></ruby>", "r": "せんでん", "m": "publicity; promotion", "p": "noun / suru-verb", "t": "noun", "d": 15, "ex": [["<ruby>新<rt>あたら</rt></ruby>しい <ruby>商品<rt>しょうひん</rt></ruby>をテレビで <ruby>宣伝<rt>せんでん</rt></ruby>している。", "They are promoting the new product on TV."], ["SNSで <ruby>店<rt>みせ</rt></ruby>の <ruby>宣伝<rt>せんでん</rt></ruby>をしている。", "I promote my shop on social media."], ["<ruby>宣伝<rt>せんでん</rt></ruby>ほど <ruby>良<rt>よ</rt></ruby>い <ruby>商品<rt>しょうひん</rt></ruby>ではなかった。", "The product was not as good as the hype."]], "n": "宣伝する = to promote. 広告 = an ad (thing); 宣伝 = promotion (act)."}, {"w": "伝統", "wf": "<ruby>伝統<rt>でんとう</rt></ruby>", "r": "でんとう", "m": "tradition", "p": "noun", "t": "noun", "d": 15, "ex": [["この <ruby>祭<rt>まつ</rt></ruby>りには <ruby>三百年<rt>さんびゃくねん</rt></ruby>の <ruby>伝統<rt>でんとう</rt></ruby>がある。", "This festival has a 300-year tradition."], ["<ruby>伝統<rt>でんとう</rt></ruby> <ruby>的<rt>てき</rt></ruby>な <ruby>日本<rt>にほん</rt></ruby> <ruby>料理<rt>りょうり</rt></ruby>を <ruby>習<rt>なら</rt></ruby>いたい。", "I want to learn traditional Japanese cooking."], ["<ruby>若<rt>わか</rt></ruby>い <ruby>世代<rt>せだい</rt></ruby>が <ruby>伝統<rt>でんとう</rt></ruby>を <ruby>守<rt>まも</rt></ruby>っている。", "The young generation is preserving the tradition."]], "n": "伝統的な＋N is the common form. 文化 pairs with it: 伝統文化."}, {"w": "宗教", "wf": "<ruby>宗教<rt>しゅうきょう</rt></ruby>", "r": "しゅうきょう", "m": "religion", "p": "noun", "t": "noun", "d": 15, "ex": [["<ruby>世界<rt>せかい</rt></ruby>には <ruby>様々<rt>さまざま</rt></ruby>な <ruby>宗教<rt>しゅうきょう</rt></ruby>がある。", "There are various religions in the world."], ["<ruby>宗教<rt>しゅうきょう</rt></ruby>によって <ruby>食<rt>た</rt></ruby>べられない <ruby>物<rt>もの</rt></ruby>がある <ruby>人<rt>ひと</rt></ruby>もいる。", "Some people cannot eat certain things due to religion."], ["<ruby>日本人<rt>にほんじん</rt></ruby>は <ruby>宗教<rt>しゅうきょう</rt></ruby>に <ruby>対<rt>たい</rt></ruby>する <ruby>考<rt>かんが</rt></ruby>え <ruby>方<rt>かた</rt></ruby>が <ruby>独特<rt>どくとく</rt></ruby>だと <ruby>言<rt>い</rt></ruby>われる。", "Japanese attitudes toward religion are said to be unique."]], "n": "Reading-passage word for culture topics. 信じる (batch 1) pairs: 宗教を信じる."}, {"w": "芸術", "wf": "<ruby>芸術<rt>げいじゅつ</rt></ruby>", "r": "げいじゅつ", "m": "art; the arts", "p": "noun", "t": "noun", "d": 15, "ex": [["<ruby>秋<rt>あき</rt></ruby>は <ruby>芸術<rt>げいじゅつ</rt></ruby>の <ruby>季節<rt>きせつ</rt></ruby>と <ruby>言<rt>い</rt></ruby>われる。", "Autumn is called the season of art."], ["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>芸術<rt>げいじゅつ</rt></ruby> <ruby>的<rt>てき</rt></ruby>な <ruby>才能<rt>さいのう</rt></ruby>がある。", "She has artistic talent."], ["この <ruby>建物<rt>たてもの</rt></ruby>は <ruby>芸術<rt>げいじゅつ</rt></ruby> <ruby>作品<rt>さくひん</rt></ruby>のようだ。", "This building is like a work of art."]], "n": "芸術の秋 = set autumn phrase. 美術 = fine art (museums); 芸術 = art broadly."}, {"w": "気候", "wf": "<ruby>気候<rt>きこう</rt></ruby>", "r": "きこう", "m": "climate", "p": "noun", "t": "noun", "d": 15, "ex": [["<ruby>日本<rt>にほん</rt></ruby>の <ruby>気候<rt>きこう</rt></ruby>は <ruby>四季<rt>しき</rt></ruby>がはっきりしている。", "Japan's climate has four distinct seasons."], ["この <ruby>地域<rt>ちいき</rt></ruby>は <ruby>一年中<rt>いちねんじゅう</rt></ruby> <ruby>温暖<rt>おんだん</rt></ruby>な <ruby>気候<rt>きこう</rt></ruby>だ。", "This region has a warm climate all year round."], ["<ruby>気候<rt>きこう</rt></ruby>の <ruby>変化<rt>へんか</rt></ruby>が <ruby>農業<rt>のうぎょう</rt></ruby>に <ruby>影響<rt>えいきょう</rt></ruby>を <ruby>与<rt>あた</rt></ruby>えている。", "Climate change is affecting agriculture."]], "n": "気候 = climate (long-term); 天気 = weather (today); 天候 = weather conditions (formal)."}, {"w": "気温", "wf": "<ruby>気温<rt>きおん</rt></ruby>", "r": "きおん", "m": "(air) temperature", "p": "noun", "t": "noun", "d": 15, "ex": [["<ruby>今日<rt>きょう</rt></ruby>の <ruby>最高<rt>さいこう</rt></ruby> <ruby>気温<rt>きおん</rt></ruby>は <ruby>三十五度<rt>さんじゅうごど</rt></ruby>だそうだ。", "Today's high is apparently 35 degrees."], ["<ruby>朝<rt>あさ</rt></ruby>と <ruby>昼<rt>ひる</rt></ruby>の <ruby>気温<rt>きおん</rt></ruby> <ruby>差<rt>さ</rt></ruby>が <ruby>大<rt>おお</rt></ruby>きい。", "The temperature difference between morning and noon is large."], ["<ruby>気温<rt>きおん</rt></ruby>が <ruby>下<rt>さ</rt></ruby>がって、 <ruby>秋<rt>あき</rt></ruby>らしくなってきた。", "The temperature has dropped and it is feeling like autumn."]], "n": "Weather-forecast vocabulary: 最高気温/最低気温. 温度 = temperature of things (next)."}, {"w": "温度", "wf": "<ruby>温度<rt>おんど</rt></ruby>", "r": "おんど", "m": "temperature (of things)", "p": "noun", "t": "noun", "d": 15, "ex": [["エアコンの <ruby>温度<rt>おんど</rt></ruby>を <ruby>下<rt>さ</rt></ruby>げてもいいですか。", "May I lower the air conditioner temperature?"], ["お <ruby>風呂<rt>ふろ</rt></ruby>の <ruby>温度<rt>おんど</rt></ruby>は <ruby>四十度<rt>よんじゅうど</rt></ruby>ぐらいがいい。", "Around 40 degrees is good for bath temperature."], ["この <ruby>料理<rt>りょうり</rt></ruby>は <ruby>温度<rt>おんど</rt></ruby> <ruby>管理<rt>かんり</rt></ruby>が <ruby>難<rt>むずか</rt></ruby>しい。", "Temperature control is difficult for this dish."]], "n": "気温 = outdoor air; 温度 = things (bath, aircon, oven); 体温 = body temperature."}, {"w": "地球", "wf": "<ruby>地球<rt>ちきゅう</rt></ruby>", "r": "ちきゅう", "m": "the Earth", "p": "noun", "t": "noun", "d": 15, "ex": [["<ruby>地球<rt>ちきゅう</rt></ruby>は <ruby>太陽<rt>たいよう</rt></ruby>の <ruby>周<rt>まわ</rt></ruby>りを <ruby>回<rt>まわ</rt></ruby>っている。", "The Earth revolves around the sun."], ["<ruby>地球<rt>ちきゅう</rt></ruby> <ruby>温暖<rt>おんだん</rt></ruby> <ruby>化<rt>か</rt></ruby>は <ruby>世界<rt>せかい</rt></ruby> <ruby>共通<rt>きょうつう</rt></ruby>の <ruby>課題<rt>かだい</rt></ruby>だ。", "Global warming is a challenge common to the whole world."], ["<ruby>地球<rt>ちきゅう</rt></ruby>にやさしい <ruby>生活<rt>せいかつ</rt></ruby>を <ruby>心<rt>こころ</rt></ruby>がけよう。", "Let us try to live in an earth-friendly way."]], "n": "地球温暖化 = global warming — environment-passage constant. 〜にやさしい = friendly to."}, {"w": "手術", "wf": "<ruby>手術<rt>しゅじゅつ</rt></ruby>", "r": "しゅじゅつ", "m": "surgery; operation", "p": "noun / suru-verb", "t": "noun", "d": 15, "ex": [["<ruby>父<rt>ちち</rt></ruby>は <ruby>来週<rt>らいしゅう</rt></ruby>、 <ruby>目<rt>め</rt></ruby>の <ruby>手術<rt>しゅじゅつ</rt></ruby>を <ruby>受<rt>う</rt></ruby>ける。", "My father will have eye surgery next week."], ["<ruby>手術<rt>しゅじゅつ</rt></ruby>は <ruby>三時間<rt>さんじかん</rt></ruby>かかった。", "The surgery took three hours."], ["<ruby>手術<rt>しゅじゅつ</rt></ruby>の <ruby>後<rt>あと</rt></ruby>、 <ruby>回復<rt>かいふく</rt></ruby>は <ruby>順調<rt>じゅんちょう</rt></ruby>です。", "After the operation, recovery is going smoothly."]], "n": "手術を受ける = undergo surgery (patient side). Hard reading: しゅじゅつ — pronunciation question bait."}, {"w": "合計", "wf": "<ruby>合計<rt>ごうけい</rt></ruby>", "r": "ごうけい", "m": "total; sum", "p": "noun / suru-verb", "t": "noun", "d": 15, "ex": [["<ruby>合計<rt>ごうけい</rt></ruby>で <ruby>五千円<rt>ごせんえん</rt></ruby>になります。", "The total comes to 5,000 yen."], ["<ruby>三回<rt>さんかい</rt></ruby>の <ruby>試験<rt>しけん</rt></ruby>の <ruby>点数<rt>てんすう</rt></ruby>を <ruby>合計<rt>ごうけい</rt></ruby>した。", "I totaled the scores of the three tests."], ["<ruby>参加者<rt>さんかしゃ</rt></ruby>は <ruby>合計<rt>ごうけい</rt></ruby> <ruby>百人<rt>ひゃくにん</rt></ruby>を <ruby>超<rt>こ</rt></ruby>えた。", "Participants totaled over one hundred."]], "n": "Register phrase: 合計で〜円になります. 計 alone also = total on receipts."}, {"w": "区別", "wf": "<ruby>区別<rt>くべつ</rt></ruby>", "r": "くべつ", "m": "distinction; telling apart", "p": "noun / suru-verb", "t": "noun", "d": 15, "ex": [["この <ruby>二<rt>ふた</rt></ruby>つの <ruby>漢字<rt>かんじ</rt></ruby>の <ruby>区別<rt>くべつ</rt></ruby>が <ruby>難<rt>むずか</rt></ruby>しい。", "Telling these two kanji apart is difficult."], ["<ruby>夢<rt>ゆめ</rt></ruby>と <ruby>現実<rt>げんじつ</rt></ruby>の <ruby>区別<rt>くべつ</rt></ruby>がつかなくなった。", "I could no longer tell dream from reality."], ["<ruby>仕事<rt>しごと</rt></ruby>とプライベートを <ruby>区別<rt>くべつ</rt></ruby>している。", "I keep work and private life separate."]], "n": "区別がつかない = cannot tell apart — use it for your homophone pairs. 差別 = discrimination (different!)."}, {"w": "細かい", "wf": "<ruby>細<rt>こま</rt></ruby>かい", "r": "こまかい", "m": "fine; detailed; small (money)", "p": "i-adjective", "t": "adj", "d": 15, "ex": [["<ruby>細<rt>こま</rt></ruby>かい <ruby>字<rt>じ</rt></ruby>が <ruby>読<rt>よ</rt></ruby>みにくくなってきた。", "Fine print has become hard to read."], ["<ruby>細<rt>こま</rt></ruby>かいことは <ruby>後<rt>あと</rt></ruby>で <ruby>決<rt>き</rt></ruby>めましょう。", "Let us decide the details later."], ["すみません、 <ruby>細<rt>こま</rt></ruby>かいお <ruby>金<rt>かね</rt></ruby>がありません。", "Sorry, I do not have small change."]], "n": "細かいお金 = small change (register phrase). 細かい人 = detail-oriented (or nitpicky)."}, {"w": "濃い", "wf": "<ruby>濃<rt>こ</rt></ruby>い", "r": "こい", "m": "thick; dark; strong (taste, color)", "p": "i-adjective", "t": "adj", "d": 15, "ex": [["<ruby>濃<rt>こ</rt></ruby>いコーヒーを <ruby>飲<rt>の</rt></ruby>むと <ruby>眠<rt>ねむ</rt></ruby>れなくなる。", "If I drink strong coffee, I cannot sleep."], ["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>濃<rt>こ</rt></ruby>い <ruby>青<rt>あお</rt></ruby>のシャツを <ruby>着<rt>き</rt></ruby>ていた。", "She was wearing a dark blue shirt."], ["この <ruby>店<rt>みせ</rt></ruby>の <ruby>味<rt>あじ</rt></ruby>は <ruby>少<rt>すこ</rt></ruby>し <ruby>濃<rt>こ</rt></ruby>い。", "The flavors at this place are a bit strong."]], "n": "Opposite: 薄い. Taste, color, coffee, fog (濃い霧) — one adjective."}, {"w": "硬い", "wf": "<ruby>硬<rt>かた</rt></ruby>い", "r": "かたい", "m": "hard; stiff; formal", "p": "i-adjective", "t": "adj", "d": 15, "ex": [["この <ruby>肉<rt>にく</rt></ruby>は <ruby>硬<rt>かた</rt></ruby>くて <ruby>食<rt>た</rt></ruby>べにくい。", "This meat is tough and hard to eat."], ["<ruby>緊張<rt>きんちょう</rt></ruby>で <ruby>表情<rt>ひょうじょう</rt></ruby>が <ruby>硬<rt>かた</rt></ruby>くなっている。", "His expression is stiff with nervousness."], ["そんなに <ruby>硬<rt>かた</rt></ruby>く <ruby>考<rt>かんが</rt></ruby>えなくてもいいよ。", "You do not have to think about it so rigidly."]], "n": "Kanji trio: 硬い (physically hard), 固い (firm/tight), 堅い (solid/reliable) — kanji-section favourite."}, {"w": "柔らかい", "wf": "<ruby>柔<rt>やわ</rt></ruby>らかい", "r": "やわらかい", "m": "soft; tender; flexible", "p": "i-adjective", "t": "adj", "d": 15, "ex": [["この パンは <ruby>柔<rt>やわ</rt></ruby>らかくておいしい。", "This bread is soft and delicious."], ["<ruby>赤<rt>あか</rt></ruby>ちゃんの <ruby>肌<rt>はだ</rt></ruby>は <ruby>柔<rt>やわ</rt></ruby>らかい。", "A baby's skin is soft."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>頭<rt>あたま</rt></ruby>が <ruby>柔<rt>やわ</rt></ruby>らかくて、いいアイデアを <ruby>出<rt>だ</rt></ruby>す。", "He is flexible-minded and comes up with good ideas."]], "n": "頭が柔らかい・硬い = flexible/rigid thinking. Also written 軟らかい."}, {"w": "穏やか", "wf": "<ruby>穏<rt>おだ</rt></ruby>やか", "r": "おだやか", "m": "calm; gentle; mild", "p": "na-adjective", "t": "adj", "d": 15, "ex": [["<ruby>今日<rt>きょう</rt></ruby>は <ruby>風<rt>かぜ</rt></ruby>もなく、 <ruby>穏<rt>おだ</rt></ruby>やかな <ruby>天気<rt>てんき</rt></ruby>だ。", "Today is calm weather with no wind."], ["<ruby>祖父<rt>そふ</rt></ruby>は <ruby>穏<rt>おだ</rt></ruby>やかな <ruby>性格<rt>せいかく</rt></ruby>で、 <ruby>怒<rt>おこ</rt></ruby>ったことがない。", "My grandfather has a gentle nature and has never gotten angry."], ["<ruby>穏<rt>おだ</rt></ruby>やかな <ruby>海<rt>うみ</rt></ruby>を <ruby>見<rt>み</rt></ruby>ていると <ruby>心<rt>こころ</rt></ruby>が <ruby>落<rt>お</rt></ruby>ち <ruby>着<rt>つ</rt></ruby>く。", "Watching the calm sea settles my mind."]], "n": "Weather, sea, personality. 落ち着いた is close for people."}, {"w": "派手", "wf": "<ruby>派手<rt>はで</rt></ruby>", "r": "はで", "m": "flashy; showy", "p": "na-adjective", "t": "adj", "d": 15, "ex": [["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>派手<rt>はで</rt></ruby>な <ruby>服<rt>ふく</rt></ruby>が <ruby>好<rt>す</rt></ruby>きだ。", "She likes flashy clothes."], ["<ruby>結婚式<rt>けっこんしき</rt></ruby>は <ruby>派手<rt>はで</rt></ruby>にしたくない。", "I do not want a showy wedding."], ["その <ruby>色<rt>いろ</rt></ruby>はちょっと <ruby>派手<rt>はで</rt></ruby>すぎませんか。", "Is that color not a bit too loud?"]], "n": "Opposite: 地味 (next word). Clothes, colors, lifestyles."}, {"w": "地味", "wf": "<ruby>地味<rt>じみ</rt></ruby>", "r": "じみ", "m": "plain; subdued; unglamorous", "p": "na-adjective", "t": "adj", "d": 15, "ex": [["<ruby>彼<rt>かれ</rt></ruby>はいつも <ruby>地味<rt>じみ</rt></ruby>な <ruby>色<rt>いろ</rt></ruby>の <ruby>服<rt>ふく</rt></ruby>を <ruby>着<rt>き</rt></ruby>ている。", "He always wears plain-colored clothes."], ["<ruby>地味<rt>じみ</rt></ruby>な <ruby>仕事<rt>しごと</rt></ruby>だが、 <ruby>誰<rt>だれ</rt></ruby>かがやらなければならない。", "It is unglamorous work, but someone has to do it."], ["<ruby>髪<rt>かみ</rt></ruby>を <ruby>切<rt>き</rt></ruby>ったら、 <ruby>地味<rt>じみ</rt></ruby>な <ruby>印象<rt>いんしょう</rt></ruby>になった。", "After cutting my hair, my look became plainer."]], "n": "Pair with 派手. 地味に (slang) = quietly/actually: 地味に痛い = it actually hurts."}, {"w": "贅沢", "wf": "<ruby>贅沢<rt>ぜいたく</rt></ruby>", "r": "ぜいたく", "m": "luxurious; extravagant", "p": "na-adjective / noun", "t": "adj", "d": 15, "ex": [["たまには <ruby>贅沢<rt>ぜいたく</rt></ruby>な <ruby>食事<rt>しょくじ</rt></ruby>もいいだろう。", "A luxurious meal once in a while is fine."], ["<ruby>贅沢<rt>ぜいたく</rt></ruby>を <ruby>言<rt>い</rt></ruby>えば、もう <ruby>一部屋<rt>ひとへや</rt></ruby> <ruby>欲<rt>ほ</rt></ruby>しい。", "If I am being greedy, I would like one more room."], ["<ruby>休日<rt>きゅうじつ</rt></ruby>に <ruby>何<rt>なに</rt></ruby>もしないのが <ruby>一番<rt>いちばん</rt></ruby>の <ruby>贅沢<rt>ぜいたく</rt></ruby>だ。", "Doing nothing on a day off is the greatest luxury."]], "n": "Kanji is hard — reading ぜいたく is what matters. 贅沢を言えば = if I could ask for more."}, {"w": "高級", "wf": "<ruby>高級<rt>こうきゅう</rt></ruby>", "r": "こうきゅう", "m": "high-class; high-grade", "p": "na-adjective", "t": "adj", "d": 15, "ex": [["<ruby>駅前<rt>えきまえ</rt></ruby>に <ruby>高級<rt>こうきゅう</rt></ruby>ホテルが <ruby>建<rt>た</rt></ruby>った。", "A luxury hotel was built in front of the station."], ["このレストランは <ruby>高級<rt>こうきゅう</rt></ruby>すぎて <ruby>入<rt>はい</rt></ruby>りにくい。", "This restaurant is too fancy to walk into casually."], ["<ruby>高級<rt>こうきゅう</rt></ruby>な <ruby>肉<rt>にく</rt></ruby>をもらったので、 <ruby>今夜<rt>こんや</rt></ruby>はすき <ruby>焼<rt>や</rt></ruby>きだ。", "We got high-grade meat, so tonight is sukiyaki."]], "n": "高級 = expensive-grade things; 上級 = advanced level (courses). Do not mix."}, {"w": "不思議", "wf": "<ruby>不思議<rt>ふしぎ</rt></ruby>", "r": "ふしぎ", "m": "mysterious; strange; wondrous", "p": "na-adjective / noun", "t": "adj", "d": 15, "ex": [["<ruby>彼<rt>かれ</rt></ruby>とは <ruby>初<rt>はじ</rt></ruby>めて <ruby>会<rt>あ</rt></ruby>った <ruby>気<rt>き</rt></ruby>がしない。 <ruby>不思議<rt>ふしぎ</rt></ruby>な <ruby>人<rt>ひと</rt></ruby>だ。", "It does not feel like our first meeting. He is a curious person."], ["この <ruby>薬<rt>くすり</rt></ruby>を <ruby>飲<rt>の</rt></ruby>むと、 <ruby>不思議<rt>ふしぎ</rt></ruby>と <ruby>元気<rt>げんき</rt></ruby>が <ruby>出<rt>で</rt></ruby>る。", "Strangely enough, this medicine gives me energy."], ["<ruby>彼女<rt>かのじょ</rt></ruby>が <ruby>怒<rt>おこ</rt></ruby>るのも <ruby>不思議<rt>ふしぎ</rt></ruby>ではない。", "It is no wonder she got angry."]], "n": "不思議ではない = no wonder. 不思議と = strangely (adverbial)."}, {"w": "重要", "wf": "<ruby>重要<rt>じゅうよう</rt></ruby>", "r": "じゅうよう", "m": "important (formal)", "p": "na-adjective", "t": "adj", "d": 15, "ex": [["ここが <ruby>今日<rt>きょう</rt></ruby>の <ruby>会議<rt>かいぎ</rt></ruby>の <ruby>重要<rt>じゅうよう</rt></ruby>なポイントです。", "This is the important point of today's meeting."], ["<ruby>健康<rt>けんこう</rt></ruby> <ruby>管理<rt>かんり</rt></ruby>は <ruby>仕事<rt>しごと</rt></ruby>と <ruby>同<rt>おな</rt></ruby>じくらい <ruby>重要<rt>じゅうよう</rt></ruby>だ。", "Managing your health is as important as work."], ["<ruby>重要<rt>じゅうよう</rt></ruby>な <ruby>書類<rt>しょるい</rt></ruby>なので、なくさないでください。", "These are important documents, so please do not lose them."]], "n": "Written/formal 大切. Reading passages: 最も重要なのは = the most important thing is."}, {"w": "明らか", "wf": "<ruby>明<rt>あき</rt></ruby>らか", "r": "あきらか", "m": "clear; obvious", "p": "na-adjective", "t": "adj", "d": 15, "ex": [["<ruby>彼<rt>かれ</rt></ruby>が <ruby>嘘<rt>うそ</rt></ruby>をついているのは <ruby>明<rt>あき</rt></ruby>らかだ。", "It is obvious he is lying."], ["<ruby>調査<rt>ちょうさ</rt></ruby>で <ruby>新<rt>あたら</rt></ruby>しい <ruby>事実<rt>じじつ</rt></ruby>が <ruby>明<rt>あき</rt></ruby>らかになった。", "The survey brought a new fact to light."], ["<ruby>会社<rt>かいしゃ</rt></ruby>は <ruby>事故<rt>じこ</rt></ruby>の <ruby>原因<rt>げんいん</rt></ruby>を <ruby>明<rt>あき</rt></ruby>らかにした。", "The company disclosed the cause of the accident."]], "n": "明らかになる = come to light; 明らかにする = reveal. News-Japanese core."}, {"w": "偉い", "wf": "<ruby>偉<rt>えら</rt></ruby>い", "r": "えらい", "m": "great; admirable; high-ranking", "p": "i-adjective", "t": "adj", "d": 16, "ex": [["<ruby>毎日<rt>まいにち</rt></ruby> <ruby>自分<rt>じぶん</rt></ruby>で <ruby>弁当<rt>べんとう</rt></ruby>を <ruby>作<rt>つく</rt></ruby>るなんて、 <ruby>偉<rt>えら</rt></ruby>いね。", "Making your own lunch every day — impressive."], ["<ruby>偉<rt>えら</rt></ruby>い <ruby>人<rt>ひと</rt></ruby>の <ruby>話<rt>はなし</rt></ruby>は <ruby>長<rt>なが</rt></ruby>いことが <ruby>多<rt>おお</rt></ruby>い。", "Speeches by important people are often long."], ["<ruby>偉<rt>えら</rt></ruby>そうな <ruby>言<rt>い</rt></ruby>い <ruby>方<rt>かた</rt></ruby>をしないでください。", "Please do not talk in that condescending way."]], "n": "Praise (えらい！) and status (偉い人 = bigwig). 偉そう = acting superior — negative."}, {"w": "必死", "wf": "<ruby>必死<rt>ひっし</rt></ruby>", "r": "ひっし", "m": "desperate; frantic", "p": "na-adjective", "t": "adj", "d": 16, "ex": [["<ruby>終電<rt>しゅうでん</rt></ruby>に <ruby>間<rt>ま</rt></ruby>に <ruby>合<rt>あ</rt></ruby>うように <ruby>必死<rt>ひっし</rt></ruby>で <ruby>走<rt>はし</rt></ruby>った。", "I ran desperately to make the last train."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>家族<rt>かぞく</rt></ruby>のために <ruby>必死<rt>ひっし</rt></ruby>に <ruby>働<rt>はたら</rt></ruby>いている。", "He works frantically for his family."], ["<ruby>必死<rt>ひっし</rt></ruby>な <ruby>顔<rt>かお</rt></ruby>で <ruby>頼<rt>たの</rt></ruby>まれて、 <ruby>断<rt>ことわ</rt></ruby>れなかった。", "He asked with such a desperate face that I could not refuse."]], "n": "Literally 必ず死ぬ — with all one's might. 一生懸命 is the neutral cousin."}, {"w": "夢中", "wf": "<ruby>夢中<rt>むちゅう</rt></ruby>", "r": "むちゅう", "m": "absorbed in; crazy about", "p": "na-adjective", "t": "adj", "d": 16, "ex": [["<ruby>息子<rt>むすこ</rt></ruby>はゲームに <ruby>夢中<rt>むちゅう</rt></ruby>になっている。", "My son is absorbed in video games."], ["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>最近<rt>さいきん</rt></ruby>、 <ruby>韓国<rt>かんこく</rt></ruby>ドラマに <ruby>夢中<rt>むちゅう</rt></ruby>だ。", "She is crazy about Korean dramas lately."], ["<ruby>夢中<rt>むちゅう</rt></ruby>で <ruby>本<rt>ほん</rt></ruby>を <ruby>読<rt>よ</rt></ruby>んでいたら、 <ruby>終点<rt>しゅうてん</rt></ruby>まで <ruby>来<rt>き</rt></ruby>てしまった。", "I was so absorbed in my book that I rode to the last stop."]], "n": "〜に夢中になる = get hooked on. Literally inside a dream."}, {"w": "退屈", "wf": "<ruby>退屈<rt>たいくつ</rt></ruby>", "r": "たいくつ", "m": "boring; bored", "p": "na-adjective / noun / suru-verb", "t": "adj", "d": 16, "ex": [["<ruby>映画<rt>えいが</rt></ruby>は <ruby>退屈<rt>たいくつ</rt></ruby>で、 <ruby>途中<rt>とちゅう</rt></ruby>で <ruby>寝<rt>ね</rt></ruby>てしまった。", "The movie was boring and I fell asleep partway through."], ["<ruby>休<rt>やす</rt></ruby>みの <ruby>日<rt>ひ</rt></ruby>は <ruby>暇<rt>ひま</rt></ruby>すぎて <ruby>退屈<rt>たいくつ</rt></ruby>だ。", "On days off I have so much free time I am bored."], ["<ruby>長<rt>なが</rt></ruby>い <ruby>待<rt>ま</rt></ruby>ち <ruby>時間<rt>じかん</rt></ruby>に <ruby>退屈<rt>たいくつ</rt></ruby>している <ruby>子<rt>こ</rt></ruby>どもたち。", "Children bored during the long wait."]], "n": "退屈な映画 = the movie is boring; 退屈する = I am bored. つまらない = casual version."}, {"w": "別々", "wf": "<ruby>別々<rt>べつべつ</rt></ruby>", "r": "べつべつ", "m": "separate", "p": "na-adjective / noun", "t": "adj", "d": 16, "ex": [["お <ruby>会計<rt>かいけい</rt></ruby>は <ruby>別々<rt>べつべつ</rt></ruby>でお <ruby>願<rt>ねが</rt></ruby>いします。", "Separate checks, please."], ["<ruby>二人<rt>ふたり</rt></ruby>は <ruby>別々<rt>べつべつ</rt></ruby>の <ruby>会社<rt>かいしゃ</rt></ruby>で <ruby>働<rt>はたら</rt></ruby>いている。", "The two work at separate companies."], ["<ruby>荷物<rt>にもつ</rt></ruby>は <ruby>別々<rt>べつべつ</rt></ruby>に <ruby>送<rt>おく</rt></ruby>ってください。", "Please ship the packages separately."]], "n": "Restaurant essential: 別々でお願いします = split the bill. 別に = (not) particularly — different word."}, {"w": "つい", "wf": "つい", "r": "つい", "m": "unintentionally; by accident (habit); just (now)", "p": "adverb", "t": "adv", "d": 16, "ex": [["ダイエット <ruby>中<rt>ちゅう</rt></ruby>なのに、つい <ruby>食<rt>た</rt></ruby>べてしまった。", "I am on a diet, but I ended up eating anyway."], ["<ruby>課長<rt>かちょう</rt></ruby>の <ruby>前<rt>まえ</rt></ruby>で、つい <ruby>本当<rt>ほんとう</rt></ruby>のことを <ruby>言<rt>い</rt></ruby>ってしまった。", "In front of the section chief, I accidentally blurted out the truth."], ["<ruby>彼<rt>かれ</rt></ruby>ならつい <ruby>先<rt>さき</rt></ruby>ほど <ruby>帰<rt>かえ</rt></ruby>りましたよ。", "He left just a moment ago."]], "n": "つい〜てしまう = could not help doing — grammar-section pattern. つい先ほど = just now."}, {"w": "うっかり", "wf": "うっかり", "r": "うっかり", "m": "carelessly; absent-mindedly", "p": "adverb", "t": "adv", "d": 16, "ex": [["うっかり <ruby>傘<rt>かさ</rt></ruby>を <ruby>電車<rt>でんしゃ</rt></ruby>に <ruby>忘<rt>わす</rt></ruby>れてしまった。", "I carelessly left my umbrella on the train."], ["うっかりして、 <ruby>約束<rt>やくそく</rt></ruby>の <ruby>時間<rt>じかん</rt></ruby>を <ruby>間違<rt>まちが</rt></ruby>えた。", "I was not paying attention and mistook the meeting time."], ["<ruby>秘密<rt>ひみつ</rt></ruby>をうっかり <ruby>話<rt>はな</rt></ruby>してしまいそうになった。", "I almost let the secret slip."]], "n": "Careless slips. つい = could not resist; うっかり = was not paying attention."}, {"w": "思わず", "wf": "<ruby>思<rt>おも</rt></ruby>わず", "r": "おもわず", "m": "in spite of oneself; reflexively", "p": "adverb", "t": "adv", "d": 16, "ex": [["おかしくて、 <ruby>思<rt>おも</rt></ruby>わず <ruby>笑<rt>わら</rt></ruby>ってしまった。", "It was so funny I laughed in spite of myself."], ["<ruby>痛<rt>いた</rt></ruby>くて <ruby>思<rt>おも</rt></ruby>わず <ruby>声<rt>こえ</rt></ruby>が <ruby>出<rt>で</rt></ruby>た。", "It hurt so much a sound escaped me."], ["びっくりして、 <ruby>思<rt>おも</rt></ruby>わず <ruby>手<rt>て</rt></ruby>に <ruby>持<rt>も</rt></ruby>っていた <ruby>物<rt>もの</rt></ruby>を <ruby>落<rt>お</rt></ruby>とした。", "Startled, I reflexively dropped what I was holding."]], "n": "Reflex reactions — body acts before mind. つい = habit/temptation; 思わず = reflex."}, {"w": "一応", "wf": "<ruby>一応<rt>いちおう</rt></ruby>", "r": "いちおう", "m": "tentatively; just in case; more or less", "p": "adverb", "t": "adv", "d": 16, "ex": [["<ruby>一応<rt>いちおう</rt></ruby>、 <ruby>傘<rt>かさ</rt></ruby>を <ruby>持<rt>も</rt></ruby>って <ruby>行<rt>い</rt></ruby>こう。", "Let us take umbrellas, just in case."], ["<ruby>一応<rt>いちおう</rt></ruby> <ruby>説明<rt>せつめい</rt></ruby>は <ruby>読<rt>よ</rt></ruby>みましたが、まだ <ruby>分<rt>わ</rt></ruby>からない <ruby>点<rt>てん</rt></ruby>があります。", "I did read the explanation, but there are still points I do not understand."], ["「 <ruby>大学<rt>だいがく</rt></ruby>を <ruby>出<rt>で</rt></ruby>ていますか。」「 <ruby>一応<rt>いちおう</rt></ruby>。」", "Did you graduate from university? — Well, technically, yes."]], "n": "Hedge word of Japanese life: for now / technically / just in case. Softens claims."}, {"w": "相変わらず", "wf": "<ruby>相変<rt>あいか</rt></ruby>わらず", "r": "あいかわらず", "m": "as always; same as ever", "p": "adverb", "t": "adv", "d": 16, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>相変<rt>あいか</rt></ruby>わらず <ruby>忙<rt>いそが</rt></ruby>しそうだ。", "He seems as busy as ever."], ["<ruby>相変<rt>あいか</rt></ruby>わらず <ruby>物価<rt>ぶっか</rt></ruby>が <ruby>高<rt>たか</rt></ruby>い。", "Prices are high, same as always."], ["「 <ruby>最近<rt>さいきん</rt></ruby>どう？」「 <ruby>相変<rt>あいか</rt></ruby>わらずだよ。」", "How have you been? — Same as always."]], "n": "Reunion small-talk word. Neutral-to-fond nuance."}, {"w": "いよいよ", "wf": "いよいよ", "r": "いよいよ", "m": "finally; at last (climax)", "p": "adverb", "t": "adv", "d": 16, "ex": [["いよいよ <ruby>明日<rt>あした</rt></ruby>、 <ruby>試験<rt>しけん</rt></ruby> <ruby>当日<rt>とうじつ</rt></ruby>だ。", "Tomorrow is finally exam day."], ["いよいよ <ruby>夏休<rt>なつやす</rt></ruby>みが <ruby>始<rt>はじ</rt></ruby>まる。", "Summer vacation is finally starting."], ["<ruby>雨<rt>あめ</rt></ruby>がいよいよ <ruby>強<rt>つよ</rt></ruby>くなってきた。", "The rain has grown even stronger."]], "n": "Rising tension before a big moment. とうとう/ついに = finally (result); いよいよ = here it comes."}, {"w": "ますます", "wf": "ますます", "r": "ますます", "m": "more and more; increasingly", "p": "adverb", "t": "adv", "d": 16, "ex": [["スマホは ますます <ruby>便利<rt>べんり</rt></ruby>になっている。", "Smartphones are becoming more and more convenient."], ["<ruby>雨<rt>あめ</rt></ruby>は ますます <ruby>強<rt>つよ</rt></ruby>くなった。", "The rain grew stronger and stronger."], ["<ruby>彼女<rt>かのじょ</rt></ruby>の <ruby>日本語<rt>にほんご</rt></ruby>は ますます <ruby>上手<rt>じょうず</rt></ruby>になっている。", "Her Japanese is getting better and better."]], "n": "Formal だんだん+. Business letter set phrase: ますますご活躍のことと…"}, {"w": "次第に", "wf": "<ruby>次第<rt>しだい</rt></ruby>に", "r": "しだいに", "m": "gradually (written)", "p": "adverb", "t": "adv", "d": 16, "ex": [["<ruby>空<rt>そら</rt></ruby>が <ruby>次第<rt>しだい</rt></ruby>に <ruby>暗<rt>くら</rt></ruby>くなってきた。", "The sky gradually grew dark."], ["<ruby>痛<rt>いた</rt></ruby>みは <ruby>次第<rt>しだい</rt></ruby>に <ruby>弱<rt>よわ</rt></ruby>くなるでしょう。", "The pain should gradually weaken."], ["<ruby>新<rt>あたら</rt></ruby>しい <ruby>生活<rt>せいかつ</rt></ruby>に <ruby>次第<rt>しだい</rt></ruby>に <ruby>慣<rt>な</rt></ruby>れていった。", "I gradually got used to the new life."]], "n": "Written だんだん. Bonus: N＋次第 (しだい) = depending on / as soon as — N3 grammar, same kanji."}, {"w": "早速", "wf": "<ruby>早速<rt>さっそく</rt></ruby>", "r": "さっそく", "m": "right away; immediately (acting on something new)", "p": "adverb", "t": "adv", "d": 16, "ex": [["<ruby>新<rt>あたら</rt></ruby>しい <ruby>炊飯器<rt>すいはんき</rt></ruby>を <ruby>早速<rt>さっそく</rt></ruby> <ruby>使<rt>つか</rt></ruby>ってみた。", "I tried out the new rice cooker right away."], ["アドバイスをもらったので、 <ruby>早速<rt>さっそく</rt></ruby> <ruby>実行<rt>じっこう</rt></ruby>します。", "I got the advice, so I will act on it immediately."], ["<ruby>早速<rt>さっそく</rt></ruby>ですが、 <ruby>本題<rt>ほんだい</rt></ruby>に <ruby>入<rt>はい</rt></ruby>りましょう。", "Without further ado, let us get to the main topic."]], "n": "早速ですが = meeting/email opener to skip small talk. すぐに = neutral; 早速 = eager."}, {"w": "まもなく", "wf": "まもなく", "r": "まもなく", "m": "soon; shortly (announcements)", "p": "adverb", "t": "adv", "d": 16, "ex": [["まもなく <ruby>二番線<rt>にばんせん</rt></ruby>に <ruby>電車<rt>でんしゃ</rt></ruby>が <ruby>参<rt>まい</rt></ruby>ります。", "A train will soon arrive at track two."], ["<ruby>映画<rt>えいが</rt></ruby>はまもなく <ruby>始<rt>はじ</rt></ruby>まります。", "The movie will begin shortly."], ["<ruby>開店<rt>かいてん</rt></ruby>からまもなく、 <ruby>店<rt>みせ</rt></ruby>は <ruby>満席<rt>まんせき</rt></ruby>になった。", "Shortly after opening, the shop was full."]], "n": "The station-announcement word — you hear it daily. Written 間もなく. もうすぐ = spoken."}, {"w": "再び", "wf": "<ruby>再<rt>ふたた</rt></ruby>び", "r": "ふたたび", "m": "again; once more (written)", "p": "adverb", "t": "adv", "d": 16, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>十年<rt>じゅうねん</rt></ruby> <ruby>後<rt>ご</rt></ruby>、 <ruby>再<rt>ふたた</rt></ruby>び <ruby>日本<rt>にほん</rt></ruby>の <ruby>土<rt>つち</rt></ruby>を <ruby>踏<rt>ふ</rt></ruby>んだ。", "Ten years later, he set foot on Japanese soil again."], ["<ruby>同<rt>おな</rt></ruby>じ <ruby>失敗<rt>しっぱい</rt></ruby>を <ruby>再<rt>ふたた</rt></ruby>び <ruby>繰<rt>く</rt></ruby>り <ruby>返<rt>かえ</rt></ruby>してはいけない。", "We must not repeat the same failure again."], ["<ruby>再<rt>ふたた</rt></ruby>び <ruby>会<rt>あ</rt></ruby>える <ruby>日<rt>ひ</rt></ruby>を <ruby>楽<rt>たの</rt></ruby>しみにしています。", "I look forward to the day we can meet again."]], "n": "Written また. Kanji 再 lives in 再会, 再開, 再放送 — learn the family."}, {"w": "何とか", "wf": "<ruby>何<rt>なん</rt></ruby>とか", "r": "なんとか", "m": "somehow; barely; one way or another", "p": "adverb", "t": "adv", "d": 16, "ex": [["<ruby>何<rt>なん</rt></ruby>とか <ruby>締<rt>し</rt></ruby>め <ruby>切<rt>き</rt></ruby>りに <ruby>間<rt>ま</rt></ruby>に <ruby>合<rt>あ</rt></ruby>った。", "I somehow made the deadline."], ["<ruby>難<rt>むずか</rt></ruby>しい <ruby>問題<rt>もんだい</rt></ruby>だが、 <ruby>何<rt>なん</rt></ruby>とかなるだろう。", "It is a hard problem, but it will work out somehow."], ["<ruby>何<rt>なん</rt></ruby>とかしてください。", "Please do something about it."]], "n": "何とかなる = it will work out (Japanese life philosophy). 何とかする = I will manage it."}, {"w": "恐らく", "wf": "<ruby>恐<rt>おそ</rt></ruby>らく", "r": "おそらく", "m": "probably (written)", "p": "adverb", "t": "adv", "d": 16, "ex": [["<ruby>恐<rt>おそ</rt></ruby>らく <ruby>彼<rt>かれ</rt></ruby>は <ruby>来<rt>こ</rt></ruby>ないだろう。", "He probably will not come."], ["<ruby>恐<rt>おそ</rt></ruby>らく <ruby>明日<rt>あした</rt></ruby>は <ruby>雨<rt>あめ</rt></ruby>になるでしょう。", "It will probably rain tomorrow."], ["この <ruby>問題<rt>もんだい</rt></ruby>は <ruby>恐<rt>おそ</rt></ruby>らく <ruby>世界<rt>せかい</rt></ruby> <ruby>中<rt>じゅう</rt></ruby>で <ruby>起<rt>お</rt></ruby>きている。", "This problem is probably happening all over the world."]], "n": "Written たぶん; pairs with だろう/でしょう. From 恐れる but no fear meaning."}, {"w": "どうせ", "wf": "どうせ", "r": "どうせ", "m": "anyway; in any case (resigned)", "p": "adverb", "t": "adv", "d": 16, "ex": [["どうせ <ruby>間<rt>ま</rt></ruby>に <ruby>合<rt>あ</rt></ruby>わないから、 <ruby>次<rt>つぎ</rt></ruby>の <ruby>電車<rt>でんしゃ</rt></ruby>で <ruby>行<rt>い</rt></ruby>こう。", "We will not make it anyway, so let us take the next train."], ["どうせやるなら、 <ruby>楽<rt>たの</rt></ruby>しくやろう。", "If we are doing it anyway, let us enjoy it."], ["どうせ <ruby>私<rt>わたし</rt></ruby>には <ruby>無理<rt>むり</rt></ruby>だと <ruby>思<rt>おも</rt></ruby>っていた。", "I assumed it was impossible for me anyway."]], "n": "Resigned tone — careful, it can sound negative. どうせなら = if we are at it anyway."}, {"w": "せっかく", "wf": "せっかく", "r": "せっかく", "m": "with much effort; precious (opportunity)", "p": "adverb", "t": "adv", "d": 16, "ex": [["せっかく <ruby>作<rt>つく</rt></ruby>った <ruby>料理<rt>りょうり</rt></ruby>を <ruby>食<rt>た</rt></ruby>べてもらえなかった。", "No one ate the food I went to the trouble of making."], ["せっかくの <ruby>休<rt>やす</rt></ruby>みだから、どこかへ <ruby>出<rt>で</rt></ruby>かけよう。", "It is a precious day off, so let us go out somewhere."], ["せっかく <ruby>日本<rt>にほん</rt></ruby>にいるのだから、 <ruby>日本語<rt>にほんご</rt></ruby>で <ruby>話<rt>はな</rt></ruby>そう。", "Since we are in Japan, of all things, let us speak Japanese."]], "n": "Effort or opportunity that deserves not to be wasted. せっかくですが = polite decline opener."}, {"w": "ちっとも", "wf": "ちっとも", "r": "ちっとも", "m": "(not) at all; (not) a bit", "p": "adverb", "t": "adv", "d": 16, "ex": [["<ruby>薬<rt>くすり</rt></ruby>を <ruby>飲<rt>の</rt></ruby>んでも、ちっとも <ruby>良<rt>よ</rt></ruby>くならない。", "Even taking the medicine, I am not getting better at all."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>話<rt>はなし</rt></ruby>はちっとも <ruby>面白<rt>おもしろ</rt></ruby>くない。", "His stories are not the least bit interesting."], ["ちっとも <ruby>知<rt>し</rt></ruby>りませんでした。", "I had no idea at all."]], "n": "Always negative. Casual 全然〜ない. Exam checks the negative-pairing adverbs: 決して, 必ずしも, ちっとも."}, {"w": "常に", "wf": "<ruby>常<rt>つね</rt></ruby>に", "r": "つねに", "m": "always; constantly (written)", "p": "adverb", "t": "adv", "d": 16, "ex": [["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>常<rt>つね</rt></ruby>に <ruby>冷静<rt>れいせい</rt></ruby>だ。", "She is always calm."], ["<ruby>安全<rt>あんぜん</rt></ruby>を <ruby>常<rt>つね</rt></ruby>に <ruby>第一<rt>だいいち</rt></ruby>に <ruby>考<rt>かんが</rt></ruby>えてください。", "Please always put safety first."], ["<ruby>社会<rt>しゃかい</rt></ruby>は <ruby>常<rt>つね</rt></ruby>に <ruby>変化<rt>へんか</rt></ruby>している。", "Society is constantly changing."]], "n": "Written いつも. 日常 (daily life), 非常 (emergency) share the kanji."}, {"w": "しっかり", "wf": "しっかり", "r": "しっかり", "m": "firmly; properly; reliably", "p": "adverb / suru-verb", "t": "adv", "d": 16, "ex": [["ロープをしっかり <ruby>握<rt>にぎ</rt></ruby>ってください。", "Hold the rope firmly."], ["<ruby>朝<rt>あさ</rt></ruby>ご <ruby>飯<rt>はん</rt></ruby>をしっかり <ruby>食<rt>た</rt></ruby>べてから <ruby>出<rt>で</rt></ruby>かけよう。", "Let us eat a proper breakfast before heading out."], ["<ruby>彼女<rt>かのじょ</rt></ruby>はまだ <ruby>二十歳<rt>はたち</rt></ruby>だが、しっかりしている。", "She is only twenty, but she has her head on straight."]], "n": "しっかりして！ = pull yourself together! しっかりした人 = dependable person."}, {"w": "まるで", "wf": "まるで", "r": "まるで", "m": "just like; as if; (not) at all", "p": "adverb", "t": "adv", "d": 16, "ex": [["<ruby>彼女<rt>かのじょ</rt></ruby>の <ruby>日本語<rt>にほんご</rt></ruby>は、まるで <ruby>日本人<rt>にほんじん</rt></ruby>のようだ。", "Her Japanese is just like a native's."], ["<ruby>夢<rt>ゆめ</rt></ruby>をまるで <ruby>見<rt>み</rt></ruby>ているような <ruby>一日<rt>いちにち</rt></ruby>だった。", "It was a day like a dream."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>言<rt>い</rt></ruby>っていることが、まるで <ruby>分<rt>わ</rt></ruby>からない。", "I do not understand what he is saying at all."]], "n": "Grammar tie-in: まるで〜ようだ (simile). With negative = completely not."}, {"w": "無事", "wf": "<ruby>無事<rt>ぶじ</rt></ruby>", "r": "ぶじ", "m": "safe; without incident", "p": "na-adjective / noun / adverb", "t": "adv", "d": 16, "ex": [["<ruby>家族<rt>かぞく</rt></ruby>は <ruby>全員<rt>ぜんいん</rt></ruby> <ruby>無事<rt>ぶじ</rt></ruby>です。", "My family are all safe."], ["<ruby>無事<rt>ぶじ</rt></ruby>に <ruby>試験<rt>しけん</rt></ruby>が <ruby>終<rt>お</rt></ruby>わって、ほっとした。", "The exam ended without a hitch, and I felt relieved."], ["<ruby>無事<rt>ぶじ</rt></ruby>を <ruby>祈<rt>いの</rt></ruby>っています。", "I am praying for your safety."]], "n": "Safe-arrival word: 無事に着きました = arrived safely. 事 (incident) + 無 (none)."}];
const $ = s => document.querySelector(s);
let deck = [], pos = 0, flipped = false;
let known = new Set(JSON.parse(localStorage.getItem("n3known") || "[]"));

const daySel = $("#day");
daySel.innerHTML = '<option value="">all 16 days</option>' +
  [...new Set(CARDS.map(c => c.d))].sort((a,b)=>a-b)
    .map(d => `<option value="${d}">day ${d}</option>`).join("");

function saveKnown(){ localStorage.setItem("n3known", JSON.stringify([...known])); }
function key(c){ return c.d + "|" + c.w; }

function build(){
  const d = daySel.value, t = $("#type").value;
  deck = CARDS.filter(c => (!d || c.d == d) && (!t || c.t === t));
  pos = 0; flipped = false;
  render();
}
function render(){
  const c = deck[pos];
  $("#count").textContent = deck.length ? `${pos+1} / ${deck.length}  ·  ${known.size} known` : "0";
  if(!c){ $("#card").innerHTML = "<div class='meaning'>No cards match.</div>"; return; }
  const mode = $("#mode").value;
  const front = mode === "en"
    ? `<div class="meaning">${c.m}</div><div class="pos">${c.p}</div>`
    : `<div class="word">${c.wf}</div><div class="pos">${c.p}</div>`;
  const exs = c.ex.filter(e => e[0]).map(e =>
    `<p class="jp">${e[0]}</p><p class="en">${e[1]}</p>`).join("");
  const back = `
    <div class="reading">${c.r}</div>
    <div class="word" style="font-size:34px">${mode==="en"?c.wf:""}</div>
    <div class="meaning">${mode==="en"?"":c.m}</div>
    <div class="ex">${exs}</div>
    ${c.n ? `<div class="note">${c.n}</div>` : ""}`;
  $("#card").innerHTML = (flipped ? back : front) +
    `<div class="hint">${flipped ? "" : "tap / space to flip"}</div>`;
  $("#card").style.outline = known.has(key(c)) ? "2px solid var(--good)" : "none";
}
function flip(){ flipped = !flipped; render(); }
function go(n){ if(!deck.length) return; pos = (pos + n + deck.length) % deck.length; flipped = false; render(); }
function mark(){
  const c = deck[pos]; if(!c) return;
  known.has(key(c)) ? known.delete(key(c)) : known.add(key(c));
  saveKnown(); go(1);
}
function shuffle(){
  for(let i = deck.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  pos = 0; flipped = false; render();
}
$("#card").onclick = flip;
$("#flip").onclick = flip;
$("#prev").onclick = () => go(-1);
$("#next").onclick = () => go(1);
$("#mark").onclick = mark;
$("#shuffle").onclick = shuffle;
$("#reset").onclick = () => { known.clear(); saveKnown(); render(); };
daySel.onchange = build; $("#type").onchange = build; $("#mode").onchange = build;
document.onkeydown = e => {
  if(e.key === " "){ e.preventDefault(); flip(); }
  else if(e.key === "ArrowRight") go(1);
  else if(e.key === "ArrowLeft") go(-1);
  else if(e.key.toLowerCase() === "k") mark();
  else if(e.key.toLowerCase() === "s") shuffle();
};
build();
</script>
