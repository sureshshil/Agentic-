uby>にデータの <ruby>分析<rt>ぶんせき</rt></ruby>を <ruby>担当<rt>たんとう</rt></ruby>している。", "He is mainly in charge of data analysis."]], "n": "From 主な (main). 主な原因 = main cause."}, {"w": "普段", "wf": "<ruby>普段<rt>ふだん</rt></ruby>", "r": "ふだん", "m": "usually; everyday", "p": "noun / adverb", "t": "adv", "d": 10, "ex": [["<ruby>普段<rt>ふだん</rt></ruby>は <ruby>七時<rt>しちじ</rt></ruby>に <ruby>起<rt>お</rt></ruby>きます。", "I usually get up at seven."], ["<ruby>普段<rt>ふだん</rt></ruby>から <ruby>準備<rt>じゅんび</rt></ruby>しておけば、 <ruby>慌<rt>あわ</rt></ruby>てない。", "If you prepare regularly, you will not panic."], ["<ruby>普段着<rt>ふだんぎ</rt></ruby>のままパーティーに <ruby>行<rt>い</rt></ruby>った。", "I went to the party in my everyday clothes."]], "n": "普段 = one's usual routine; 普通 = normal in general. 普段から = on a regular basis."}, {"w": "多少", "wf": "<ruby>多少<rt>たしょう</rt></ruby>", "r": "たしょう", "m": "somewhat; a little", "p": "adverb / noun", "t": "adv", "d": 10, "ex": [["<ruby>多少<rt>たしょう</rt></ruby> <ruby>高<rt>たか</rt></ruby>くても、いい <ruby>物<rt>もの</rt></ruby>を <ruby>買<rt>か</rt></ruby>いたい。", "Even if it is somewhat expensive, I want to buy good things."], ["<ruby>日本語<rt>にほんご</rt></ruby>は <ruby>多少<rt>たしょう</rt></ruby> <ruby>話<rt>はな</rt></ruby>せます。", "I can speak Japanese a little."], ["<ruby>多少<rt>たしょう</rt></ruby>の <ruby>失敗<rt>しっぱい</rt></ruby>は <ruby>気<rt>き</rt></ruby>にしない。", "I do not worry about minor failures."]], "n": "Humble-sounding a-bit. Literally 多+少. 少々 = polite a-moment/a-little."}, {"w": "様子", "wf": "<ruby>様子<rt>ようす</rt></ruby>", "r": "ようす", "m": "state; appearance; the way things look", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>外<rt>そと</rt></ruby>の <ruby>様子<rt>ようす</rt></ruby>を <ruby>見<rt>み</rt></ruby>てきます。", "I will go check how things look outside."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>朝<rt>あさ</rt></ruby>から <ruby>様子<rt>ようす</rt></ruby>がおかしい。", "He has been acting strange since morning."], ["しばらく <ruby>様子<rt>ようす</rt></ruby>を <ruby>見<rt>み</rt></ruby>ましょう。", "Let us wait and see for a while."]], "n": "様子を見る = wait and see (doctor phrase too). Extremely common in listening."}, {"w": "出来事", "wf": "<ruby>出来事<rt>できごと</rt></ruby>", "r": "できごと", "m": "event; happening", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>今日<rt>きょう</rt></ruby>あった <ruby>出来事<rt>できごと</rt></ruby>を <ruby>日記<rt>にっき</rt></ruby>に <ruby>書<rt>か</rt></ruby>いた。", "I wrote the day's events in my diary."], ["それは <ruby>十年前<rt>じゅうねんまえ</rt></ruby>の <ruby>出来事<rt>できごと</rt></ruby>だ。", "That happened ten years ago."], ["<ruby>世界<rt>せかい</rt></ruby>の <ruby>出来事<rt>できごと</rt></ruby>に <ruby>関心<rt>かんしん</rt></ruby>を <ruby>持<rt>も</rt></ruby>とう。", "Let us take an interest in world events."]], "n": "Neutral happenings. 事件 = incident (crime/trouble nuance)."}, {"w": "事件", "wf": "<ruby>事件<rt>じけん</rt></ruby>", "r": "じけん", "m": "incident; case (crime)", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>近所<rt>きんじょ</rt></ruby>で <ruby>事件<rt>じけん</rt></ruby>が <ruby>起<rt>お</rt></ruby>きた。", "An incident occurred in the neighborhood."], ["<ruby>警察<rt>けいさつ</rt></ruby>はその <ruby>事件<rt>じけん</rt></ruby>を <ruby>調<rt>しら</rt></ruby>べている。", "The police are investigating the case."], ["<ruby>事件<rt>じけん</rt></ruby>の <ruby>現場<rt>げんば</rt></ruby>には <ruby>入<rt>はい</rt></ruby>れません。", "You cannot enter the scene of the incident."]], "n": "事件 = crime/incident; 事故 = accident. News-Japanese pair."}, {"w": "筆者", "wf": "<ruby>筆者<rt>ひっしゃ</rt></ruby>", "r": "ひっしゃ", "m": "the author; the writer (of this text)", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>筆者<rt>ひっしゃ</rt></ruby>の <ruby>考<rt>かんが</rt></ruby>えに <ruby>合<rt>あ</rt></ruby>うものはどれか。", "Which one matches the author's thinking?"], ["<ruby>筆者<rt>ひっしゃ</rt></ruby>は <ruby>若者<rt>わかもの</rt></ruby>の <ruby>読書<rt>どくしょ</rt></ruby>について <ruby>述<rt>の</rt></ruby>べている。", "The author discusses young people's reading habits."], ["<ruby>筆者<rt>ひっしゃ</rt></ruby>が <ruby>最<rt>もっと</rt></ruby>も <ruby>言<rt>い</rt></ruby>いたいことは <ruby>何<rt>なん</rt></ruby>ですか。", "What does the author most want to say?"]], "n": "THE reading-section word — every N3 passage question uses it. 作者 = author of creative works."}, {"w": "場面", "wf": "<ruby>場面<rt>ばめん</rt></ruby>", "r": "ばめん", "m": "scene; situation", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>映画<rt>えいが</rt></ruby>の <ruby>最後<rt>さいご</rt></ruby>の <ruby>場面<rt>ばめん</rt></ruby>で <ruby>泣<rt>な</rt></ruby>いてしまった。", "I cried at the last scene of the movie."], ["<ruby>敬語<rt>けいご</rt></ruby>は <ruby>場面<rt>ばめん</rt></ruby>によって <ruby>使<rt>つか</rt></ruby>い <ruby>分<rt>わ</rt></ruby>ける。", "Polite language is used differently depending on the situation."], ["こういう <ruby>場面<rt>ばめん</rt></ruby>では <ruby>何<rt>なん</rt></ruby>と <ruby>言<rt>い</rt></ruby>えばいいですか。", "What should I say in this kind of situation?"]], "n": "Movie scenes and social situations. 場面によって = depending on the situation."}, {"w": "作品", "wf": "<ruby>作品<rt>さくひん</rt></ruby>", "r": "さくひん", "m": "work (of art, writing)", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>美術館<rt>びじゅつかん</rt></ruby>で <ruby>有名<rt>ゆうめい</rt></ruby>な <ruby>作品<rt>さくひん</rt></ruby>を <ruby>見<rt>み</rt></ruby>た。", "I saw famous works at the art museum."], ["この <ruby>作家<rt>さっか</rt></ruby>の <ruby>作品<rt>さくひん</rt></ruby>はどれも <ruby>面白<rt>おもしろ</rt></ruby>い。", "All of this writer's works are interesting."], ["コンテストに <ruby>作品<rt>さくひん</rt></ruby>を <ruby>出<rt>だ</rt></ruby>した。", "I submitted a piece to the contest."]], "n": "Art, novels, films — all 作品. 作家 = writer/artist."}, {"w": "習慣", "wf": "<ruby>習慣<rt>しゅうかん</rt></ruby>", "r": "しゅうかん", "m": "habit; custom", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>毎朝<rt>まいあさ</rt></ruby> <ruby>走<rt>はし</rt></ruby>るのが <ruby>習慣<rt>しゅうかん</rt></ruby>になった。", "Running every morning has become a habit."], ["<ruby>国<rt>くに</rt></ruby>によって <ruby>食事<rt>しょくじ</rt></ruby>の <ruby>習慣<rt>しゅうかん</rt></ruby>が <ruby>違<rt>ちが</rt></ruby>う。", "Eating customs differ by country."], ["<ruby>早寝<rt>はやね</rt></ruby> <ruby>早起<rt>はやお</rt></ruby>きの <ruby>習慣<rt>しゅうかん</rt></ruby>をつけたい。", "I want to build a habit of early to bed, early to rise."]], "n": "Personal habit and cultural custom. Same sound as 週間 (week) — context decides!"}, {"w": "癖", "wf": "<ruby>癖<rt>くせ</rt></ruby>", "r": "くせ", "m": "(personal) habit; quirk", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>髪<rt>かみ</rt></ruby>を <ruby>触<rt>さわ</rt></ruby>る <ruby>癖<rt>くせ</rt></ruby>がある。", "He has a habit of touching his hair."], ["<ruby>爪<rt>つめ</rt></ruby>を <ruby>噛<rt>か</rt></ruby>む <ruby>癖<rt>くせ</rt></ruby>を <ruby>直<rt>なお</rt></ruby>したい。", "I want to fix my nail-biting habit."], ["<ruby>癖<rt>くせ</rt></ruby>のある <ruby>字<rt>じ</rt></ruby>で <ruby>読<rt>よ</rt></ruby>みにくい。", "The handwriting is quirky and hard to read."]], "n": "癖 = unconscious personal habit (often negative); 習慣 = built routine."}, {"w": "健康", "wf": "<ruby>健康<rt>けんこう</rt></ruby>", "r": "けんこう", "m": "health", "p": "noun / na-adjective", "t": "noun", "d": 11, "ex": [["<ruby>健康<rt>けんこう</rt></ruby>のために、 <ruby>毎日<rt>まいにち</rt></ruby> <ruby>歩<rt>ある</rt></ruby>いています。", "I walk every day for my health."], ["たばこは <ruby>健康<rt>けんこう</rt></ruby>に <ruby>悪<rt>わる</rt></ruby>い。", "Cigarettes are bad for your health."], ["<ruby>健康<rt>けんこう</rt></ruby> <ruby>診断<rt>しんだん</rt></ruby>を <ruby>年<rt>ねん</rt></ruby>に <ruby>一回<rt>いっかい</rt></ruby> <ruby>受<rt>う</rt></ruby>けている。", "I get a health checkup once a year."]], "n": "健康診断 = the annual company checkup. 元気 = energetic (feeling); 健康 = health (state)."}, {"w": "命", "wf": "<ruby>命<rt>いのち</rt></ruby>", "r": "いのち", "m": "life", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>医者<rt>いしゃ</rt></ruby>は <ruby>多<rt>おお</rt></ruby>くの <ruby>命<rt>いのち</rt></ruby>を <ruby>救<rt>すく</rt></ruby>ってきた。", "The doctor has saved many lives."], ["シートベルトが <ruby>命<rt>いのち</rt></ruby>を <ruby>守<rt>まも</rt></ruby>る。", "Seatbelts protect lives."], ["<ruby>命<rt>いのち</rt></ruby>より <ruby>大切<rt>たいせつ</rt></ruby>なものはない。", "Nothing is more precious than life."]], "n": "命に関わる = life-threatening. 人生 = life (lived); 生活 = daily life; 命 = life itself."}, {"w": "笑顔", "wf": "<ruby>笑顔<rt>えがお</rt></ruby>", "r": "えがお", "m": "smile; smiling face", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>彼女<rt>かのじょ</rt></ruby>はいつも <ruby>笑顔<rt>えがお</rt></ruby>で <ruby>挨拶<rt>あいさつ</rt></ruby>する。", "She always greets people with a smile."], ["<ruby>子<rt>こ</rt></ruby>どもの <ruby>笑顔<rt>えがお</rt></ruby>を <ruby>見<rt>み</rt></ruby>ると <ruby>元気<rt>げんき</rt></ruby>が <ruby>出<rt>で</rt></ruby>る。", "Seeing children's smiles gives me energy."], ["<ruby>店員<rt>てんいん</rt></ruby>の <ruby>笑顔<rt>えがお</rt></ruby>が <ruby>印象<rt>いんしょう</rt></ruby>に <ruby>残<rt>のこ</rt></ruby>った。", "The clerk's smile left an impression."]], "n": "Special reading えがお (not わらいがお). 笑顔で = with a smile."}, {"w": "涙", "wf": "<ruby>涙<rt>なみだ</rt></ruby>", "r": "なみだ", "m": "tears", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>感動<rt>かんどう</rt></ruby>して <ruby>涙<rt>なみだ</rt></ruby>が <ruby>出<rt>で</rt></ruby>た。", "I was moved and tears came out."], ["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>涙<rt>なみだ</rt></ruby>を <ruby>拭<rt>ふ</rt></ruby>いて、また <ruby>笑<rt>わら</rt></ruby>った。", "She wiped her tears and smiled again."], ["<ruby>涙<rt>なみだ</rt></ruby>が <ruby>止<rt>と</rt></ruby>まらなかった。", "The tears would not stop."]], "n": "涙を流す = shed tears. 泣く is the verb; 涙 is the noun."}, {"w": "汗", "wf": "<ruby>汗<rt>あせ</rt></ruby>", "r": "あせ", "m": "sweat", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>夏<rt>なつ</rt></ruby>は <ruby>少<rt>すこ</rt></ruby>し <ruby>歩<rt>ある</rt></ruby>くだけで <ruby>汗<rt>あせ</rt></ruby>が <ruby>出<rt>で</rt></ruby>る。", "In summer, sweat comes out just from walking a little."], ["<ruby>運動<rt>うんどう</rt></ruby>して <ruby>汗<rt>あせ</rt></ruby>をかいた。", "I exercised and worked up a sweat."], ["<ruby>冷<rt>つめ</rt></ruby>たい <ruby>汗<rt>あせ</rt></ruby>が <ruby>出<rt>で</rt></ruby>るほど <ruby>緊張<rt>きんちょう</rt></ruby>した。", "I was so nervous I broke into a cold sweat."]], "n": "Set phrase: 汗をかく (not 汗を出す). 汗をかくほど働く = work up a sweat."}, {"w": "息", "wf": "<ruby>息<rt>いき</rt></ruby>", "r": "いき", "m": "breath", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>階段<rt>かいだん</rt></ruby>を <ruby>上<rt>のぼ</rt></ruby>ったら、 <ruby>息<rt>いき</rt></ruby>が <ruby>切<rt>き</rt></ruby>れた。", "After climbing the stairs, I was out of breath."], ["<ruby>深<rt>ふか</rt></ruby>く <ruby>息<rt>いき</rt></ruby>を <ruby>吸<rt>す</rt></ruby>って、ゆっくり <ruby>吐<rt>は</rt></ruby>いてください。", "Breathe in deeply and exhale slowly."], ["<ruby>寒<rt>さむ</rt></ruby>くて <ruby>息<rt>いき</rt></ruby>が <ruby>白<rt>しろ</rt></ruby>く <ruby>見<rt>み</rt></ruby>える。", "It is so cold you can see your breath."]], "n": "息が切れる = out of breath. ため息 = a sigh."}, {"w": "姿", "wf": "<ruby>姿<rt>すがた</rt></ruby>", "r": "すがた", "m": "figure; appearance; form", "p": "noun", "t": "noun", "d": 11, "ex": [["<ruby>働<rt>はたら</rt></ruby>く <ruby>母<rt>はは</rt></ruby>の <ruby>姿<rt>すがた</rt></ruby>を <ruby>見<rt>み</rt></ruby>て <ruby>育<rt>そだ</rt></ruby>った。", "I grew up watching my mother at work."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>急<rt>きゅう</rt></ruby>に <ruby>姿<rt>すがた</rt></ruby>を <ruby>消<rt>け</rt></ruby>した。", "He suddenly disappeared."], ["<ruby>着物<rt>きもの</rt></ruby> <ruby>姿<rt>すがた</rt></ruby>の <ruby>女性<rt>じょせい</rt></ruby>が <ruby>歩<rt>ある</rt></ruby>いている。", "A woman in kimono is walking by."]], "n": "姿を消す = vanish. 〜姿 = dressed in (着物姿, スーツ姿)."}, {"w": "格好", "wf": "<ruby>格好<rt>かっこう</rt></ruby>", "r": "かっこう", "m": "appearance; outfit; shape", "p": "noun", "t": "noun", "d": 11, "ex": [["そんな <ruby>格好<rt>かっこう</rt></ruby>で <ruby>外<rt>そと</rt></ruby>に <ruby>出<rt>で</rt></ruby>るの？", "Are you going out dressed like that?"], ["<ruby>動<rt>うご</rt></ruby>きやすい <ruby>格好<rt>かっこう</rt></ruby>で <ruby>来<rt>き</rt></ruby>てください。", "Please come in clothes easy to move in."], ["<ruby>人前<rt>ひとまえ</rt></ruby>で <ruby>転<rt>ころ</rt></ruby>んで、 <ruby>格好<rt>かっこう</rt></ruby> <ruby>悪<rt>わる</rt></ruby>かった。", "I fell in front of people — so uncool."]], "n": "かっこいい／かっこ悪い come from this word. Casual clothing instructions use it."}, {"w": "繰り返す", "wf": "<ruby>繰<rt>く</rt></ruby>り <ruby>返<rt>かえ</rt></ruby>す", "r": "くりかえす", "m": "to repeat", "p": "v5 transitive", "t": "verb", "d": 11, "ex": [["<ruby>同<rt>おな</rt></ruby>じ <ruby>間違<rt>まちが</rt></ruby>いを <ruby>繰<rt>く</rt></ruby>り <ruby>返<rt>かえ</rt></ruby>さないようにしよう。", "Let us try not to repeat the same mistakes."], ["<ruby>単語<rt>たんご</rt></ruby>は <ruby>繰<rt>く</rt></ruby>り <ruby>返<rt>かえ</rt></ruby>して <ruby>覚<rt>おぼ</rt></ruby>えるしかない。", "With vocabulary, you just have to repeat until you remember."], ["<ruby>歴史<rt>れきし</rt></ruby>は <ruby>繰<rt>く</rt></ruby>り <ruby>返<rt>かえ</rt></ruby>すと <ruby>言<rt>い</rt></ruby>われる。", "It is said that history repeats itself."]], "n": "Your Anki life in one word. 繰り返し = repetition."}, {"w": "見直す", "wf": "<ruby>見直<rt>みなお</rt></ruby>す", "r": "みなおす", "m": "to review; to re-examine; to think better of", "p": "v5 transitive", "t": "verb", "d": 11, "ex": [["テストの <ruby>前<rt>まえ</rt></ruby>に、 <ruby>答<rt>こた</rt></ruby>えを <ruby>見直<rt>みなお</rt></ruby>しましょう。", "Before handing in the test, review your answers."], ["<ruby>生活<rt>せいかつ</rt></ruby> <ruby>習慣<rt>しゅうかん</rt></ruby>を <ruby>見直<rt>みなお</rt></ruby>すことにした。", "I decided to re-examine my lifestyle habits."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>行動<rt>こうどう</rt></ruby>を <ruby>見<rt>み</rt></ruby>て、 <ruby>彼<rt>かれ</rt></ruby>を <ruby>見直<rt>みなお</rt></ruby>した。", "Seeing how he acted, I gained new respect for him."]], "n": "Three uses: recheck answers, rethink plans, raise your opinion of someone."}, {"w": "やり直す", "wf": "やり <ruby>直<rt>なお</rt></ruby>す", "r": "やりなおす", "m": "to redo; to start over", "p": "v5 transitive", "t": "verb", "d": 11, "ex": [["<ruby>計算<rt>けいさん</rt></ruby>を <ruby>間違<rt>まちが</rt></ruby>えたので、 <ruby>最初<rt>さいしょ</rt></ruby>からやり <ruby>直<rt>なお</rt></ruby>した。", "I made a calculation error, so I redid it from the start."], ["<ruby>人生<rt>じんせい</rt></ruby>は <ruby>何度<rt>なんど</rt></ruby>でもやり <ruby>直<rt>なお</rt></ruby>せる。", "In life you can always start over."], ["この <ruby>書類<rt>しょるい</rt></ruby>、やり <ruby>直<rt>なお</rt></ruby>してもらえますか。", "Could you redo this document?"]], "n": "V-stem＋直す = do over (書き直す, 作り直す) — productive N3 pattern."}, {"w": "見かける", "wf": "<ruby>見<rt>み</rt></ruby>かける", "r": "みかける", "m": "to happen to see; to catch sight of", "p": "v1 transitive", "t": "verb", "d": 11, "ex": [["<ruby>駅<rt>えき</rt></ruby>で <ruby>彼<rt>かれ</rt></ruby>をよく <ruby>見<rt>み</rt></ruby>かける。", "I often see him at the station."], ["<ruby>最近<rt>さいきん</rt></ruby>、この <ruby>鳥<rt>とり</rt></ruby>を <ruby>見<rt>み</rt></ruby>かけなくなった。", "Lately I have stopped seeing this bird around."], ["<ruby>困<rt>こま</rt></ruby>っている <ruby>人<rt>ひと</rt></ruby>を <ruby>見<rt>み</rt></ruby>かけたら、 <ruby>声<rt>こえ</rt></ruby>をかけよう。", "If you see someone in trouble, speak to them."]], "n": "Passing sight, no intention. 見る = look; 見える = visible; 見かける = happen to see."}, {"w": "異なる", "wf": "<ruby>異<rt>こと</rt></ruby>なる", "r": "ことなる", "m": "to differ (written)", "p": "v5 intransitive", "t": "verb", "d": 11, "ex": [["<ruby>国<rt>くに</rt></ruby>によって <ruby>文化<rt>ぶんか</rt></ruby>は <ruby>異<rt>こと</rt></ruby>なる。", "Cultures differ from country to country."], ["<ruby>二人<rt>ふたり</rt></ruby>の <ruby>意見<rt>いけん</rt></ruby>は <ruby>大<rt>おお</rt></ruby>きく <ruby>異<rt>こと</rt></ruby>なっている。", "The two opinions differ greatly."], ["この <ruby>商品<rt>しょうひん</rt></ruby>は <ruby>写真<rt>しゃしん</rt></ruby>と <ruby>色<rt>いろ</rt></ruby>が <ruby>異<rt>こと</rt></ruby>なる <ruby>場合<rt>ばあい</rt></ruby>があります。", "The color of this product may differ from the photo."]], "n": "Written version of 違う — reading passages use 異なる constantly."}, {"w": "限る", "wf": "<ruby>限<rt>かぎ</rt></ruby>る", "r": "かぎる", "m": "to limit; to be limited to", "p": "v5 transitive/intransitive", "t": "verb", "d": 11, "ex": [["<ruby>参加<rt>さんか</rt></ruby>は <ruby>学生<rt>がくせい</rt></ruby>に <ruby>限<rt>かぎ</rt></ruby>ります。", "Participation is limited to students."], ["<ruby>夏<rt>なつ</rt></ruby>は <ruby>冷<rt>つめ</rt></ruby>たいビールに <ruby>限<rt>かぎ</rt></ruby>る。", "In summer, nothing beats a cold beer."], ["<ruby>安<rt>やす</rt></ruby>いからといって、いい <ruby>物<rt>もの</rt></ruby>だとは <ruby>限<rt>かぎ</rt></ruby>らない。", "Just because it is cheap does not mean it is good."]], "n": "Three exam faces: Aに限る (limited to / nothing beats), 〜とは限らない (not necessarily)."}, {"w": "様々", "wf": "<ruby>様々<rt>さまざま</rt></ruby>", "r": "さまざま", "m": "various", "p": "na-adjective", "t": "adj", "d": 11, "ex": [["<ruby>様々<rt>さまざま</rt></ruby>な <ruby>国<rt>くに</rt></ruby>の <ruby>人<rt>ひと</rt></ruby>と <ruby>働<rt>はたら</rt></ruby>いている。", "I work with people from various countries."], ["<ruby>失敗<rt>しっぱい</rt></ruby>の <ruby>原因<rt>げんいん</rt></ruby>は <ruby>様々<rt>さまざま</rt></ruby>だ。", "The causes of failure are various."], ["<ruby>様々<rt>さまざま</rt></ruby>な <ruby>意見<rt>いけん</rt></ruby>が <ruby>出<rt>で</rt></ruby>た。", "Various opinions came up."]], "n": "Written/formal いろいろ. Reading passages prefer 様々."}, {"w": "既に", "wf": "<ruby>既<rt>すで</rt></ruby>に", "r": "すでに", "m": "already (written)", "p": "adverb", "t": "adv", "d": 11, "ex": [["<ruby>会場<rt>かいじょう</rt></ruby>に <ruby>着<rt>つ</rt></ruby>いたとき、コンサートは <ruby>既<rt>すで</rt></ruby>に <ruby>始<rt>はじ</rt></ruby>まっていた。", "When I arrived at the venue, the concert had already started."], ["その <ruby>問題<rt>もんだい</rt></ruby>は <ruby>既<rt>すで</rt></ruby>に <ruby>解決<rt>かいけつ</rt></ruby>した。", "That problem has already been solved."], ["チケットは <ruby>既<rt>すで</rt></ruby>に <ruby>売<rt>う</rt></ruby>り <ruby>切<rt>き</rt></ruby>れです。", "The tickets are already sold out."]], "n": "Written もう. News and notices use 既に."}, {"w": "約", "wf": "<ruby>約<rt>やく</rt></ruby>", "r": "やく", "m": "approximately", "p": "prefix / adverb", "t": "adv", "d": 11, "ex": [["<ruby>家<rt>いえ</rt></ruby>から <ruby>駅<rt>えき</rt></ruby>まで <ruby>約<rt>やく</rt></ruby> <ruby>十五分<rt>じゅうごふん</rt></ruby>かかる。", "It takes about fifteen minutes from home to the station."], ["この <ruby>町<rt>まち</rt></ruby>の <ruby>人口<rt>じんこう</rt></ruby>は <ruby>約<rt>やく</rt></ruby> <ruby>三万人<rt>さんまんにん</rt></ruby>だ。", "The population of this town is about thirty thousand."], ["<ruby>会議<rt>かいぎ</rt></ruby>は <ruby>約<rt>やく</rt></ruby> <ruby>二時間<rt>にじかん</rt></ruby> <ruby>続<rt>つづ</rt></ruby>いた。", "The meeting lasted about two hours."]], "n": "約 before the number (written); ぐらい after (spoken). Listening questions love swapping them."}, {"w": "尋ねる", "wf": "<ruby>尋<rt>たず</rt></ruby>ねる", "r": "たずねる", "m": "to ask; to inquire", "p": "v1 transitive", "t": "verb", "d": 12, "ex": [["<ruby>駅<rt>えき</rt></ruby>までの <ruby>道<rt>みち</rt></ruby>を <ruby>尋<rt>たず</rt></ruby>ねた。", "I asked the way to the station."], ["<ruby>分<rt>わ</rt></ruby>からないことは <ruby>先生<rt>せんせい</rt></ruby>に <ruby>尋<rt>たず</rt></ruby>ねてください。", "Please ask the teacher about anything you do not understand."], ["<ruby>係<rt>かかり</rt></ruby>の <ruby>人<rt>ひと</rt></ruby>に <ruby>尋<rt>たず</rt></ruby>ねたら、すぐ <ruby>分<rt>わ</rt></ruby>かった。", "When I asked the staff, I understood right away."]], "n": "Formal 聞く. Homophone 訪ねる = to visit — exam trap pair."}, {"w": "誘う", "wf": "<ruby>誘<rt>さそ</rt></ruby>う", "r": "さそう", "m": "to invite; to ask along", "p": "v5 transitive", "t": "verb", "d": 12, "ex": [["<ruby>友達<rt>ともだち</rt></ruby>を <ruby>映画<rt>えいが</rt></ruby>に <ruby>誘<rt>さそ</rt></ruby>った。", "I invited a friend to a movie."], ["<ruby>飲<rt>の</rt></ruby>み <ruby>会<rt>かい</rt></ruby>に <ruby>誘<rt>さそ</rt></ruby>われたが、 <ruby>断<rt>ことわ</rt></ruby>った。", "I was invited to a drinking party but declined."], ["<ruby>彼<rt>かれ</rt></ruby>を <ruby>誘<rt>さそ</rt></ruby>ってみたら？", "Why not ask him along?"]], "n": "誘われる (passive) is how you will usually meet it. 招待する = formal invitation."}, {"w": "招く", "wf": "<ruby>招<rt>まね</rt></ruby>く", "r": "まねく", "m": "to invite (formally); to cause (bad result)", "p": "v5 transitive", "t": "verb", "d": 12, "ex": [["パーティーに <ruby>多<rt>おお</rt></ruby>くの <ruby>客<rt>きゃく</rt></ruby>を <ruby>招<rt>まね</rt></ruby>いた。", "We invited many guests to the party."], ["その <ruby>発言<rt>はつげん</rt></ruby>が <ruby>誤解<rt>ごかい</rt></ruby>を <ruby>招<rt>まね</rt></ruby>いた。", "That remark caused a misunderstanding."], ["<ruby>小<rt>ちい</rt></ruby>さなミスが <ruby>大<rt>おお</rt></ruby>きな <ruby>事故<rt>じこ</rt></ruby>を <ruby>招<rt>まね</rt></ruby>くこともある。", "A small mistake can sometimes lead to a big accident."]], "n": "Two faces: invite people, and invite trouble (誤解を招く). The second is the exam one."}, {"w": "迎える", "wf": "<ruby>迎<rt>むか</rt></ruby>える", "r": "むかえる", "m": "to welcome; to go meet; to reach (a time)", "p": "v1 transitive", "t": "verb", "d": 12, "ex": [["<ruby>空港<rt>くうこう</rt></ruby>まで <ruby>友人<rt>ゆうじん</rt></ruby>を <ruby>迎<rt>むか</rt></ruby>えに <ruby>行<rt>い</rt></ruby>った。", "I went to the airport to pick up my friend."], ["<ruby>新<rt>あたら</rt></ruby>しい <ruby>年<rt>とし</rt></ruby>を <ruby>家族<rt>かぞく</rt></ruby>で <ruby>迎<rt>むか</rt></ruby>えた。", "We welcomed the new year as a family."], ["この <ruby>大学<rt>だいがく</rt></ruby>は <ruby>来年<rt>らいねん</rt></ruby>、 <ruby>創立<rt>そうりつ</rt></ruby> <ruby>百年<rt>ひゃくねん</rt></ruby>を <ruby>迎<rt>むか</rt></ruby>える。", "This university will mark its 100th year next year."]], "n": "迎えに行く = go pick someone up (daily life). Abstract: 朝を迎える, 百年を迎える."}, {"w": "贈る", "wf": "<ruby>贈<rt>おく</rt></ruby>る", "r": "おくる", "m": "to give (a gift); to present", "p": "v5 transitive", "t": "verb", "d": 12, "ex": [["<ruby>母<rt>はは</rt></ruby>の <ruby>日<rt>ひ</rt></ruby>に <ruby>花<rt>はな</rt></ruby>を <ruby>贈<rt>おく</rt></ruby>った。", "I gave flowers on Mother's Day."], ["<ruby>卒業生<rt>そつぎょうせい</rt></ruby>に <ruby>記念品<rt>きねんひん</rt></ruby>が <ruby>贈<rt>おく</rt></ruby>られた。", "Commemorative gifts were presented to the graduates."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>新<rt>あたら</rt></ruby>しい <ruby>出発<rt>しゅっぱつ</rt></ruby>に、この <ruby>言葉<rt>ことば</rt></ruby>を <ruby>贈<rt>おく</rt></ruby>りたい。", "I want to offer these words for his new start."]], "n": "Homophone trap: 送る = send; 贈る = give as a gift. Kanji section tests this."}, {"w": "褒める", "wf": "<ruby>褒<rt>ほ</rt></ruby>める", "r": "ほめる", "m": "to praise", "p": "v1 transitive", "t": "verb", "d": 12, "ex": [["<ruby>先生<rt>せんせい</rt></ruby>に <ruby>発音<rt>はつおん</rt></ruby>を <ruby>褒<rt>ほ</rt></ruby>められた。", "The teacher praised my pronunciation."], ["<ruby>子<rt>こ</rt></ruby>どもは <ruby>褒<rt>ほ</rt></ruby>めて <ruby>育<rt>そだ</rt></ruby>てた <ruby>方<rt>ほう</rt></ruby>がいいと <ruby>言<rt>い</rt></ruby>われる。", "They say it is better to raise children with praise."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>頑張<rt>がんば</rt></ruby>りはみんなに <ruby>褒<rt>ほ</rt></ruby>められるべきだ。", "His effort deserves everyone's praise."]], "n": "Passive 褒められる is the common real-life form. Opposite: 叱る."}, {"w": "叱る", "wf": "<ruby>叱<rt>しか</rt></ruby>る", "r": "しかる", "m": "to scold", "p": "v5 transitive", "t": "verb", "d": 12, "ex": [["<ruby>遅刻<rt>ちこく</rt></ruby>して、 <ruby>上司<rt>じょうし</rt></ruby>に <ruby>叱<rt>しか</rt></ruby>られた。", "I was late and got scolded by my boss."], ["<ruby>子<rt>こ</rt></ruby>どもを <ruby>感情的<rt>かんじょうてき</rt></ruby>に <ruby>叱<rt>しか</rt></ruby>らない <ruby>方<rt>ほう</rt></ruby>がいい。", "It is better not to scold children emotionally."], ["<ruby>叱<rt>しか</rt></ruby>るより <ruby>褒<rt>ほ</rt></ruby>める <ruby>方<rt>ほう</rt></ruby>が <ruby>効果的<rt>こうかてき</rt></ruby>だ。", "Praising is more effective than scolding."]], "n": "叱る = scold to correct; 怒る = get angry. Exam distinguishes them."}, {"w": "祝う", "wf": "<ruby>祝<rt>いわ</rt></ruby>う", "r": "いわう", "m": "to celebrate", "p": "v5 transitive", "t": "verb", "d": 12, "ex": [["<ruby>友人<rt>ゆうじん</rt></ruby>の <ruby>合格<rt>ごうかく</rt></ruby>をみんなで <ruby>祝<rt>いわ</rt></ruby>った。", "We all celebrated our friend's passing the exam."], ["<ruby>誕生日<rt>たんじょうび</rt></ruby>を <ruby>家族<rt>かぞく</rt></ruby>と <ruby>祝<rt>いわ</rt></ruby>う。", "I celebrate my birthday with family."], ["<ruby>新年<rt>しんねん</rt></ruby>を <ruby>祝<rt>いわ</rt></ruby>う <ruby>行事<rt>ぎょうじ</rt></ruby>が <ruby>各地<rt>かくち</rt></ruby>で <ruby>行<rt>おこな</rt></ruby>われた。", "Events celebrating the new year were held everywhere."]], "n": "お祝い = celebration/congratulatory gift. 祝日 = national holiday."}, {"w": "祈る", "wf": "<ruby>祈<rt>いの</rt></ruby>る", "r": "いのる", "m": "to pray; to wish", "p": "v5 transitive", "t": "verb", "d": 12, "ex": [["<ruby>家族<rt>かぞく</rt></ruby>の <ruby>健康<rt>けんこう</rt></ruby>を <ruby>祈<rt>いの</rt></ruby>っている。", "I pray for my family's health."], ["<ruby>試験<rt>しけん</rt></ruby>の <ruby>成功<rt>せいこう</rt></ruby>を <ruby>祈<rt>いの</rt></ruby>ります。", "I wish you success on the exam."], ["<ruby>神社<rt>じんじゃ</rt></ruby>で <ruby>世界<rt>せかい</rt></ruby>の <ruby>平和<rt>へいわ</rt></ruby>を <ruby>祈<rt>いの</rt></ruby>った。", "At the shrine, I prayed for world peace."]], "n": "Letter-closing phrase: ご成功をお祈りします. Religious and secular wishing both."}, {"w": "黙る", "wf": "<ruby>黙<rt>だま</rt></ruby>る", "r": "だまる", "m": "to be silent; to stop talking", "p": "v5 intransitive", "t": "verb", "d": 12, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>何<rt>なに</rt></ruby>も <ruby>言<rt>い</rt></ruby>わずに <ruby>黙<rt>だま</rt></ruby>っていた。", "He stayed silent without saying anything."], ["<ruby>急<rt>きゅう</rt></ruby>に <ruby>質問<rt>しつもん</rt></ruby>されて、 <ruby>黙<rt>だま</rt></ruby>ってしまった。", "Asked suddenly, I fell silent."], ["<ruby>黙<rt>だま</rt></ruby>っていないで、 <ruby>意見<rt>いけん</rt></ruby>を <ruby>言<rt>い</rt></ruby>ってください。", "Do not just stay quiet — say your opinion."]], "n": "黙って＋V = do without telling anyone (黙って帰る). 静かにする = be quiet (noise)."}, {"w": "叫ぶ", "wf": "<ruby>叫<rt>さけ</rt></ruby>ぶ", "r": "さけぶ", "m": "to shout; to scream", "p": "v5 intransitive", "t": "verb", "d": 12, "ex": [["<ruby>助<rt>たす</rt></ruby>けてと <ruby>叫<rt>さけ</rt></ruby>ぶ <ruby>声<rt>こえ</rt></ruby>が <ruby>聞<rt>き</rt></ruby>こえた。", "I heard a voice screaming for help."], ["<ruby>驚<rt>おどろ</rt></ruby>いて、 <ruby>思<rt>おも</rt></ruby>わず <ruby>叫<rt>さけ</rt></ruby>んでしまった。", "Startled, I cried out without thinking."], ["ファンたちは <ruby>選手<rt>せんしゅ</rt></ruby>の <ruby>名前<rt>なまえ</rt></ruby>を <ruby>叫<rt>さけ</rt></ruby>んだ。", "The fans shouted the player's name."]], "n": "〜と叫ぶ quotes the shout. 怒鳴る (どなる) = yell angrily (N2)."}, {"w": "冗談", "wf": "<ruby>冗談<rt>じょうだん</rt></ruby>", "r": "じょうだん", "m": "joke", "p": "noun", "t": "noun", "d": 12, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>冗談<rt>じょうだん</rt></ruby>ばかり <ruby>言<rt>い</rt></ruby>っている。", "He is always telling jokes."], ["<ruby>冗談<rt>じょうだん</rt></ruby>のつもりだったのに、 <ruby>彼女<rt>かのじょ</rt></ruby>を <ruby>怒<rt>おこ</rt></ruby>らせてしまった。", "I meant it as a joke, but I made her angry."], ["<ruby>冗談<rt>じょうだん</rt></ruby>じゃない！", "You have got to be kidding!"]], "n": "冗談じゃない = spoken outrage, not literally about jokes. 冗談半分 = half-joking."}, {"w": "文句", "wf": "<ruby>文句<rt>もんく</rt></ruby>", "r": "もんく", "m": "complaint", "p": "noun", "t": "noun", "d": 12, "ex": [["<ruby>彼<rt>かれ</rt></ruby>はいつも <ruby>料理<rt>りょうり</rt></ruby>に <ruby>文句<rt>もんく</rt></ruby>を <ruby>言<rt>い</rt></ruby>う。", "He always complains about the food."], ["<ruby>文句<rt>もんく</rt></ruby>があるなら、 <ruby>直接<rt>ちょくせつ</rt></ruby> <ruby>言<rt>い</rt></ruby>ってください。", "If you have a complaint, say it directly."], ["<ruby>結果<rt>けっか</rt></ruby>には <ruby>文句<rt>もんく</rt></ruby>のつけようがない。", "There is nothing to criticize about the result."]], "n": "文句を言う = complain (casual). 苦情 = formal complaint (to a company)."}, {"w": "秘密", "wf": "<ruby>秘密<rt>ひみつ</rt></ruby>", "r": "ひみつ", "m": "secret", "p": "noun / na-adjective", "t": "noun", "d": 12, "ex": [["これは <ruby>二人<rt>ふたり</rt></ruby>だけの <ruby>秘密<rt>ひみつ</rt></ruby>だよ。", "This is a secret just between us two."], ["<ruby>秘密<rt>ひみつ</rt></ruby>を <ruby>守<rt>まも</rt></ruby>れる <ruby>人<rt>ひと</rt></ruby>は <ruby>信頼<rt>しんらい</rt></ruby>される。", "People who can keep secrets are trusted."], ["<ruby>計画<rt>けいかく</rt></ruby>は <ruby>秘密<rt>ひみつ</rt></ruby>のうちに <ruby>進<rt>すす</rt></ruby>められた。", "The plan was carried out in secret."]], "n": "秘密にする = keep it secret. 内緒 (ないしょ) = casual spoken version."}, {"w": "お互い", "wf": "お <ruby>互<rt>たが</rt></ruby>い", "r": "おたがい", "m": "each other", "p": "noun", "t": "noun", "d": 12, "ex": [["お <ruby>互<rt>たが</rt></ruby>いに <ruby>助<rt>たす</rt></ruby>け <ruby>合<rt>あ</rt></ruby>うことが <ruby>大切<rt>たいせつ</rt></ruby>だ。", "It is important to help each other."], ["お <ruby>互<rt>たが</rt></ruby>いの <ruby>文化<rt>ぶんか</rt></ruby>を <ruby>理解<rt>りかい</rt></ruby>しよう。", "Let us understand each other's cultures."], ["<ruby>忙<rt>いそが</rt></ruby>しいのはお <ruby>互<rt>たが</rt></ruby>い <ruby>様<rt>さま</rt></ruby>です。", "We are both busy — no need to apologize."]], "n": "お互い様 = we are in the same position (softens apologies). V-合う pairs with it: 助け合う."}, {"w": "仲", "wf": "<ruby>仲<rt>なか</rt></ruby>", "r": "なか", "m": "relationship; terms (between people)", "p": "noun", "t": "noun", "d": 12, "ex": [["あの <ruby>二人<rt>ふたり</rt></ruby>は <ruby>仲<rt>なか</rt></ruby>がいい。", "Those two get along well."], ["<ruby>兄<rt>あに</rt></ruby>とけんかして、 <ruby>仲<rt>なか</rt></ruby>が <ruby>悪<rt>わる</rt></ruby>くなった。", "I fought with my brother and we are on bad terms now."], ["クラスの <ruby>仲間<rt>なかま</rt></ruby>と <ruby>旅行<rt>りょこう</rt></ruby>に <ruby>行<rt>い</rt></ruby>った。", "I went on a trip with my classmates."]], "n": "仲がいい = close (spoken 親しい). 仲間 = companions/group. Homograph: 中 (なか) = inside."}, {"w": "同僚", "wf": "<ruby>同僚<rt>どうりょう</rt></ruby>", "r": "どうりょう", "m": "colleague; coworker", "p": "noun", "t": "noun", "d": 12, "ex": [["<ruby>同僚<rt>どうりょう</rt></ruby>と <ruby>昼<rt>ひる</rt></ruby>ご <ruby>飯<rt>はん</rt></ruby>を <ruby>食<rt>た</rt></ruby>べに <ruby>行<rt>い</rt></ruby>った。", "I went to eat lunch with a colleague."], ["<ruby>困<rt>こま</rt></ruby>ったときは <ruby>同僚<rt>どうりょう</rt></ruby>に <ruby>相談<rt>そうだん</rt></ruby>する。", "When in trouble, I consult my coworkers."], ["<ruby>前<rt>まえ</rt></ruby>の <ruby>会社<rt>かいしゃ</rt></ruby>の <ruby>同僚<rt>どうりょう</rt></ruby>と <ruby>今<rt>いま</rt></ruby>も <ruby>連絡<rt>れんらく</rt></ruby>を <ruby>取<rt>と</rt></ruby>っている。", "I still keep in touch with colleagues from my previous company."]], "n": "Set: 上司 (boss) / 部下 (subordinate) / 同僚 (same level)."}, {"w": "命令", "wf": "<ruby>命令<rt>めいれい</rt></ruby>", "r": "めいれい", "m": "order; command", "p": "noun / suru-verb", "t": "noun", "d": 12, "ex": [["<ruby>上<rt>うえ</rt></ruby>からの <ruby>命令<rt>めいれい</rt></ruby>には <ruby>従<rt>したが</rt></ruby>うしかない。", "Orders from above must be followed."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>部下<rt>ぶか</rt></ruby>に <ruby>命令<rt>めいれい</rt></ruby>ばかりしている。", "He does nothing but order his subordinates around."], ["<ruby>命令<rt>めいれい</rt></ruby>するような <ruby>言<rt>い</rt></ruby>い <ruby>方<rt>かた</rt></ruby>はやめてほしい。", "I wish you would stop talking like you are giving orders."]], "n": "命令形 = imperative form in grammar. 指示 = instruction (softer)."}, {"w": "正直", "wf": "<ruby>正直<rt>しょうじき</rt></ruby>", "r": "しょうじき", "m": "honest; honestly", "p": "na-adjective / adverb", "t": "adj", "d": 12, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>正直<rt>しょうじき</rt></ruby>な <ruby>人<rt>ひと</rt></ruby>だ。", "He is an honest person."], ["<ruby>正直<rt>しょうじき</rt></ruby>に <ruby>言<rt>い</rt></ruby>うと、あまり <ruby>行<rt>い</rt></ruby>きたくない。", "Honestly speaking, I do not really want to go."], ["<ruby>正直<rt>しょうじき</rt></ruby>、 <ruby>疲<rt>つか</rt></ruby>れました。", "Honestly, I am tired."]], "n": "Sentence-head 正直、〜 = frank spoken opener. 素直 = open-minded; 正直 = truthful."}, {"w": "真剣", "wf": "<ruby>真剣<rt>しんけん</rt></ruby>", "r": "しんけん", "m": "serious; earnest", "p": "na-adjective", "t": "adj", "d": 12, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>真剣<rt>しんけん</rt></ruby>な <ruby>顔<rt>かお</rt></ruby>で <ruby>話<rt>はな</rt></ruby>し <ruby>始<rt>はじ</rt></ruby>めた。", "He began speaking with a serious face."], ["<ruby>将来<rt>しょうらい</rt></ruby>のことを <ruby>真剣<rt>しんけん</rt></ruby>に <ruby>考<rt>かんが</rt></ruby>えている。", "I am thinking seriously about the future."], ["<ruby>真剣<rt>しんけん</rt></ruby>に <ruby>練習<rt>れんしゅう</rt></ruby>すれば、 <ruby>必<rt>かなら</rt></ruby>ず <ruby>上手<rt>じょうず</rt></ruby>になる。", "If you practice earnestly, you will definitely improve."]], "n": "真剣 = earnest attitude; 深刻 (しんこく) = grave situation. Exam contrasts them."}, {"w": "勝手", "wf": "<ruby>勝手<rt>かって</rt></ruby>", "r": "かって", "m": "selfish; as one pleases", "p": "na-adjective", "t": "adj", "d": 12, "ex": [["<ruby>人<rt>ひと</rt></ruby>の <ruby>物<rt>もの</rt></ruby>を <ruby>勝手<rt>かって</rt></ruby>に <ruby>使<rt>つか</rt></ruby>わないでください。", "Do not use other people's things without asking."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>勝手<rt>かって</rt></ruby>な <ruby>人<rt>ひと</rt></ruby>で、 <ruby>約束<rt>やくそく</rt></ruby>をすぐ <ruby>変<rt>か</rt></ruby>える。", "He is selfish and changes plans as he pleases."], ["<ruby>勝手<rt>かって</rt></ruby>に <ruby>決<rt>き</rt></ruby>めてごめん。", "Sorry for deciding on my own."]], "n": "勝手に = without permission — apartment/office sign language. 自分勝手 = self-centered."}, {"w": "乱暴", "wf": "<ruby>乱暴<rt>らんぼう</rt></ruby>", "r": "らんぼう", "m": "rough; violent", "p": "na-adjective / noun", "t": "adj", "d": 12, "ex": [["<ruby>物<rt>もの</rt></ruby>を <ruby>乱暴<rt>らんぼう</rt></ruby>に <ruby>扱<rt>あつか</rt></ruby>わないで。", "Do not handle things roughly."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>言葉<rt>ことば</rt></ruby> <ruby>遣<rt>づか</rt></ruby>いは <ruby>乱暴<rt>らんぼう</rt></ruby>だ。", "His way of speaking is rough."], ["<ruby>乱暴<rt>らんぼう</rt></ruby>な <ruby>運転<rt>うんてん</rt></ruby>は <ruby>事故<rt>じこ</rt></ruby>のもとだ。", "Reckless driving leads to accidents."]], "n": "Rough handling, speech, driving. 暴力 = violence (noun)."}, {"w": "わざと", "wf": "わざと", "r": "わざと", "m": "on purpose; deliberately", "p": "adverb", "t": "adv", "d": 12, "ex": [["<ruby>彼<rt>かれ</rt></ruby>はわざと <ruby>負<rt>ま</rt></ruby>けたんじゃないかと <ruby>思<rt>おも</rt></ruby>う。", "I suspect he lost on purpose."], ["わざとやったんじゃない。ごめん。", "I did not do it on purpose. Sorry."], ["<ruby>弟<rt>おとうと</rt></ruby>はわざと <ruby>聞<rt>き</rt></ruby>こえないふりをした。", "My little brother deliberately pretended not to hear."]], "n": "わざと = deliberately (often bad intent); わざわざ = taking the trouble (batch 2) — classic exam pair."}, {"w": "さすが", "wf": "さすが", "r": "さすが", "m": "as expected (impressive)", "p": "adverb", "t": "adv", "d": 12, "ex": [["さすがプロですね。 <ruby>仕事<rt>しごと</rt></ruby>が <ruby>速<rt>はや</rt></ruby>い。", "That is a pro for you — such fast work."], ["さすがの <ruby>彼<rt>かれ</rt></ruby>も <ruby>今回<rt>こんかい</rt></ruby>は <ruby>疲<rt>つか</rt></ruby>れたようだ。", "Even he, of all people, seems tired this time."], ["さすがに <ruby>三日<rt>みっか</rt></ruby> <ruby>連続<rt>れんぞく</rt></ruby>の <ruby>残業<rt>ざんぎょう</rt></ruby>はきつい。", "Three days of overtime in a row is rough, as you would expect."]], "n": "Praise word: as expected of you. さすがに = even so / understandably."}, {"w": "まさか", "wf": "まさか", "r": "まさか", "m": "no way; surely not", "p": "adverb", "t": "adv", "d": 12, "ex": [["まさか <ruby>彼<rt>かれ</rt></ruby>が <ruby>犯人<rt>はんにん</rt></ruby>だとは <ruby>思<rt>おも</rt></ruby>わなかった。", "I never imagined he was the culprit."], ["まさか <ruby>雨<rt>あめ</rt></ruby>が <ruby>降<rt>ふ</rt></ruby>るとは <ruby>思<rt>おも</rt></ruby>わず、 <ruby>傘<rt>かさ</rt></ruby>を <ruby>持<rt>も</rt></ruby>ってこなかった。", "Never thinking it would rain, I did not bring an umbrella."], ["まさか、そんなことがあるはずない。", "No way — that cannot be."]], "n": "Disbelief marker. Pattern まさか〜とは = I never dreamed that..."}, {"w": "外す", "wf": "<ruby>外<rt>はず</rt></ruby>す", "r": "はずす", "m": "to remove; to take off; to miss", "p": "v5 transitive", "t": "verb", "d": 13, "ex": [["<ruby>眼鏡<rt>めがね</rt></ruby>を <ruby>外<rt>はず</rt></ruby>して <ruby>目<rt>め</rt></ruby>を <ruby>休<rt>やす</rt></ruby>めた。", "I took off my glasses and rested my eyes."], ["ボタンを <ruby>外<rt>はず</rt></ruby>してください。", "Please undo the button."], ["<ruby>田中<rt>たなか</rt></ruby>は <ruby>今<rt>いま</rt></ruby>、 <ruby>席<rt>せき</rt></ruby>を <ruby>外<rt>はず</rt></ruby>しております。", "Tanaka is away from his desk right now."]], "n": "席を外す = step away (phone Japanese — you will hear it weekly). Opposite: 付ける."}, {"w": "外れる", "wf": "<ruby>外<rt>はず</rt></ruby>れる", "r": "はずれる", "m": "to come off; to miss; to be wrong (guess)", "p": "v1 intransitive", "t": "verb", "d": 13, "ex": [["シャツのボタンが <ruby>外<rt>はず</rt></ruby>れていますよ。", "Your shirt button has come undone."], ["<ruby>天気<rt>てんき</rt></ruby> <ruby>予報<rt>よほう</rt></ruby>が <ruby>外<rt>はず</rt></ruby>れて、 <ruby>晴<rt>は</rt></ruby>れた。", "The weather forecast was wrong and it cleared up."], ["くじが <ruby>外<rt>はず</rt></ruby>れてしまった。", "My lottery ticket did not win."]], "n": "予報が外れる / 当たる = forecast wrong / right. 当たる is the opposite."}, {"w": "折る", "wf": "<ruby>折<rt>お</rt></ruby>る", "r": "おる", "m": "to fold; to break (snap)", "p": "v5 transitive", "t": "verb", "d": 13, "ex": [["<ruby>紙<rt>かみ</rt></ruby>を <ruby>半分<rt>はんぶん</rt></ruby>に <ruby>折<rt>お</rt></ruby>ってください。", "Please fold the paper in half."], ["スキーで <ruby>足<rt>あし</rt></ruby>の <ruby>骨<rt>ほね</rt></ruby>を <ruby>折<rt>お</rt></ruby>ってしまった。", "I broke a bone in my leg skiing."], ["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>折<rt>お</rt></ruby>り <ruby>紙<rt>がみ</rt></ruby>で <ruby>鶴<rt>つる</rt></ruby>を <ruby>折<rt>お</rt></ruby>った。", "She folded a crane with origami."]], "n": "Fold and snap share one verb. 骨折 (こっせつ) = bone fracture."}, {"w": "折れる", "wf": "<ruby>折<rt>お</rt></ruby>れる", "r": "おれる", "m": "to snap; to give in; to turn (a corner)", "p": "v1 intransitive", "t": "verb", "d": 13, "ex": [["<ruby>強<rt>つよ</rt></ruby>い <ruby>風<rt>かぜ</rt></ruby>で <ruby>木<rt>き</rt></ruby>の <ruby>枝<rt>えだ</rt></ruby>が <ruby>折<rt>お</rt></ruby>れた。", "A tree branch snapped in the strong wind."], ["<ruby>最後<rt>さいご</rt></ruby>は <ruby>父<rt>ちち</rt></ruby>が <ruby>折<rt>お</rt></ruby>れて、 <ruby>旅行<rt>りょこう</rt></ruby>に <ruby>行<rt>い</rt></ruby>けることになった。", "In the end my father gave in, and we could go on the trip."], ["その <ruby>角<rt>かど</rt></ruby>を <ruby>右<rt>みぎ</rt></ruby>に <ruby>折<rt>お</rt></ruby>れると、 <ruby>銀行<rt>ぎんこう</rt></ruby>があります。", "Turn right at that corner and there is a bank."]], "n": "心が折れる = spirit breaks (modern spoken). Also = yield in an argument."}, {"w": "覚める", "wf": "<ruby>覚<rt>さ</rt></ruby>める", "r": "さめる", "m": "to wake up; to sober up", "p": "v1 intransitive", "t": "verb", "d": 13, "ex": [["<ruby>夜中<rt>よなか</rt></ruby>に <ruby>何度<rt>なんど</rt></ruby>も <ruby>目<rt>め</rt></ruby>が <ruby>覚<rt>さ</rt></ruby>めた。", "I woke up many times during the night."], ["コーヒーを <ruby>飲<rt>の</rt></ruby>んだら、 <ruby>目<rt>め</rt></ruby>が <ruby>覚<rt>さ</rt></ruby>めた。", "After drinking coffee, I woke right up."], ["<ruby>夢<rt>ゆめ</rt></ruby>から <ruby>覚<rt>さ</rt></ruby>めたような <ruby>気分<rt>きぶん</rt></ruby>だった。", "I felt as if I had awoken from a dream."]], "n": "Set phrase 目が覚める (not 起きる alone). Homophone 冷める = cool down — trap pair, next word."}, {"w": "冷める", "wf": "<ruby>冷<rt>さ</rt></ruby>める", "r": "さめる", "m": "to cool down; to lose interest", "p": "v1 intransitive", "t": "verb", "d": 13, "ex": [["スープが <ruby>冷<rt>さ</rt></ruby>めないうちに <ruby>食<rt>た</rt></ruby>べてください。", "Please eat the soup before it gets cold."], ["お <ruby>風呂<rt>ふろ</rt></ruby>が <ruby>冷<rt>さ</rt></ruby>めてしまった。", "The bath has gone cold."], ["<ruby>彼<rt>かれ</rt></ruby>のサッカー <ruby>熱<rt>ねつ</rt></ruby>はすっかり <ruby>冷<rt>さ</rt></ruby>めたようだ。", "His passion for soccer seems to have completely cooled."]], "n": "〜ないうちに (before it ~) is the exam frame. Same sound as 覚める — kanji decides meaning."}, {"w": "沸く", "wf": "<ruby>沸<rt>わ</rt></ruby>く", "r": "わく", "m": "to boil; to get excited (crowd)", "p": "v5 intransitive", "t": "verb", "d": 13, "ex": [["お <ruby>湯<rt>ゆ</rt></ruby>が <ruby>沸<rt>わ</rt></ruby>いたら、お <ruby>茶<rt>ちゃ</rt></ruby>を <ruby>入<rt>い</rt></ruby>れましょう。", "When the water boils, let us make tea."], ["お <ruby>風呂<rt>ふろ</rt></ruby>が <ruby>沸<rt>わ</rt></ruby>きました。", "The bath is ready."], ["ゴールの <ruby>瞬間<rt>しゅんかん</rt></ruby>、 <ruby>会場<rt>かいじょう</rt></ruby>が <ruby>沸<rt>わ</rt></ruby>いた。", "The moment of the goal, the venue erupted."]], "n": "Your bath heater literally announces お風呂が沸きました. Crowd excitement too."}, {"w": "沸かす", "wf": "<ruby>沸<rt>わ</rt></ruby>かす", "r": "わかす", "m": "to boil (water); to heat (bath)", "p": "v5 transitive", "t": "verb", "d": 13, "ex": [["お <ruby>湯<rt>ゆ</rt></ruby>を <ruby>沸<rt>わ</rt></ruby>かしてコーヒーを <ruby>入<rt>い</rt></ruby>れた。", "I boiled water and made coffee."], ["お <ruby>風呂<rt>ふろ</rt></ruby>を <ruby>沸<rt>わ</rt></ruby>かしておいてくれる？", "Can you heat the bath for me?"], ["やかんでお <ruby>湯<rt>ゆ</rt></ruby>を <ruby>沸<rt>わ</rt></ruby>かすより、 <ruby>電気<rt>でんき</rt></ruby>ポットの <ruby>方<rt>ほう</rt></ruby>が <ruby>速<rt>はや</rt></ruby>い。", "An electric kettle is faster than boiling water in a kettle on the stove."]], "n": "Pair: 沸く (vi) ↔ 沸かす (vt). Note: you boil the water お湯, not the 水 — set collocation."}, {"w": "混ぜる", "wf": "<ruby>混<rt>ま</rt></ruby>ぜる", "r": "まぜる", "m": "to mix; to stir", "p": "v1 transitive", "t": "verb", "d": 13, "ex": [["<ruby>卵<rt>たまご</rt></ruby>と <ruby>砂糖<rt>さとう</rt></ruby>をよく <ruby>混<rt>ま</rt></ruby>ぜてください。", "Please mix the egg and sugar well."], ["ご <ruby>飯<rt>はん</rt></ruby>に <ruby>豆<rt>まめ</rt></ruby>を <ruby>混<rt>ま</rt></ruby>ぜて <ruby>炊<rt>た</rt></ruby>いた。", "I cooked the rice mixed with beans."], ["<ruby>絵<rt>え</rt></ruby>の <ruby>具<rt>ぐ</rt></ruby>を <ruby>混<rt>ま</rt></ruby>ぜて、 <ruby>好<rt>す</rt></ruby>きな <ruby>色<rt>いろ</rt></ruby>を <ruby>作<rt>つく</rt></ruby>った。", "I mixed paints and made the color I wanted."]], "n": "混ざる／混じる (vi) = be mixed. Cooking-instruction staple."}, {"w": "包む", "wf": "<ruby>包<rt>つつ</rt></ruby>む", "r": "つつむ", "m": "to wrap", "p": "v5 transitive", "t": "verb", "d": 13, "ex": [["プレゼント <ruby>用<rt>よう</rt></ruby>に <ruby>包<rt>つつ</rt></ruby>んでください。", "Please wrap it as a gift."], ["<ruby>母<rt>はは</rt></ruby>は <ruby>弁当<rt>べんとう</rt></ruby>を <ruby>布<rt>ぬの</rt></ruby>で <ruby>包<rt>つつ</rt></ruby>んだ。", "My mother wrapped the lunch box in cloth."], ["<ruby>町<rt>まち</rt></ruby>は <ruby>朝<rt>あさ</rt></ruby>の <ruby>霧<rt>きり</rt></ruby>に <ruby>包<rt>つつ</rt></ruby>まれていた。", "The town was wrapped in morning fog."]], "n": "Shop phrase: プレゼント用に包んでください. Passive 包まれる = enveloped in (fog, warmth)."}, {"w": "塗る", "wf": "<ruby>塗<rt>ぬ</rt></ruby>る", "r": "ぬる", "m": "to paint; to apply (cream, medicine)", "p": "v5 transitive", "t": "verb", "d": 13, "ex": [["<ruby>壁<rt>かべ</rt></ruby>を <ruby>白<rt>しろ</rt></ruby>く <ruby>塗<rt>ぬ</rt></ruby>った。", "We painted the wall white."], ["<ruby>虫<rt>むし</rt></ruby>に <ruby>刺<rt>さ</rt></ruby>されたところに <ruby>薬<rt>くすり</rt></ruby>を <ruby>塗<rt>ぬ</rt></ruby>った。", "I applied medicine where the insect bit me."], ["パンにバターを <ruby>塗<rt>ぬ</rt></ruby>って <ruby>食<rt>た</rt></ruby>べる。", "I spread butter on bread and eat it."]], "n": "Paint, cream, butter — one verb. 薬を塗る vs 薬を飲む: apply vs take."}, {"w": "畳む", "wf": "<ruby>畳<rt>たた</rt></ruby>む", "r": "たたむ", "m": "to fold (clothes, futon); to close (business)", "p": "v5 transitive", "t": "verb", "d": 13, "ex": [["<ruby>洗濯物<rt>せんたくもの</rt></ruby>を <ruby>畳<rt>たた</rt></ruby>んでしまった。", "I folded the laundry and put it away."], ["<ruby>布団<rt>ふとん</rt></ruby>を <ruby>畳<rt>たた</rt></ruby>んで <ruby>押<rt>お</rt></ruby>し <ruby>入<rt>い</rt></ruby>れに <ruby>入<rt>い</rt></ruby>れる。", "I fold the futon and put it in the closet."], ["<ruby>祖父<rt>そふ</rt></ruby>は <ruby>去年<rt>きょねん</rt></ruby>、 <ruby>店<rt>みせ</rt></ruby>を <ruby>畳<rt>たた</rt></ruby>んだ。", "My grandfather closed his shop last year."]], "n": "Same kanji as 畳 (たたみ, tatami mat). 店を畳む = close a business for good."}, {"w": "重ねる", "wf": "<ruby>重<rt>かさ</rt></ruby>ねる", "r": "かさねる", "m": "to pile up; to repeat (efforts)", "p": "v1 transitive", "t": "verb", "d": 13, "ex": [["お <ruby>皿<rt>さら</rt></ruby>を <ruby>重<rt>かさ</rt></ruby>ねて <ruby>棚<rt>たな</rt></ruby>にしまった。", "I stacked the plates and put them in the cupboard."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>努力<rt>どりょく</rt></ruby>を <ruby>重<rt>かさ</rt></ruby>ねて、 <ruby>夢<rt>ゆめ</rt></ruby>をかなえた。", "He piled effort on effort and realized his dream."], ["<ruby>失敗<rt>しっぱい</rt></ruby>を <ruby>重<rt>かさ</rt></ruby>ねるたびに、 <ruby>人<rt>ひと</rt></ruby>は <ruby>強<rt>つよ</rt></ruby>くなる。", "Each time failures pile up, people grow stronger."]], "n": "努力を重ねる, 経験を重ねる = accumulate — reading-passage favourite. 年を重ねる = age."}, {"w": "重なる", "wf": "<ruby>重<rt>かさ</rt></ruby>なる", "r": "かさなる", "m": "to overlap; to coincide", "p": "v5 intransitive", "t": "verb", "d": 13, "ex": [["<ruby>今週<rt>こんしゅう</rt></ruby>は <ruby>予定<rt>よてい</rt></ruby>が <ruby>重<rt>かさ</rt></ruby>なって <ruby>忙<rt>いそが</rt></ruby>しい。", "This week my plans overlap and I am busy."], ["<ruby>会議<rt>かいぎ</rt></ruby>と <ruby>面接<rt>めんせつ</rt></ruby>の <ruby>時間<rt>じかん</rt></ruby>が <ruby>重<rt>かさ</rt></ruby>なってしまった。", "The meeting and the interview ended up at the same time."], ["<ruby>不運<rt>ふうん</rt></ruby>が <ruby>重<rt>かさ</rt></ruby>なって、 <ruby>大変<rt>たいへん</rt></ruby>な <ruby>一年<rt>いちねん</rt></ruby>だった。", "Misfortunes piled up — it was a hard year."]], "n": "Schedule conflicts = 予定が重なる. Pair: 重ねる (vt)."}, {"w": "積む", "wf": "<ruby>積<rt>つ</rt></ruby>む", "r": "つむ", "m": "to pile up; to load; to accumulate (experience)", "p": "v5 transitive", "t": "verb", "d": 13, "ex": [["トラックに <ruby>荷物<rt>にもつ</rt></ruby>を <ruby>積<rt>つ</rt></ruby>んだ。", "We loaded the truck with cargo."], ["<ruby>海外<rt>かいがい</rt></ruby>で <ruby>経験<rt>けいけん</rt></ruby>を <ruby>積<rt>つ</rt></ruby>みたい。", "I want to build up experience overseas."], ["<ruby>机<rt>つくえ</rt></ruby>の <ruby>上<rt>うえ</rt></ruby>に <ruby>本<rt>ほん</rt></ruby>が <ruby>積<rt>つ</rt></ruby>んである。", "Books are piled on the desk."]], "n": "経験を積む = the resume verb. 積んである = stacked (てある state)."}, {"w": "積もる", "wf": "<ruby>積<rt>つ</rt></ruby>もる", "r": "つもる", "m": "to pile up (snow, dust)", "p": "v5 intransitive", "t": "verb", "d": 13, "ex": [["<ruby>一晩<rt>ひとばん</rt></ruby>で <ruby>雪<rt>ゆき</rt></ruby>が <ruby>二十<rt>にじゅう</rt></ruby>センチ <ruby>積<rt>つ</rt></ruby>もった。", "Twenty centimeters of snow piled up overnight."], ["<ruby>机<rt>つくえ</rt></ruby>の <ruby>上<rt>うえ</rt></ruby>にほこりが <ruby>積<rt>つ</rt></ruby>もっている。", "Dust has collected on the desk."], ["<ruby>積<rt>つ</rt></ruby>もる <ruby>話<rt>はなし</rt></ruby>もあるし、 <ruby>今度<rt>こんど</rt></ruby>ゆっくり <ruby>会<rt>あ</rt></ruby>おう。", "We have a lot to catch up on — let us meet properly sometime."]], "n": "雪が積もる = the weather-news phrase. 積もる話 = much to catch up on."}, {"w": "叩く", "wf": "<ruby>叩<rt>たた</rt></ruby>く", "r": "たたく", "m": "to hit; to knock; to clap", "p": "v5 transitive", "t": "verb", "d": 13, "ex": [["ドアを <ruby>叩<rt>たた</rt></ruby>く <ruby>音<rt>おと</rt></ruby>がした。", "There was a knocking sound at the door."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>私<rt>わたし</rt></ruby>の <ruby>肩<rt>かた</rt></ruby>を <ruby>軽<rt>かる</rt></ruby>く <ruby>叩<rt>たた</rt></ruby>いた。", "He tapped me lightly on the shoulder."], ["<ruby>太鼓<rt>たいこ</rt></ruby>を <ruby>叩<rt>たた</rt></ruby>く <ruby>祭<rt>まつ</rt></ruby>りを <ruby>見<rt>み</rt></ruby>に <ruby>行<rt>い</rt></ruby>った。", "I went to see a festival with drum beating."]], "n": "Knock, tap, drum, clap (手を叩く). Usually written たたく in kana."}, {"w": "抑える", "wf": "<ruby>抑<rt>おさ</rt></ruby>える", "r": "おさえる", "m": "to suppress; to keep down (costs, feelings)", "p": "v1 transitive", "t": "verb", "d": 13, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>怒<rt>いか</rt></ruby>りを <ruby>抑<rt>おさ</rt></ruby>えて、 <ruby>冷静<rt>れいせい</rt></ruby>に <ruby>話<rt>はな</rt></ruby>した。", "He suppressed his anger and spoke calmly."], ["<ruby>今月<rt>こんげつ</rt></ruby>は <ruby>食費<rt>しょくひ</rt></ruby>を <ruby>抑<rt>おさ</rt></ruby>えたい。", "I want to keep food costs down this month."], ["この <ruby>薬<rt>くすり</rt></ruby>は <ruby>痛<rt>いた</rt></ruby>みを <ruby>抑<rt>おさ</rt></ruby>える <ruby>効果<rt>こうか</rt></ruby>がある。", "This medicine has the effect of suppressing pain."]], "n": "Emotions, costs, pain. Homophone 押さえる = hold down physically — kanji-section trap."}, {"w": "引っ張る", "wf": "<ruby>引<rt>ひ</rt></ruby>っ <ruby>張<rt>ぱ</rt></ruby>る", "r": "ひっぱる", "m": "to pull; to drag", "p": "v5 transitive", "t": "verb", "d": 13, "ex": [["そんなに <ruby>強<rt>つよ</rt></ruby>く <ruby>引<rt>ひ</rt></ruby>っ <ruby>張<rt>ぱ</rt></ruby>らないで。", "Do not pull so hard."], ["<ruby>犬<rt>いぬ</rt></ruby>がリードを <ruby>引<rt>ひ</rt></ruby>っ <ruby>張<rt>ぱ</rt></ruby>って <ruby>歩<rt>ある</rt></ruby>きたがる。", "The dog pulls on the leash, wanting to walk."], ["<ruby>彼女<rt>かのじょ</rt></ruby>がチームを <ruby>引<rt>ひ</rt></ruby>っ <ruby>張<rt>ぱ</rt></ruby>っている。", "She is pulling the team along (leading it)."]], "n": "チームを引っ張る = carry/lead the team. Opposite: 押す (push)."}, {"w": "取り替える", "wf": "<ruby>取<rt>と</rt></ruby>り <ruby>替<rt>か</rt></ruby>える", "r": "とりかえる", "m": "to replace; to exchange", "p": "v1 transitive", "t": "verb", "d": 13, "ex": [["<ruby>電池<rt>でんち</rt></ruby>を <ruby>新<rt>あたら</rt></ruby>しいのと <ruby>取<rt>と</rt></ruby>り <ruby>替<rt>か</rt></ruby>えた。", "I replaced the batteries with new ones."], ["<ruby>電球<rt>でんきゅう</rt></ruby>が <ruby>切<rt>き</rt></ruby>れたので <ruby>取<rt>と</rt></ruby>り <ruby>替<rt>か</rt></ruby>えなければならない。", "The light bulb burned out, so it has to be replaced."], ["サイズが <ruby>合<rt>あ</rt></ruby>わない <ruby>場合<rt>ばあい</rt></ruby>は <ruby>取<rt>と</rt></ruby>り <ruby>替<rt>か</rt></ruby>えられますか。", "If the size does not fit, can it be exchanged?"]], "n": "交換する = formal version. Store word for exchanges."}, {"w": "戻す", "wf": "<ruby>戻<rt>もど</rt></ruby>す", "r": "もどす", "m": "to return (something); to put back", "p": "v5 transitive", "t": "verb", "d": 13, "ex": [["<ruby>使<rt>つか</rt></ruby>った <ruby>物<rt>もの</rt></ruby>は <ruby>元<rt>もと</rt></ruby>の <ruby>場所<rt>ばしょ</rt></ruby>に <ruby>戻<rt>もど</rt></ruby>してください。", "Please put things back where they were."], ["<ruby>読<rt>よ</rt></ruby>み <ruby>終<rt>お</rt></ruby>わった <ruby>本<rt>ほん</rt></ruby>を <ruby>棚<rt>たな</rt></ruby>に <ruby>戻<rt>もど</rt></ruby>した。", "I returned the book I finished to the shelf."], ["<ruby>話<rt>はなし</rt></ruby>を <ruby>元<rt>もと</rt></ruby>に <ruby>戻<rt>もど</rt></ruby>しましょう。", "Let us get back to the topic."]], "n": "Pair: 戻る (vi, N4) ↔ 戻す (vt). 話を戻す = get back on topic (meeting phrase)."}, {"w": "つながる", "wf": "つながる", "r": "つながる", "m": "to be connected; to lead to", "p": "v5 intransitive", "t": "verb", "d": 13, "ex": [["インターネットがつながらない。", "The internet will not connect."], ["この <ruby>道<rt>みち</rt></ruby>は <ruby>高速<rt>こうそく</rt></ruby> <ruby>道路<rt>どうろ</rt></ruby>につながっている。", "This road connects to the expressway."], ["<ruby>毎日<rt>まいにち</rt></ruby>の <ruby>練習<rt>れんしゅう</rt></ruby>が <ruby>合格<rt>ごうかく</rt></ruby>につながる。", "Daily practice leads to passing."]], "n": "Wifi, phones, roads, and cause-effect (〜につながる). Kanji 繋がる exists but kana is normal."}, {"w": "広がる", "wf": "<ruby>広<rt>ひろ</rt></ruby>がる", "r": "ひろがる", "m": "to spread; to widen", "p": "v5 intransitive", "t": "verb", "d": 13, "ex": [["うわさはすぐに <ruby>広<rt>ひろ</rt></ruby>がった。", "The rumor spread quickly."], ["<ruby>窓<rt>まど</rt></ruby>の <ruby>外<rt>そと</rt></ruby>には <ruby>海<rt>うみ</rt></ruby>が <ruby>広<rt>ひろ</rt></ruby>がっていた。", "Outside the window, the sea stretched out."], ["<ruby>火事<rt>かじ</rt></ruby>は <ruby>隣<rt>となり</rt></ruby>の <ruby>建物<rt>たてもの</rt></ruby>に <ruby>広<rt>ひろ</rt></ruby>がった。", "The fire spread to the neighboring building."]], "n": "News, fire, scenery. Pair: 広げる (vt)."}, {"w": "広げる", "wf": "<ruby>広<rt>ひろ</rt></ruby>げる", "r": "ひろげる", "m": "to spread out; to widen; to expand", "p": "v1 transitive", "t": "verb", "d": 13, "ex": [["<ruby>机<rt>つくえ</rt></ruby>の <ruby>上<rt>うえ</rt></ruby>に <ruby>地図<rt>ちず</rt></ruby>を <ruby>広<rt>ひろ</rt></ruby>げた。", "I spread the map out on the desk."], ["<ruby>会社<rt>かいしゃ</rt></ruby>は <ruby>海外<rt>かいがい</rt></ruby>に <ruby>事業<rt>じぎょう</rt></ruby>を <ruby>広<rt>ひろ</rt></ruby>げている。", "The company is expanding its business overseas."], ["<ruby>視野<rt>しや</rt></ruby>を <ruby>広<rt>ひろ</rt></ruby>げるために <ruby>留学<rt>りゅうがく</rt></ruby>したい。", "I want to study abroad to broaden my horizons."]], "n": "視野を広げる = broaden one's outlook — essay favourite."}, {"w": "向ける", "wf": "<ruby>向<rt>む</rt></ruby>ける", "r": "むける", "m": "to turn toward; to aim at", "p": "v1 transitive", "t": "verb", "d": 13, "ex": [["カメラをこちらに <ruby>向<rt>む</rt></ruby>けないでください。", "Please do not point the camera this way."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>私<rt>わたし</rt></ruby>に <ruby>背中<rt>せなか</rt></ruby>を <ruby>向<rt>む</rt></ruby>けた。", "He turned his back to me."], ["これは <ruby>初心者<rt>しょしんしゃ</rt></ruby> <ruby>向<rt>む</rt></ruby>けの <ruby>本<rt>ほん</rt></ruby>です。", "This is a book aimed at beginners."]], "n": "N向け = intended for N (子ども向け, 輸出向け) — appears in reading questions."}, {"w": "政府", "wf": "<ruby>政府<rt>せいふ</rt></ruby>", "r": "せいふ", "m": "government", "p": "noun", "t": "noun", "d": 14, "ex": [["<ruby>政府<rt>せいふ</rt></ruby>は <ruby>新<rt>あたら</rt></ruby>しい <ruby>政策<rt>せいさく</rt></ruby>を <ruby>発表<rt>はっぴょう</rt></ruby>した。", "The government announced a new policy."], ["<ruby>政府<rt>せいふ</rt></ruby>の <ruby>調査<rt>ちょうさ</rt></ruby>によると、 <ruby>人口<rt>じんこう</rt></ruby>は <ruby>減<rt>へ</rt></ruby>り <ruby>続<rt>つづ</rt></ruby>けている。", "According to a government survey, the population keeps decreasing."], ["<ruby>国民<rt>こくみん</rt></ruby>は <ruby>政府<rt>せいふ</rt></ruby>に <ruby>説明<rt>せつめい</rt></ruby>を <ruby>求<rt>もと</rt></ruby>めた。", "The people demanded an explanation from the government."]], "n": "News cluster: 政府・政治・政策. 国 = the country (casual equivalent)."}, {"w": "地域", "wf": "<ruby>地域<rt>ちいき</rt></ruby>", "r": "ちいき", "m": "area; region; community", "p": "noun", "t": "noun", "d": 14, "ex": [["この <ruby>地域<rt>ちいき</rt></ruby>は <ruby>雪<rt>ゆき</rt></ruby>が <ruby>多<rt>おお</rt></ruby>い。", "This region gets a lot of snow."], ["<ruby>地域<rt>ちいき</rt></ruby>の <ruby>人々<rt>ひとびと</rt></ruby>と <ruby>交流<rt>こうりゅう</rt></ruby>する <ruby>祭<rt>まつ</rt></ruby>りがある。", "There is a festival for mingling with people of the community."], ["<ruby>住<rt>す</rt></ruby>む <ruby>地域<rt>ちいき</rt></ruby>によって、ごみの <ruby>出<rt>だ</rt></ruby>し <ruby>方<rt>かた</rt></ruby>が <ruby>違<rt>ちが</rt></ruby>う。", "How you put out garbage differs by the area you live in."]], "n": "地域 = local area/community; 地方 = region vs the capital. Next word contrasts."}, {"w": "地方", "wf": "<ruby>地方<rt>ちほう</rt></ruby>", "r": "ちほう", "m": "region; the provinces (vs Tokyo)", "p": "noun", "t": "noun", "d": 14, "ex": [["<ruby>東北<rt>とうほく</rt></ruby> <ruby>地方<rt>ちほう</rt></ruby>では <ruby>大雪<rt>おおゆき</rt></ruby>のおそれがあります。", "There is a risk of heavy snow in the Tohoku region."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>地方<rt>ちほう</rt></ruby> <ruby>出身<rt>しゅっしん</rt></ruby>で、 <ruby>東京<rt>とうきょう</rt></ruby>の <ruby>大学<rt>だいがく</rt></ruby>に <ruby>入<rt>はい</rt></ruby>った。", "He is from the provinces and entered a university in Tokyo."], ["<ruby>地方<rt>ちほう</rt></ruby>の <ruby>人口<rt>じんこう</rt></ruby> <ruby>減少<rt>げんしょう</rt></ruby>が <ruby>進<rt>すす</rt></ruby>んでいる。", "Population decline in rural regions is advancing."]], "n": "Two senses: geographic block (関東地方) and countryside vs Tokyo. Weather forecasts use the first."}, {"w": "都市", "wf": "<ruby>都市<rt>とし</rt></ruby>", "r": "とし", "m": "city (large)", "p": "noun", "t": "noun", "d": 14, "ex": [["<ruby>東京<rt>とうきょう</rt></ruby>は <ruby>世界<rt>せかい</rt></ruby> <ruby>有数<rt>ゆうすう</rt></ruby>の <ruby>大都市<rt>だいとし</rt></ruby>だ。", "Tokyo is one of the world's major big cities."], ["<ruby>都市<rt>とし</rt></ruby>の <ruby>生活<rt>せいかつ ": "<ruby>貿易<rt>ぼうえき</rt></ruby>", "r": "ぼうえき", "m": "trade (international)", "p": "noun / suru-verb", "t": "noun", "d": 14, "ex": [["<ruby>日本<rt>にほん</rt></ruby>は <ruby>多<rt>おお</rt></ruby>くの <ruby>国<rt>くに</rt></ruby>と <ruby>貿易<rt>ぼうえき</rt></ruby>を <ruby>行<rt>おこな</rt></ruby>っている。", "Japan conducts trade with many countries."], ["<ruby>貿易<rt>ぼうえき</rt></ruby> <ruby>会社<rt>がいしゃ</rt></ruby>で <ruby>働<rt>はたら</rt></ruby>きたい。", "I want to work at a trading company."], ["<ruby>両国<rt>りょうこく</rt></ruby>の <ruby>貿易<rt>ぼうえき</rt></ruby> <ruby>関係<rt>かんけい</rt></ruby>は <ruby>深<rt>ふか</rt></ruby>まっている。", "Trade relations between the two countries are deepening."]], "n": "Umbrella for 輸出＋輸入 (batch 2). 貿易会社 = trading company (many in Tokyo)."}, {"w": "産業", "wf": "<ruby>産業<rt>さんぎょう</rt></ruby>", "r": "さんぎょう", "m": "industry", "p": "noun", "t": "noun", "d": 14, "ex": [["この <ruby>国<rt>くに</rt></ruby>の <ruby>主<rt>おも</rt></ruby>な <ruby>産業<rt>さんぎょう</rt></ruby>は <ruby>観光<rt>かんこう</rt></ruby>だ。", "This country's main industry is tourism."], ["IT <ruby>産業<rt>さんぎょう</rt></ruby>は <ruby>急速<rt>きゅうそく</rt></ruby>に <ruby>成長<rt>せいちょう</rt></ruby>している。", "The IT industry is growing rapidly."], ["<ruby>自動車<rt>じどうしゃ</rt></ruby> <ruby>産業<rt>さんぎょう</rt></ruby>は <ruby>多<rt>おお</rt></ruby>くの <ruby>人<rt>ひと</rt></ruby>を <ruby>雇<rt>やと</rt></ruby>っている。", "The auto industry employs many people."]], "n": "Suffix pattern: 観光産業, IT産業. 工業 = manufacturing specifically."}, {"w": "農業", "wf": "<ruby>農業<rt>のうぎょう</rt></ruby>", "r": "のうぎょう", "m": "agriculture; farming", "p": "noun", "t": "noun", "d": 14, "ex": [["<ruby>祖父母<rt>そふぼ</rt></ruby>は <ruby>田舎<rt>いなか</rt></ruby>で <ruby>農業<rt>のうぎょう</rt></ruby>をしている。", "My grandparents farm in the countryside."], ["<ruby>農業<rt>のうぎょう</rt></ruby>を <ruby>始<rt>はじ</rt></ruby>める <ruby>若者<rt>わかもの</rt></ruby>が <ruby>少<rt>すこ</rt></ruby>しずつ <ruby>増<rt>ふ</rt></ruby>えている。", "Young people taking up farming are slowly increasing."], ["この <ruby>地域<rt>ちいき</rt></ruby>は <ruby>農業<rt>のうぎょう</rt></ruby>が <ruby>盛<rt>さか
