<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N3 Vocab Flashcards</title>
<style>
  :root {
    --bg:#f4f4f2; --fg:#1c1c1e; --muted:#6b6b70; --card:#ffffff;
    --line:#e2e2df; --accent:#3a6ea5; --good:#2e7d52; --shadow:0 6px 24px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#161618;--fg:#ececef;--muted:#9a9aa2;--card:#232327;
      --line:#34343a;--accent:#6fa8dc;--good:#67c295;--shadow:0 6px 24px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
  header{padding:14px 16px;border-bottom:1px solid var(--line);
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;
    background:var(--bg);z-index:5}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
  select,button{font:inherit;color:var(--fg);background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  button:active{transform:translateY(1px)}
  .spacer{flex:1}
  .count{color:var(--muted);font-variant-numeric:tabular-nums}
  main{display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
  .card{width:min(560px,100%);background:var(--card);border:1px solid var(--line);
    border-radius:18px;box-shadow:var(--shadow);padding:32px 28px;min-height:340px;
    display:flex;flex-direction:column;justify-content:center;text-align:center;
    cursor:pointer;user-select:none}
  .word{font-size:52px;font-weight:700;line-height:1.15}
  .word rt{font-size:.34em;font-weight:500;color:var(--muted)}
  .pos{margin-top:10px;color:var(--muted);font-size:13px}
  .hint{margin-top:22px;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
  .reading{font-size:26px;color:var(--accent);font-weight:600}
  .meaning{font-size:21px;margin-top:6px}
  .ex{margin-top:20px;text-align:left;border-top:1px solid var(--line);padding-top:16px}
  .ex p{margin:.5em 0}
  .ex .jp{font-size:17px}
  .ex .jp rt{font-size:.5em;color:var(--muted)}
  .ex .en{color:var(--muted);font-size:13px;margin-top:2px}
  .note{margin-top:16px;text-align:left;font-size:13px;color:var(--muted);
    background:var(--bg);border-radius:10px;padding:10px 12px}
  .controls{display:flex;gap:10px;margin-top:22px;align-items:center}
  .big{padding:10px 18px;border-radius:10px;font-weight:600}
  .known{border-color:var(--good);color:var(--good)}
  kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;
    padding:1px 6px;font-size:11px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
</style>
</head>
<body>
<header>
  <h1>N3 Vocab</h1>
  <select id="day"></select>
  <select id="type">
    <option value="">all types</option>
    <option value="verb">verbs</option>
    <option value="noun">nouns</option>
    <option value="adj">adjectives</option>
    <option value="adv">adverbs</option>
  </select>
  <select id="mode">
    <option value="jp">JP &rarr; EN</option>
    <option value="en">EN &rarr; JP</option>
  </select>
  <button id="shuffle">shuffle</button>
  <button id="reset" title="clear known marks">reset</button>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
</header>
<main>
  <div class="card" id="card"></div>
  <div class="controls">
    <button class="big" id="prev">&larr;</button>
    <button class="big" id="flip">flip</button>
    <button class="big" id="next">&rarr;</button>
    <button class="big known" id="mark">known</button>
  </div>
  <footer>
    <kbd>Space</kbd> flip &nbsp; <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp;
    <kbd>K</kbd> known &nbsp; <kbd>S</kbd> shuffle &middot;
    known marks are saved in this browser
  </footer>
</main>
<script>
const CARDS = [{"w": "場合", "wf": "<ruby>場合<rt>ばあい</rt></ruby>", "r": "ばあい", "m": "case; situation; in the event of", "p": "noun", "t": "noun", "d": 1, "ex": [["<ruby>雨<rt>あめ</rt></ruby>の <ruby>場合<rt>ばあい</rt></ruby>は、 <ruby>試合<rt>しあい</rt></ruby>は <ruby>中止<rt>ちゅうし</rt></ruby>になります。", "In case of rain, the match will be cancelled."], ["<ruby>遅<rt>おく</rt></ruby>れる <ruby>場合<rt>ばあい</rt></ruby>は、 <ruby>必<rt>かなら</rt></ruby>ず <ruby>連絡<rt>れんらく</rt></ruby>してください。", "If you are going to be late, be sure to contact us."], ["<ruby>多<rt>おお</rt></ruby>くの <ruby>場合<rt>ばあい</rt></ruby>、 <ruby>原因<rt>げんいん</rt></ruby>は <ruby>睡眠<rt>すいみん</rt></ruby> <ruby>不足<rt>ぶそく</rt></ruby>です。", "In many cases, the cause is lack of sleep."]], "n": "Reading is ばあい. その場合は = in that case. Spoken equivalent: 〜だったら."}, {"w": "結果", "wf": "<ruby>結果<rt>けっか</rt></ruby>", "r": "けっか", "m": "result; outcome", "p": "noun", "t": "noun", "d": 1, "ex": [["<ruby>試験<rt>しけん</rt></ruby>の <ruby>結果<rt>けっか</rt></ruby>は <ruby>来週<rt>らいしゅう</rt></ruby> <ruby>発表<rt>はっぴょう</rt></ruby>されます。", "The exam results will be announced next week."], ["<ruby>頑張<rt>がんば</rt></ruby>った <ruby>結果<rt>けっか</rt></ruby>、 <ruby>合格<rt>ごうかく</rt></ruby>できました。", "As a result of working hard, I passed."], ["<ruby>結果<rt>けっか</rt></ruby>より <ruby>過程<rt>かてい</rt></ruby>が <ruby>大切<rt>たいせつ</rt></ruby>だと <ruby>思<rt>おも</rt></ruby>う。", "I think the process matters more than the result."]], "n": "Pair with 原因 (cause). 結果的に = as it turned out."}, {"w": "関係", "wf": "<ruby>関係<rt>かんけい</rt></ruby>", "r": "かんけい", "m": "relationship; connection; relevance", "p": "noun / suru-verb", "t": "noun", "d": 1, "ex": [["<ruby>二人<rt>ふたり</rt></ruby>の <ruby>関係<rt>かんけい</rt></ruby>は <ruby>前<rt>まえ</rt></ruby>より <ruby>良<rt>よ</rt></ruby>くなった。", "The relationship between the two has gotten better than before."], ["それは <ruby>私<rt>わたし</rt></ruby>には <ruby>関係<rt>かんけい</rt></ruby>ありません。", "That has nothing to do with me."], ["この <ruby>問題<rt>もんだい</rt></ruby>は <ruby>天気<rt>てんき</rt></ruby>と <ruby>関係<rt>かんけい</rt></ruby>がある。", "This problem is related to the weather."]], "n": "関係ない = none of my business / irrelevant (rough spoken: 関係ねえ). 人間関係 = human relations."}, {"w": "状況", "wf": "<ruby>状況<rt>じょうきょう</rt></ruby>", "r": "じょうきょう", "m": "situation; circumstances", "p": "noun", "t": "noun", "d": 1, "ex": [["<ruby>現在<rt>げんざい</rt></ruby>の <ruby>状況<rt>じょうきょう</rt></ruby>を <ruby>説明<rt>せつめい</rt></ruby>してください。", "Please explain the current situation."], ["<ruby>状況<rt>じょうきょう</rt></ruby>によっては、 <ruby>予定<rt>よてい</rt></ruby>を <ruby>変<rt>か</rt></ruby>えるかもしれません。", "Depending on the situation, we might change the plan."], ["<ruby>事故<rt>じこ</rt></ruby>の <ruby>状況<rt>じょうきょう</rt></ruby>はまだよく <ruby>分<rt>わ</rt></ruby>かっていない。", "The circumstances of the accident are still not well understood."]], "n": "状況 = surrounding circumstances (changing); 状態 = condition of a thing. Both on N3."}, {"w": "感じる", "wf": "<ruby>感<rt>かん</rt></ruby>じる", "r": "かんじる", "m": "to feel; to sense", "p": "v1 transitive", "t": "verb", "d": 1, "ex": [["<ruby>最近<rt>さいきん</rt></ruby>、 <ruby>少<rt>すこ</rt></ruby>し <ruby>疲<rt>つか</rt></ruby>れを <ruby>感<rt>かん</rt></ruby>じる。", "I have been feeling a bit tired lately."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>言葉<rt>ことば</rt></ruby>に <ruby>優<rt>やさ</rt></ruby>しさを <ruby>感<rt>かん</rt></ruby>じた。", "I felt kindness in his words."], ["<ruby>日本<rt>にほん</rt></ruby>の <ruby>夏<rt>なつ</rt></ruby>は、 <ruby>暑<rt>あつ</rt></ruby>さより <ruby>湿気<rt>しっけ</rt></ruby>を <ruby>強<rt>つよ</rt></ruby>く <ruby>感<rt>かん</rt></ruby>じる。", "In Japanese summers you feel the humidity more than the heat."]], "n": "〜と感じる = feel that (opinion). 〜感じがする = it feels like. Spoken: いい感じ = looks/feels good."}, {"w": "続く", "wf": "<ruby>続<rt>つづ</rt></ruby>く", "r": "つづく", "m": "to continue; to last; to go on", "p": "v5 intransitive", "t": "verb", "d": 1, "ex": [["<ruby>雨<rt>あめ</rt></ruby>の <ruby>日<rt>ひ</rt></ruby>が <ruby>一週間<rt>いっしゅうかん</rt></ruby> <ruby>続<rt>つづ</rt></ruby>いている。", "The rainy days have continued for a week."], ["<ruby>会議<rt>かいぎ</rt></ruby>は <ruby>夜<rt>よる</rt></ruby> <ruby>遅<rt>おそ</rt></ruby>くまで <ruby>続<rt>つづ</rt></ruby>いた。", "The meeting went on until late at night."], ["この <ruby>道<rt>みち</rt></ruby>は <ruby>駅<rt>えき</rt></ruby>まで <ruby>続<rt>つづ</rt></ruby>いています。", "This road continues to the station."]], "n": "続く at the end of an episode = to be continued. Pair: 続く (vi) ↔ 続ける (vt)."}, {"w": "続ける", "wf": "<ruby>続<rt>つづ</rt></ruby>ける", "r": "つづける", "m": "to continue (doing); to keep on", "p": "v1 transitive", "t": "verb", "d": 1, "ex": [["<ruby>毎日<rt>まいにち</rt></ruby> <ruby>三十分<rt>さんじゅっぷん</rt></ruby>、 <ruby>日本語<rt>にほんご</rt></ruby>の <ruby>勉強<rt>べんきょう</rt></ruby>を <ruby>続<rt>つづ</rt></ruby>けている。", "I keep studying Japanese 30 minutes every day."], ["<ruby>疲<rt>つか</rt></ruby>れても、 <ruby>走<rt>はし</rt></ruby>り <ruby>続<rt>つづ</rt></ruby>けた。", "Even though I was tired, I kept running."], ["<ruby>話<rt>はなし</rt></ruby>を <ruby>続<rt>つづ</rt></ruby>けてください。", "Please continue your story."]], "n": "V-stem＋続ける is a core N3 grammar pattern. Spoken: 続けて！ = Go on."}, {"w": "情報", "wf": "<ruby>情報<rt>じょうほう</rt></ruby>", "r": "じょうほう", "m": "information", "p": "noun", "t": "noun", "d": 1, "ex": [["インターネットで <ruby>情報<rt>じょうほう</rt></ruby>を <ruby>集<rt>あつ</rt></ruby>めた。", "I gathered information on the internet."], ["この <ruby>情報<rt>じょうほう</rt></ruby>は <ruby>本当<rt>ほんとう</rt></ruby>かどうか <ruby>分<rt>わ</rt></ruby>からない。", "I do not know whether this information is true."], ["<ruby>新<rt>あたら</rt></ruby>しい <ruby>情報<rt>じょうほう</rt></ruby>が <ruby>入<rt>はい</rt></ruby>ったら、すぐ <ruby>知<rt>し</rt></ruby>らせます。", "I will let you know as soon as new information comes in."]], "n": "個人情報 = personal information. Reading じょうほう."}, {"w": "方法", "wf": "<ruby>方法<rt>ほうほう</rt></ruby>", "r": "ほうほう", "m": "method; way", "p": "noun", "t": "noun", "d": 1, "ex": [["もっといい <ruby>方法<rt>ほうほう</rt></ruby>があると <ruby>思<rt>おも</rt></ruby>う。", "I think there is a better way."], ["<ruby>単語<rt>たんご</rt></ruby>を <ruby>覚<rt>おぼ</rt></ruby>える <ruby>方法<rt>ほうほう</rt></ruby>を <ruby>教<rt>おし</rt></ruby>えてください。", "Please tell me a method for memorizing vocabulary."], ["この <ruby>方法<rt>ほうほう</rt></ruby>なら、 <ruby>誰<rt>だれ</rt></ruby>でも <ruby>簡単<rt>かんたん</rt></ruby>にできる。", "With this method, anyone can do it easily."]], "n": "方法 = method (formal); やり方 = way of doing (spoken); 〜方 (使い方) = how to."}, {"w": "内容", "wf": "<ruby>内容<rt>ないよう</rt></ruby>", "r": "ないよう", "m": "content(s); substance", "p": "noun", "t": "noun", "d": 1, "ex": [["メールの <ruby>内容<rt>ないよう</rt></ruby>を <ruby>確認<rt>かくにん</rt></ruby>しました。", "I checked the contents of the email."], ["この <ruby>本<rt>ほん</rt></ruby>は <ruby>内容<rt>ないよう</rt></ruby>が <ruby>難<rt>むずか</rt></ruby>しい。", "The content of this book is difficult."], ["<ruby>話<rt>はなし</rt></ruby>の <ruby>内容<rt>ないよう</rt></ruby>がよく <ruby>分<rt>わ</rt></ruby>からなかった。", "I did not really understand what the talk was about."]], "n": "内容 = content (abstract, exam word); 中身 (なかみ) = what is physically inside."}, {"w": "決まる", "wf": "<ruby>決<rt>き</rt></ruby>まる", "r": "きまる", "m": "to be decided; to be settled", "p": "v5 intransitive", "t": "verb", "d": 1, "ex": [["<ruby>会議<rt>かいぎ</rt></ruby>の <ruby>日<rt>ひ</rt></ruby>が <ruby>決<rt>き</rt></ruby>まった。", "The meeting date has been decided."], ["<ruby>引<rt>ひ</rt></ruby>っ <ruby>越<rt>こ</rt></ruby>し <ruby>先<rt>さき</rt></ruby>はまだ <ruby>決<rt>き</rt></ruby>まっていません。", "Where I am moving to has not been decided yet."], ["ルールでそう <ruby>決<rt>き</rt></ruby>まっている。", "That is how the rules have it."]], "n": "〜に決まっている = obviously / definitely. Spoken: 決まり！ = Deal. Pair: 決める (vt, N4)."}, {"w": "確認", "wf": "<ruby>確認<rt>かくにん</rt></ruby>", "r": "かくにん", "m": "confirmation; checking", "p": "noun / suru-verb", "t": "verb", "d": 1, "ex": [["<ruby>出発<rt>しゅっぱつ</rt></ruby> <ruby>前<rt>まえ</rt></ruby>に、 <ruby>荷物<rt>にもつ</rt></ruby>をもう <ruby>一度<rt>いちど</rt></ruby> <ruby>確認<rt>かくにん</rt></ruby>した。", "Before leaving, I checked my luggage once more."], ["<ruby>予約<rt>よやく</rt></ruby>の <ruby>確認<rt>かくにん</rt></ruby>のメールが <ruby>届<rt>とど</rt></ruby>いた。", "A reservation confirmation email arrived."], ["<ruby>念<rt>ねん</rt></ruby>のため、 <ruby>時間<rt>じかん</rt></ruby>を <ruby>確認<rt>かくにん</rt></ruby>させてください。", "Just to be sure, let me confirm the time."]], "n": "ご確認ください = standard polite email phrase. Learn with 念のため = just in case."}, {"w": "実際", "wf": "<ruby>実際<rt>じっさい</rt></ruby>", "r": "じっさい", "m": "actually; in practice; reality", "p": "noun / adverb", "t": "adv", "d": 1, "ex": [["<ruby>話<rt>はなし</rt></ruby>には <ruby>聞<rt>き</rt></ruby>いていたが、 <ruby>実際<rt>じっさい</rt></ruby>に <ruby>見<rt>み</rt></ruby>ると <ruby>驚<rt>おどろ</rt></ruby>いた。", "I had heard about it, but when I actually saw it I was surprised."], ["<ruby>実際<rt>じっさい</rt></ruby>、その <ruby>方法<rt>ほうほう</rt></ruby>はうまくいかなかった。", "In reality, that method did not work well."], ["<ruby>計画<rt>けいかく</rt></ruby>と <ruby>実際<rt>じっさい</rt></ruby>は <ruby>違<rt>ちが</rt></ruby>う。", "Plans and reality are different."]], "n": "実際に = actually (do/see); 実は = actually (to tell the truth). Not interchangeable."}, {"w": "相手", "wf": "<ruby>相手<rt>あいて</rt></ruby>", "r": "あいて", "m": "the other party; partner; opponent", "p": "noun", "t": "noun", "d": 1, "ex": [["<ruby>相手<rt>あいて</rt></ruby>の <ruby>気持<rt>きも</rt></ruby>ちを <ruby>考<rt>かんが</rt></ruby>えて <ruby>話<rt>はな</rt></ruby>しましょう。", "Let us speak considering the other person's feelings."], ["<ruby>試合<rt>しあい</rt></ruby>の <ruby>相手<rt>あいて</rt></ruby>はとても <ruby>強<rt>つよ</rt></ruby>かった。", "Our opponent in the match was very strong."], ["<ruby>相談<rt>そうだん</rt></ruby>する <ruby>相手<rt>あいて</rt></ruby>がいなくて <ruby>困<rt>こま</rt></ruby>っている。", "I am troubled because I have no one to consult with."]], "n": "話し相手 = someone to talk to; 結婚相手 = marriage partner. Reading あいて."}, {"w": "全体", "wf": "<ruby>全体<rt>ぜんたい</rt></ruby>", "r": "ぜんたい", "m": "the whole; entire", "p": "noun", "t": "noun", "d": 1, "ex": [["クラス <ruby>全体<rt>ぜんたい</rt></ruby>で <ruby>話<rt>はな</rt></ruby>し <ruby>合<rt>あ</rt></ruby>った。", "The whole class discussed it together."], ["<ruby>全体<rt>ぜんたい</rt></ruby>の <ruby>三割<rt>さんわり</rt></ruby>が <ruby>賛成<rt>さんせい</rt></ruby>した。", "30% of the total agreed."], ["まず <ruby>全体<rt>ぜんたい</rt></ruby>を <ruby>見<rt>み</rt></ruby>てから、 <ruby>細<rt>こま</rt></ruby>かい <ruby>部分<rt>ぶぶん</rt></ruby>を <ruby>考<rt>かんが</rt></ruby>えよう。", "Let us look at the whole first, then think about the details."]], "n": "全体的に = overall. Pair with 部分."}, {"w": "部分", "wf": "<ruby>部分<rt>ぶぶん</rt></ruby>", "r": "ぶぶん", "m": "part; portion", "p": "noun", "t": "noun", "d": 1, "ex": [["この <ruby>部分<rt>ぶぶん</rt></ruby>の <ruby>意味<rt>いみ</rt></ruby>が <ruby>分<rt>わ</rt></ruby>かりません。", "I do not understand the meaning of this part."], ["<ruby>壊<rt>こわ</rt></ruby>れた <ruby>部分<rt>ぶぶん</rt></ruby>だけ <ruby>交換<rt>こうかん</rt></ruby>した。", "We replaced only the broken part."], ["<ruby>大部分<rt>だいぶぶん</rt></ruby>の <ruby>人<rt>ひと</rt></ruby>が <ruby>賛成<rt>さんせい</rt></ruby>している。", "The majority of people are in favor."]], "n": "大部分 = the majority; 一部 (いちぶ) = a part / some."}, {"w": "結局", "wf": "<ruby>結局<rt>けっきょく</rt></ruby>", "r": "けっきょく", "m": "in the end; after all", "p": "adverb", "t": "adv", "d": 1, "ex": [["いろいろ <ruby>考<rt>かんが</rt></ruby>えたが、 <ruby>結局<rt>けっきょく</rt></ruby> <ruby>行<rt>い</rt></ruby>かないことにした。", "I thought about it a lot, but in the end I decided not to go."], ["<ruby>結局<rt>けっきょく</rt></ruby>、 <ruby>誰<rt>だれ</rt></ruby>も <ruby>来<rt>こ</rt></ruby>なかった。", "In the end, nobody came."], ["<ruby>結局<rt>けっきょく</rt></ruby>は <ruby>自分<rt>じぶん</rt></ruby>で <ruby>決<rt>き</rt></ruby>めるしかない。", "Ultimately you have to decide for yourself."]], "n": "Very common in speech. Often slightly resigned: after all that..."}, {"w": "つまり", "wf": "つまり", "r": "つまり", "m": "in other words; that is to say", "p": "conjunction", "t": "adv", "d": 1, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>私<rt>わたし</rt></ruby>の <ruby>母<rt>はは</rt></ruby>の <ruby>弟<rt>おとうと</rt></ruby>、つまりおじです。", "He is my mother's younger brother, in other words my uncle."], ["つまり、 <ruby>明日<rt>あした</rt></ruby>は <ruby>来<rt>こ</rt></ruby>られないということですね。", "So what you mean is you cannot come tomorrow, right?  / suru-verb", "t": "verb", "d": 2, "ex": [["<ruby>自分<rt>じぶん</rt></ruby>で <ruby>判断<rt>はんだん</rt></ruby>してください。", "Please judge for yourself."], ["<ruby>状況<rt>じょうきょう</rt></ruby>を <ruby>見<rt>み</rt></ruby>て、 <ruby>判断<rt>はんだん</rt></ruby>しましょう。", "Let us look at the situation and make a call."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>判断<rt>はんだん</rt></ruby>は <ruby>正<rt>ただ</rt></ruby>しかった。", "His judgment was correct."]], "n": "判断 = judgment call; 決定 = formal decision; 決める = everyday decide."}, {"w": "伝える", "wf": "<ruby>伝<rt>つた</rt></ruby>える", "r": "つたえる", "m": "to convey; to tell; to pass on", "p": "v1 transitive", "t": "verb", "d": 2, "ex": [["<ruby>田中<rt>たなか</rt></ruby>さんによろしく <ruby>伝<rt>つた</rt></ruby>えてください。", "Please give my regards to Tanaka-san."], ["<ruby>自分<rt>じぶん</rt></ruby>の <ruby>気持<rt>きも</rt></ruby>ちをうまく <ruby>伝<rt>つた</rt></ruby>えられなかった。", "I could not convey my feelings well."], ["この <ruby>伝統<rt>でんとう</rt></ruby>を <ruby>次<rt>つぎ</rt></ruby>の <ruby>世代<rt>せだい</rt></ruby>に <ruby>伝<rt>つた</rt></ruby>えたい。", "I want to pass this tradition on to the next generation."]], "n": "お伝えします = business: I will let them know. Pair: 伝わる (vi)."}, {"w": "伝わる", "wf": "<ruby>伝<rt>つた</rt></ruby>わる", "r": "つたわる", "m": "to be conveyed; to get across; to be handed down", "p": "v5 intransitive", "t": "verb", "d": 2, "ex": [["<ruby>私<rt>わたし</rt></ruby>の <ruby>気持<rt>きも</rt></ruby>ちが <ruby>彼<rt>かれ</rt></ruby>に <ruby>伝<rt>つた</rt></ruby>わった。", "My feelings got through to him."], ["<ruby>日本語<rt>にほんご</rt></ruby>が <ruby>下手<rt>へた</rt></ruby>でも、 <ruby>気持<rt>きも</rt></ruby>ちは <ruby>伝<rt>つた</rt></ruby>わります。", "Even if your Japanese is poor, your feelings get across."], ["この <ruby>祭<rt>まつ</rt></ruby>りは <ruby>三百年<rt>さんびゃくねん</rt></ruby> <ruby>前<rt>まえ</rt></ruby>から <ruby>伝<rt>つた</rt></ruby>わっている。", "This festival has been handed down for 300 years."]], "n": "Spoken: 伝わった？ = Did that make sense? Also physical: 音・熱が伝わる."}, {"w": "守る", "wf": "<ruby>守<rt>まも</rt></ruby>る", "r": "まもる", "m": "to protect; to keep (a promise, a rule)", "p": "v5 transitive", "t": "verb", "d": 2, "ex": [["<ruby>約束<rt>やくそく</rt></ruby>は <ruby>必<rt>かなら</rt></ruby>ず <ruby>守<rt>まも</rt></ruby>ります。", "I will definitely keep my promise."], ["ルールを <ruby>守<rt>まも</rt></ruby>らない <ruby>人<rt>ひと</rt></ruby>がいる。", "There are people who do not follow the rules."], ["<ruby>親<rt>おや</rt></ruby>は <ruby>子<rt>こ</rt></ruby>どもを <ruby>守<rt>まも</rt></ruby>るものだ。", "Parents are supposed to protect their children."]], "n": "Two senses: protect (人を守る) and keep/observe (時間を守る = be punctual). Opposite: 破る (やぶる)."}, {"w": "求める", "wf": "<ruby>求<rt>もと</rt></ruby>める", "r": "もとめる", "m": "to seek; to request; to want", "p": "v1 transitive", "t": "verb", "d": 2, "ex": [["<ruby>会社<rt>かいしゃ</rt></ruby>は <ruby>経験<rt>けいけん</rt></ruby>のある <ruby>人<rt>ひと</rt></ruby>を <ruby>求<rt>もと</rt></ruby>めている。", "The company is looking for experienced people."], ["<ruby>客<rt>きゃく</rt></ruby>は <ruby>店<rt>みせ</rt></ruby>に <ruby>説明<rt>せつめい</rt></ruby>を <ruby>求<rt>もと</rt></ruby>めた。", "The customer demanded an explanation from the shop."], ["<ruby>人<rt>ひと</rt></ruby>は <ruby>誰<rt>だれ</rt></ruby>でも <ruby>幸<rt>しあわ</rt></ruby>せを <ruby>求<rt>もと</rt></ruby>めている。", "Everyone seeks happiness."]], "n": "Formal. 求人 (きゅうじん) = job openings. Spoken: 欲しがる／探す."}, {"w": "与える", "wf": "<ruby>与<rt>あた</rt></ruby>える", "r": "あたえる", "m": "to give; to grant; to cause (influence, damage)", "p": "v1 transitive", "t": "verb", "d": 2, "ex": [["<ruby>先生<rt>せんせい</rt></ruby>は <ruby>学生<rt>がくせい</rt></ruby>に <ruby>宿題<rt>しゅくだい</rt></ruby>を <ruby>与<rt>あた</rt></ruby>えた。", "The teacher gave the students homework."], ["<ruby>台風<rt>たいふう</rt></ruby>は <ruby>農業<rt>のうぎょう</rt></ruby>に <ruby>大<rt>おお</rt></ruby>きな <ruby>被害<rt>ひがい</rt></ruby>を <ruby>与<rt>あた</rt></ruby>えた。", "The typhoon caused great damage to agriculture."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>話<rt>はなし</rt></ruby>はみんなにいい <ruby>印象<rt>いんしょう</rt></ruby>を <ruby>与<rt>あた</rt></ruby>えた。", "His talk gave everyone a good impression."]], "n": "Not everyday give (あげる); used with abstract objects. Very frequent in exam reading."}, {"w": "得る", "wf": "<ruby>得<rt>え</rt></ruby>る", "r": "える", "m": "to obtain; to gain", "p": "v1 transitive", "t": "verb", "d": 2, "ex": [["<ruby>旅行<rt>りょこう</rt></ruby>で <ruby>多<rt>おお</rt></ruby>くの <ruby>経験<rt>けいけん</rt></ruby>を <ruby>得<rt>え</rt></ruby>た。", "I gained a lot of experience through travel."], ["<ruby>情報<rt>じょうほう</rt></ruby>を <ruby>得<rt>え</rt></ruby>る <ruby>方法<rt>ほうほう</rt></ruby>はたくさんある。", "There are many ways to obtain information."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>協力<rt>きょうりょく</rt></ruby>を <ruby>得<rt>え</rt></ruby>て、 <ruby>仕事<rt>しごと</rt></ruby>が <ruby>早<rt>はや</rt></ruby>く <ruby>終<rt>お</rt></ruby>わった。", "With his cooperation, the work finished early."]], "n": "Also read うる in V-うる/える = can (あり得る = possible). Formal; spoken = 手に入れる／もらう."}, {"w": "含む", "wf": "<ruby>含<rt>ふく</rt></ruby>む", "r": "ふくむ", "m": "to include; to contain", "p": "v5 transitive", "t": "verb", "d": 2, "ex": [["この <ruby>値段<rt>ねだん</rt></ruby>は <ruby>税金<rt>ぜいきん</rt></ruby>を <ruby>含<rt>ふく</rt></ruby>んでいます。", "This price includes tax."], ["<ruby>参加者<rt>さんかしゃ</rt></ruby>は <ruby>私<rt>わたし</rt></ruby>を <ruby>含<rt>ふく</rt></ruby>めて <ruby>十人<rt>じゅうにん</rt></ruby>です。", "There are ten participants including me."], ["この <ruby>飲<rt>の</rt></ruby>み <ruby>物<rt>もの</rt></ruby>には <ruby>砂糖<rt>さとう</rt></ruby>がたくさん <ruby>含<rt>ふく</rt></ruby>まれている。", "This drink contains a lot of sugar."]], "n": "含めて (from 含める, vt) = including. 含まれる = is included. 税込 = tax included."}, {"w": "超える", "wf": "<ruby>超<rt>こ</rt></ruby>える", "r": "こえる", "m": "to exceed; to go over", "p": "v1 transitive", "t": "verb", "d": 2, "ex": [["<ruby>気温<rt>きおん</rt></ruby>が <ruby>三十五度<rt>さんじゅうごど</rt></ruby>を <ruby>超<rt>こ</rt></ruby>えた。", "The temperature exceeded 35 degrees."], ["<ruby>参加者<rt>さんかしゃ</rt></ruby>は <ruby>百人<rt>ひゃくにん</rt></ruby>を <ruby>超<rt>こ</rt></ruby>えるだろう。", "The participants will probably exceed 100 people."], ["<ruby>予算<rt>よさん</rt></ruby>を <ruby>超<rt>こ</rt></ruby>えないように <ruby>気<rt>き</rt></ruby>をつけている。", "I am being careful not to go over budget."]], "n": "超える = exceed a number/limit; 越える = cross a mountain/border. 超 (ちょう) as slang = super."}, {"w": "向かう", "wf": "<ruby>向<rt>む</rt></ruby>かう", "r": "むかう", "m": "to head toward; to face", "p": "v5 intransitive", "t": "verb", "d": 2, "ex": [["<ruby>今<rt>いま</rt></ruby>、 <ruby>駅<rt>えき</rt></ruby>に <ruby>向<rt>む</rt></ruby>かっています。", "I am heading to the station now."], ["<ruby>机<rt>つくえ</rt></ruby>に <ruby>向<rt>む</rt></ruby>かって <ruby>勉強<rt>べんきょう</rt></ruby>した。", "I sat at the desk and studied."], ["<ruby>病気<rt>びょうき</rt></ruby>は <ruby>良<rt>よ</rt></ruby>い <ruby>方向<rt>ほうこう</rt></ruby>に <ruby>向<rt>む</rt></ruby>かっている。", "The illness is heading in a good direction."]], "n": "向かっています = on my way (text message). Related: 向こう (over there), 向く (to face)."}, {"w": "過ごす", "wf": "<ruby>過<rt>す</rt></ruby>ごす", "r": "すごす", "m": "to spend (time); to pass", "p": "v5 transitive", "t": "verb", "d": 2, "ex": [["<ruby>週末<rt>しゅうまつ</rt></ruby>は <ruby>家族<rt>かぞく</rt></ruby>と <ruby>過<rt>す</rt></ruby>ごしました。", "I spent the weekend with my family."], ["<ruby>日本<rt>にほん</rt></ruby>で <ruby>三年間<rt>さんねんかん</rt></ruby> <ruby>過<rt>す</rt></ruby>ごした。", "I spent three years in Japan."], ["<ruby>楽<rt>たの</rt></ruby>しい <ruby>時間<rt>じかん</rt></ruby>をお <ruby>過<rt>す</rt></ruby>ごしください。", "Please have a pleasant time."]], "n": "Object is always time. 過ぎる (vi) = time passes. Spoken: どう過ごしてた？ = What have you been up to?"}, {"w": "環境", "wf": "<ruby>環境<rt>かんきょう</rt></ruby>", "r": "かんきょう", "m": "environment; surroundings", "p": "noun", "t": "noun", "d": 2, "ex": [["<ruby>環境<rt>かんきょう</rt></ruby>を <ruby>守<rt>まも</rt></ruby>るために、リサイクルをしている。", "I recycle in order to protect the environment."], ["<ruby>新<rt>あたら</rt></ruby>しい <ruby>環境<rt>かんきょう</rt></ruby>に <ruby>慣<rt>な</rt></ruby>れるまで <ruby>時間<rt>じかん</rt></ruby>がかかった。", "It took time to get used to the new environment."], ["<ruby>子<rt>こ</rt></ruby>どもにはいい <ruby>環境<rt>かんきょう</rt></ruby>で <ruby>育<rt>そだ</rt></ruby>ってほしい。", "I want my child to grow up in a good environment."]], "n": "Natural environment and also surroundings/setting. Reading かんきょう."}, {"w": "効果", "wf": "<ruby>効果<rt>こうか</rt></ruby>", "r": "こうか", "m": "effect; effectiveness", "p": "noun", "t": "noun", "d": 2, "ex": [["この <ruby>薬<rt>くすり</rt></ruby>は <ruby>効果<rt>こうか</rt></ruby>がある。", "This medicine is effective."], ["<ruby>運動<rt>うんどう</rt></ruby>の <ruby>効果<rt>こうか</rt></ruby>が <ruby>出<rt>で</rt></ruby>てきた。", "The effects of exercise are starting to show."], ["<ruby>効果的<rt>こうかてき</rt></ruby>な <ruby>勉強<rt>べんきょう</rt></ruby> <ruby>方法<rt>ほうほう</rt></ruby>を <ruby>探<rt>さが</rt></ruby>している。", "I am looking for an effective study method."]], "n": "効果 = effect of a thing (medicine, method); 影響 = influence on something. Verb: 効く (きく)."}, {"w": "条件", "wf": "<ruby>条件<rt>じょうけん</rt></ruby>", "r": "じょうけん", "m": "condition; terms", "p": "noun", "t": "noun", "d": 2, "ex": [["この <ruby>仕事<rt>しごと</rt></ruby>の <ruby>条件<rt>じょうけん</rt></ruby>は <ruby>悪<rt>わる</rt></ruby>くない。", "The conditions of this job are not bad."], ["<ruby>条件<rt>じょうけん</rt></ruby>に <ruby>合<rt>あ</rt></ruby>うアパートが <ruby>見<rt>み</rt></ruby>つからない。", "I cannot find an apartment that meets my conditions."], ["<ruby>三<rt>みっ</rt></ruby>つの <ruby>条件<rt>じょうけん</rt></ruby>を <ruby>満<rt>み</rt></ruby>たす <ruby>必要<rt>ひつよう</rt></ruby>がある。", "Three conditions need to be met."]], "n": "条件を満たす = meet the conditions. 無条件 = unconditional."}, {"w": "責任", "wf": "<ruby>責任<rt>せきにん</rt></ruby>", "r": "せきにん", "m": "responsibility", "p": "noun", "t": "noun", "d": 2, "ex": [["<ruby>自分<rt>じぶん</rt></ruby>の <ruby>行動<rt>こうどう</rt></ruby>に <ruby>責任<rt>せきにん</rt></ruby>を <ruby>持<rt>も</rt></ruby>ってください。", "Please take responsibility for your actions."], ["この <ruby>失敗<rt>しっぱい</rt></ruby>の <ruby>責任<rt>せきにん</rt></ruby>は <ruby>私<rt>わたし</rt></ruby>にあります。", "The responsibility for this failure lies with me."], ["<ruby>責任感<rt>せきにんかん</rt></ruby>の <ruby>強<rt>つよ</rt></ruby>い <ruby>人<rt>ひと</rt></ruby>だ。", "He is a person with a strong sense of responsibility."]], "n": "責任を取る = take responsibility (resign etc). 責任感 = sense of responsibility."}, {"w": "状態", "wf": "<ruby>状態<rt>じょうたい</rt></ruby>", "r": "じょうたい", "m": "state; condition", "p": "noun", "t": "noun", "d": 2, "ex": [["<ruby>患者<rt>かんじゃ</rt></ruby>の <ruby>状態<rt>じょうたい</rt></ruby>は <ruby>良<rt>よ</rt></ruby>くなってきた。", "The patient's condition has been improving."], ["この <ruby>中古車<rt>ちゅうこしゃ</rt></ruby>は <ruby>状態<rt>じょうたい</rt></ruby>がいい。", "This used car is in good condition."], ["<ruby>疲<rt>つか</rt></ruby>れて、 <ruby>何<rt>なに</rt></ruby>も <ruby>考<rt>かんが</rt></ruby>えられない <ruby>状態<rt>じょうたい</rt></ruby>だった。", "I was so tired I was in a state where I could not think."]], "n": "状態 = condition of a thing/person; 状況 = surrounding circumstances. 健康状態 = state of health."}, {"w": "印象", "wf": "<ruby>印象<rt>いんしょう</rt></ruby>", "r": "いんしょう", "m": "impression", "p": "noun", "t": "noun", "d": 2, "ex": [["<ruby>彼<rt>かれ</rt></ruby>の <ruby>第一<rt>だいいち</rt></ruby> <ruby>印象<rt>いんしょう</rt></ruby>はとても <ruby>良<rt>よ</rt></ruby>かった。", "My first impression of him was very good."], ["この <ruby>映画<rt>えいが</rt></ruby>は <ruby>強<rt>つよ</rt></ruby>く <ruby>印象<rt>いんしょう</rt></ruby>に <ruby>残<rt>のこ</rt></ruby>った。", "This film left a strong impression on me."], ["<ruby>日本人<rt>にほんじん</rt></ruby>は <ruby>親切<rt>しんせつ</rt></ruby>だという <ruby>印象<rt>いんしょう</rt></ruby>を <ruby>受<rt>う</rt></ruby>けた。", "I got the impression that Japanese people are kind."]], "n": "印象に残る = memorable. 第一印象 = first impression."}, {"w": "性格", "wf": "<ruby>性格<rt>せいかく</rt></ruby>", "r": "せいかく", "m": "personality; character", "p": "noun", "t": "noun", "d": 2, "ex": [["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>明<rt>あか</rt></ruby>るい <ruby>性格<rt>せいかく</rt></ruby>だ。", "She has a cheerful personality."], ["<ruby>兄弟<rt>きょうだい</rt></ruby>でも <ruby>性格<rt>せいかく</rt></ruby>は <ruby>全然<rt>ぜんぜん</rt></ruby> <ruby>違<rt>ちが</rt></ruby>う。", "Even siblings have totally different personalities."], ["<ruby>性格<rt>せいかく</rt></ruby>が <ruby>合<rt>あ</rt></ruby>わなくて、 <ruby>別<rt>わか</rt></ruby>れた。", "We broke up because our personalities did not match."]], "n": "Homophone trap: 性格 (personality, noun) vs 正確 (accurate, na-adj)."}, {"w": "態度", "wf": "<ruby>態度<rt>たいど</rt></ruby>", "r": "たいど", "m": "attitude; manner", "p": "noun", "t": "noun", "d": 2, "ex": [["<ruby>彼<rt>かれ</rt></ruby>の <ruby>態度<rt>たいど</rt></ruby>は <ruby>失礼<rt>しつれい</rt></ruby>だった。", "His attitude was rude."], ["<ruby>店員<rt>てんいん</rt></ruby>の <ruby>態度<rt>たいど</rt></ruby>が <ruby>良<rt>よ</rt></ruby>かったので、また <ruby>行<rt>い</rt></ruby>きたい。", "The staff's manner was good, so I want to go again."], ["<ruby>態度<rt>たいど</rt></ruby>を <ruby>改<rt>あらた</rt></ruby>めなさい。", "Change your attitude."]], "n": "態度が大きい = arrogant. 態度を改める = change one's attitude."}, {"w": "価値", "wf": "<ruby>価値<rt>かち</rt></ruby>", "r": "かち", "m": "value; worth", "p": "noun", "t": "noun", "d": 2, "ex": [["この <ruby>絵<rt>え</rt></ruby>には <ruby>高<rt>たか</rt></ruby>い <ruby>価値<rt>かち</rt></ruby>がある。", "This painting has high value."], ["<ruby>読<rt>よ</rt></ruby>む <ruby>価値<rt>かち</rt></ruby>のある <ruby>本<rt>ほん</rt></ruby>だ。", "It is a book worth reading."], ["お <ruby>金<rt>かね</rt></ruby>の <ruby>価値<rt>かち</rt></ruby>が <ruby>下<rt>さ</rt></ruby>がっている。", "The value of money is falling."]], "n": "V-る価値がある = worth V-ing (N3). 価値観 = values / worldview."}, {"w": "資料", "wf": "<ruby>資料<rt>しりょう</rt></ruby>", "r": "しりょう", "m": "materials; documents; data", "p": "noun", "t": "noun", "d": 2, "ex": [["<ruby>会議<rt>かいぎ</rt></ruby>の <ruby>資料<rt>しりょう</rt></ruby>を <ruby>準備<rt>じゅんび</rt></ruby>した。", "I prepared the materials for the meeting."], ["この <ruby>資料<rt>しりょう</rt></ruby>を <ruby>見<rt>み</rt></ruby>ながら <ruby>説明<rt>せつめい</rt></ruby>します。", "I will explain while looking at this document."], ["<ruby>図書館<rt>としょかん</rt></ruby>で <ruby>歴史<rt>れきし</rt></ruby>の <ruby>資料<rt>しりょう</rt></ruby>を <ruby>調<rt>しら</rt></ruby>べた。", "I researched historical materials at the library."]], "n": "資料 = handouts/reference docs; 書類 (しょるい) = official paperwork; データ = data."}, {"w": "締め切り", "wf": "<ruby>締<rt>し</rt></ruby>め <ruby>切<rt>き</rt></ruby>り", "r": "しめきり", "m": "deadline", "p": "noun", "t": "noun", "d": 3, "ex": [["レポートの <ruby>締<rt>し</rt></ruby>め <ruby>切<rt>き</rt></ruby>りは <ruby>金曜日<rt>きんようび</rt></ruby>です。", "The report's deadline is Friday."], ["<ruby>締<rt>し</rt></ruby>め <ruby>切<rt>き</rt></ruby>りに <ruby>間<rt>ま</rt></ruby>に <ruby>合<rt>あ</rt></ruby>わなかった。", "I did not make the deadline."], ["<ruby>申<rt>もう</rt></ruby>し <ruby>込<rt>こ</rt></ruby>みの <ruby>締<rt>し</rt></ruby>め <ruby>切<rt>き</rt></ruby>りが <ruby>近<rt>ちか</rt></ruby>い。", "The application deadline is near."]], "n": "Often written 締切 or 〆切 on notices. Verb: 締め切る = to close (applications)."}, {"w": "機会", "wf": "<ruby>機会<rt>きかい</rt></ruby>", "r": "きかい", "m": "opportunity; chance", "p": "noun", "t": "noun", "d": 3, "ex": [["<ruby>日本語<rt>にほんご</rt></ruby>を <ruby>話<rt>はな</rt></ruby>す <ruby>機会<rt>きかい</rt></ruby>があまりない。", "I do not have many opportunities to speak Japanese."], ["また <ruby>機会<rt>きかい</rt></ruby>があれば、ぜひ <ruby>行<rt>い</rt></ruby>きたい。", "If there is another chance, I would love to go."], ["この <ruby>機会<rt>きかい</rt></ruby>に、 <ruby>新<rt>あたら</rt></ruby>しいことに <ruby>挑戦<rt>ちょうせん</rt></ruby>してみよう。", "Let us take this opportunity to try something new."]], "n": "Homophone: 機械 (machine). チャンス is the casual version. この機会に = on this occasion."}, {"w": "能力", "wf": "<ruby>能力<rt>のうりょく</rt></ruby>", "r": "のうりょく", "m": "ability; capability", "p": "noun", "t": "noun", "d": 3, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>高<rt>たか</rt></ruby>い <ruby>能力<rt>のうりょく</rt></ruby>を <ruby>持<rt>も</rt></ruby>っている。", "He has high ability."], ["<ruby>日本語<rt>にほんご</rt></ruby> <ruby>能力<rt>のうりょく</rt></ruby> <ruby>試験<rt>しけん</rt></ruby>を <ruby>受<rt>う</rt></ruby>ける。", "I am taking the Japanese Language Proficiency Test."], ["<ruby>自分<rt>じぶん</rt></ruby>の <ruby>能力<rt>のうりょく</rt></ruby>を <ruby>生<rt>い</rt></ruby>かせる <ruby>仕事<rt>しごと</rt></ruby>がしたい。", "I want a job where I can use my abilities."]], "n": "In the exam name: 日本語能力試験. 能力を生かす = make use of one's abilities."}, {"w": "知識", "wf": "<ruby>知識<rt>ちしき</rt></ruby>", "r": "ちしき", "m": "knowledge", "p": "noun", "t": "noun", "d": 3, "ex": [["<ruby>彼<rt>かれ</rt></ruby>はコンピューターの <ruby>知識<rt>ちしき</rt></ruby>が <ruby>豊富<rt>ほうふ</rt></ruby>だ。", "He has abundant knowledge of computers."], ["この <ruby>仕事<rt>しごと</rt></ruby>には <ruby>専門<rt>せんもん</rt></ruby>の <ruby>知識<rt>ちしき</rt></ruby>が <ruby>必要<rt>ひつよう</rt></ruby>だ。", "This job requires specialist knowledge."], ["<ruby>本<rt>ほん</rt></ruby>を <ruby>読<rt>よ</rt></ruby>んで <ruby>知識<rt>ちしき</rt></ruby>を <ruby>増<rt>ふ</rt></ruby>やした。", "I increased my knowledge by reading books."]], "n": "知識 = knowledge; 常識 (じょうしき) = common sense; 意識 (いしき) = awareness. All three on N3."}, {"w": "周り", "wf": "<ruby>周<rt>まわ</rt></ruby>り", "r": "まわり", "m": "surroundings; around; the people around one", "p": "noun", "t": "noun", "d": 3, "ex": [["<ruby>周<rt>まわ</rt></ruby>りの <ruby>人<rt>ひと</rt></ruby>に <ruby>迷惑<rt>めいわく</rt></ruby>をかけないでください。", "Please do not bother the people around you."], ["<ruby>駅<rt>えき</rt></ruby>の <ruby>周<rt>まわ</rt></ruby>りには <ruby>店<rt>みせ</rt></ruby>が <ruby>多<rt>おお</rt></ruby>い。", "There are many shops around the station."], ["<ruby>周<rt>まわ</rt></ruby>りを <ruby>気<rt>き</rt></ruby>にしすぎない <ruby>方<rt>ほう</rt></ruby>がいい。", "It is better not to worry too much about what others think."]], "n": "周り = surroundings/people around; 回り (same reading) = rotation. 身の回り = personal belongings."}, {"w": "参加", "wf": "<ruby>参加<rt>さんか</rt></ruby>", "r": "さんか", "m": "participation", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>来週<rt>らいしゅう</rt></ruby>のセミナーに <ruby>参加<rt>さんか</rt></ruby>します。", "I will participate in next week's seminar."], ["<ruby>参加者<rt>さんかしゃ</rt></ruby>は <ruby>五十人<rt>ごじゅうにん</rt></ruby>を <ruby>超<rt>こ</rt></ruby>えた。", "Participants exceeded 50."], ["<ruby>誰<rt>だれ</rt></ruby>でも <ruby>自由<rt>じゆう</rt></ruby>に <ruby>参加<rt>さんか</rt></ruby>できます。", "Anyone can join freely."]], "n": "Takes に. 出席 = attendance (being present); 参加 = taking part."}, {"w": "発表", "wf": "<ruby>発表<rt>はっぴょう</rt></ruby>", "r": "はっぴょう", "m": "announcement; presentation", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>明日<rt>あした</rt></ruby>、クラスで <ruby>研究<rt>けんきゅう</rt></ruby>の <ruby>発表<rt>はっぴょう</rt></ruby>をします。", "Tomorrow I will give a presentation on my research in class."], ["<ruby>合格<rt>ごうかく</rt></ruby> <ruby>発表<rt>はっぴょう</rt></ruby>は <ruby>一月<rt>いちがつ</rt></ruby> <ruby>末<rt>まつ</rt></ruby>です。", "Results are announced at the end of January."], ["<ruby>新<rt>あたら</rt></ruby>しい <ruby>製品<rt>せいひん</rt></ruby>が <ruby>発表<rt>はっぴょう</rt></ruby>された。", "A new product was announced."]], "n": "Reading はっぴょう. Covers both announce and present (give a talk)."}, {"w": "相談", "wf": "<ruby>相談<rt>そうだん</rt></ruby>", "r": "そうだん", "m": "consultation; talking something over", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>進路<rt>しんろ</rt></ruby>について <ruby>先生<rt>せんせい</rt></ruby>に <ruby>相談<rt>そうだん</rt></ruby>した。", "I consulted my teacher about my future path."], ["<ruby>困<rt>こま</rt></ruby>ったときは、いつでも <ruby>相談<rt>そうだん</rt></ruby>してください。", "When you are in trouble, feel free to talk to me anytime."], ["<ruby>家族<rt>かぞく</rt></ruby>と <ruby>相談<rt>そうだん</rt></ruby>して <ruby>決<rt>き</rt></ruby>めます。", "I will decide after talking it over with my family."]], "n": "Both に (consult someone) and と (discuss with). 相談に乗る = lend an ear / give advice."}, {"w": "期待", "wf": "<ruby>期待<rt>きたい</rt></ruby>", "r": "きたい", "m": "expectation; anticipation; hope", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>新<rt>あたら</rt></ruby>しい <ruby>社員<rt>しゃいん</rt></ruby>に <ruby>期待<rt>きたい</rt></ruby>している。", "I have high hopes for the new employee."], ["<ruby>期待<rt>きたい</rt></ruby>していた <ruby>映画<rt>えいが</rt></ruby>がつまらなかった。", "The film I had been looking forward to was boring."], ["<ruby>親<rt>おや</rt></ruby>の <ruby>期待<rt>きたい</rt></ruby>に <ruby>応<rt>こた</rt></ruby>えたい。", "I want to live up to my parents' expectations."]], "n": "Positive expectation (hope). 予想 = neutral prediction. 期待に応える／裏切る = meet / betray expectations."}, {"w": "努力", "wf": "<ruby>努力<rt>どりょく</rt></ruby>", "r": "どりょく", "m": "effort", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>合格<rt>ごうかく</rt></ruby>するために、 <ruby>毎日<rt>まいにち</rt></ruby> <ruby>努力<rt>どりょく</rt></ruby>している。", "I am making an effort every day to pass."], ["<ruby>努力<rt>どりょく</rt></ruby>しても、うまくいかないこともある。", "Even if you try hard, things do not always go well."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>努力<rt>どりょく</rt></ruby>は <ruby>無駄<rt>むだ</rt></ruby>にならなかった。", "His efforts were not in vain."]], "n": "努力家 = hard worker. Spoken: 頑張る. 無駄になる = go to waste."}, {"w": "協力", "wf": "<ruby>協力<rt>きょうりょく</rt></ruby>", "r": "きょうりょく", "m": "cooperation", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["みんなで <ruby>協力<rt>きょうりょく</rt></ruby>して、 <ruby>問題<rt>もんだい</rt></ruby>を <ruby>解決<rt>かいけつ</rt></ruby>した。", "We all cooperated and solved the problem."], ["ご <ruby>協力<rt>きょうりょく</rt></ruby>ありがとうございました。", "Thank you for your cooperation."], ["<ruby>同僚<rt>どうりょう</rt></ruby>の <ruby>協力<rt>きょうりょく</rt></ruby>がなければ、 <ruby>終<rt>お</rt></ruby>わらなかった。", "Without my colleagues' help, it would not have gotten done."]], "n": "ご協力お願いします = standard announcement phrase. Reading きょうりょく."}, {"w": "我慢", "wf": "<ruby>我慢<rt>がまん</rt></ruby>", "r": "がまん", "m": "patience; endurance; putting up with", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>痛<rt>いた</rt></ruby>かったが、 <ruby>我慢<rt>がまん</rt></ruby>した。", "It hurt, but I put up with it."], ["<ruby>甘<rt>あま</rt></ruby>い <ruby>物<rt>もの</rt></ruby>を <ruby>我慢<rt>がまん</rt></ruby>するのは <ruby>難<rt>むずか</rt></ruby>しい。", "Holding back from sweets is difficult."], ["もう <ruby>我慢<rt>がまん</rt></ruby>できない。", "I cannot take it anymore."]], "n": "Core cultural word. 我慢強い = patient/tough. Spoken: 我慢して！ = Bear with it."}, {"w": "注目", "wf": "<ruby>注目<rt>ちゅうもく</rt></ruby>", "r": "ちゅうもく", "m": "attention; notice", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>彼<rt>かれ</rt></ruby>の <ruby>新<rt>あたら</rt></ruby>しい <ruby>映画<rt>えいが</rt></ruby>が <ruby>注目<rt>ちゅうもく</rt></ruby>されている。", "His new film is attracting attention."], ["<ruby>皆<rt>みな</rt></ruby>さん、こちらに <ruby>注目<rt>ちゅうもく</rt></ruby>してください。", "Everyone, please look this way."], ["<ruby>今<rt>いま</rt></ruby> <ruby>最<rt>もっと</rt></ruby>も <ruby>注目<rt>ちゅうもく</rt></ruby>を <ruby>集<rt>あつ</rt></ruby>めている <ruby>選手<rt>せんしゅ</rt></ruby>だ。", "He is the player getting the most attention right now."]], "n": "注目 = attention (looking at); 注意 = caution/warning. 注目を集める = draw attention."}, {"w": "提出", "wf": "<ruby>提出<rt>ていしゅつ</rt></ruby>", "r": "ていしゅつ", "m": "submission; handing in", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["レポートを <ruby>明日<rt>あした</rt></ruby>までに <ruby>提出<rt>ていしゅつ</rt></ruby>してください。", "Please submit the report by tomorrow."], ["<ruby>書類<rt>しょるい</rt></ruby>の <ruby>提出<rt>ていしゅつ</rt></ruby> <ruby>期限<rt>きげん</rt></ruby>は <ruby>今週<rt>こんしゅう</rt></ruby>の <ruby>金曜日<rt>きんようび</rt></ruby>です。", "The document submission deadline is this Friday."], ["<ruby>提出<rt>ていしゅつ</rt></ruby>した <ruby>書類<rt>しょるい</rt></ruby>に <ruby>間違<rt>まちが</rt></ruby>いがあった。", "There was a mistake in the documents I submitted."]], "n": "Pairs with 締め切り and 期限 (きげん). 出す (casual) = 提出する (formal)."}, {"w": "予想", "wf": "<ruby>予想<rt>よそう</rt></ruby>", "r": "よそう", "m": "prediction; expectation", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>試験<rt>しけん</rt></ruby>は <ruby>予想<rt>よそう</rt></ruby>より <ruby>簡単<rt>かんたん</rt></ruby>だった。", "The exam was easier than expected."], ["<ruby>明日<rt>あした</rt></ruby>の <ruby>天気<rt>てんき</rt></ruby>は <ruby>予想<rt>よそう</rt></ruby>が <ruby>難<rt>むずか</rt></ruby>しい。", "Tomorrow's weather is hard to predict."], ["<ruby>予想<rt>よそう</rt></ruby> <ruby>通<rt>どお</rt></ruby>り、 <ruby>彼<rt>かれ</rt></ruby>が <ruby>優勝<rt>ゆうしょう</rt></ruby>した。", "As expected, he won the championship."]], "n": "予想通り = as predicted; 予想外 = unexpected. Neutral, unlike 期待 (hope)."}, {"w": "想像", "wf": "<ruby>想像<rt>そうぞう</rt></ruby>", "r": "そうぞう", "m": "imagination", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>十年<rt>じゅうねん</rt></ruby> <ruby>後<rt>ご</rt></ruby>の <ruby>自分<rt>じぶん</rt></ruby>を <ruby>想像<rt>そうぞう</rt></ruby>してみた。", "I tried imagining myself ten years from now."], ["<ruby>想像<rt>そうぞう</rt></ruby>していたより、ずっと <ruby>大変<rt>たいへん</rt></ruby>だった。", "It was far harder than I had imagined."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>気持<rt>きも</rt></ruby>ちは <ruby>想像<rt>そうぞう</rt></ruby>できる。", "I can imagine how he feels."]], "n": "Homophone: 創造 (creation). 想像力 = imagination (the faculty)."}, {"w": "成功", "wf": "<ruby>成功<rt>せいこう</rt></ruby>", "r": "せいこう", "m": "success", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>新<rt>あたら</rt></ruby>しい <ruby>商品<rt>しょうひん</rt></ruby>は <ruby>成功<rt>せいこう</rt></ruby>した。", "The new product was a success."], ["<ruby>成功<rt>せいこう</rt></ruby>するには <ruby>失敗<rt>しっぱい</rt></ruby>から <ruby>学<rt>まな</rt></ruby>ぶことが <ruby>必要<rt>ひつよう</rt></ruby>だ。", "To succeed, you need to learn from failure."], ["<ruby>手術<rt>しゅじゅつ</rt></ruby>は <ruby>成功<rt>せいこう</rt></ruby>した。", "The surgery was successful."]], "n": "Pair: 成功 ↔ 失敗. 実験に成功した = succeeded in the experiment (に)."}, {"w": "完成", "wf": "<ruby>完成<rt>かんせい</rt></ruby>", "r": "かんせい", "m": "completion", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>新<rt>あたら</rt></ruby>しい <ruby>駅<rt>えき</rt></ruby>が <ruby>来年<rt>らいねん</rt></ruby> <ruby>完成<rt>かんせい</rt></ruby>する <ruby>予定<rt>よてい</rt></ruby>だ。", "The new station is scheduled to be completed next year."], ["やっとレポートが <ruby>完成<rt>かんせい</rt></ruby>した。", "The report is finally finished."], ["この <ruby>作品<rt>さくひん</rt></ruby>は <ruby>完成<rt>かんせい</rt></ruby>まで <ruby>三年<rt>さんねん</rt></ruby>かかった。", "This work took three years to complete."]], "n": "Intransitive: it gets completed. For I completed it, use 完成させる. 未完成 = unfinished."}, {"w": "感謝", "wf": "<ruby>感謝<rt>かんしゃ</rt></ruby>", "r": "かんしゃ", "m": "gratitude; thanks", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>助<rt>たす</rt></ruby>けてくれた <ruby>友達<rt>ともだち</rt></ruby>に <ruby>感謝<rt>かんしゃ</rt></ruby>している。", "I am grateful to the friend who helped me."], ["<ruby>感謝<rt>かんしゃ</rt></ruby>の <ruby>気持<rt>きも</rt></ruby>ちを <ruby>手紙<rt>てがみ</rt></ruby>で <ruby>伝<rt>つた</rt></ruby>えた。", "I expressed my gratitude in a letter."], ["<ruby>皆<rt>みな</rt></ruby>さんに <ruby>心<rt>こころ</rt></ruby>から <ruby>感謝<rt>かんしゃ</rt></ruby>します。", "I thank you all from my heart."]], "n": "Formal; spoken = ありがたい／ありがとう. 感謝の気持ち = feeling of gratitude (speech staple)."}, {"w": "感動", "wf": "<ruby>感動<rt>かんどう</rt></ruby>", "r": "かんどう", "m": "being deeply moved; emotion", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["その <ruby>映画<rt>えいが</rt></ruby>を <ruby>見<rt>み</rt></ruby>て、 <ruby>感動<rt>かんどう</rt></ruby>して <ruby>泣<rt>な</rt></ruby>いた。", "I watched that film and cried, I was so moved."], ["<ruby>彼女<rt>かのじょ</rt></ruby>の <ruby>歌<rt>うた</rt></ruby>に <ruby>感動<rt>かんどう</rt></ruby>した。", "I was moved by her singing."], ["<ruby>感動的<rt>かんどうてき</rt></ruby>な <ruby>話<rt>はなし</rt></ruby>だった。", "It was a moving story."]], "n": "Takes に. Spoken: 感動した！ = That was moving / amazing."}, {"w": "経験", "wf": "<ruby>経験<rt>けいけん</rt></ruby>", "r": "けいけん", "m": "experience", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>日本<rt>にほん</rt></ruby>で <ruby>働<rt>はたら</rt></ruby>いた <ruby>経験<rt>けいけん</rt></ruby>がある。", "I have experience working in Japan."], ["<ruby>失敗<rt>しっぱい</rt></ruby>もいい <ruby>経験<rt>けいけん</rt></ruby>になる。", "Even failure becomes a good experience."], ["いろいろなことを <ruby>経験<rt>けいけん</rt></ruby>した <ruby>方<rt>ほう</rt></ruby>がいい。", "It is better to experience many things."]], "n": "経験を積む = build up experience. 経験者 = experienced person. 実務経験 = work experience."}, {"w": "解決", "wf": "<ruby>解決<rt>かいけつ</rt></ruby>", "r": "かいけつ", "m": "solution; resolution", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["<ruby>問題<rt>もんだい</rt></ruby>はまだ <ruby>解決<rt>かいけつ</rt></ruby>していない。", "The problem has not been resolved yet."], ["<ruby>話<rt>はな</rt></ruby>し <ruby>合<rt>あ</rt></ruby>いで <ruby>解決<rt>かいけつ</rt></ruby>しよう。", "Let us solve it by talking."], ["<ruby>早<rt>はや</rt></ruby>く <ruby>解決策<rt>かいけつさく</rt></ruby>を <ruby>見<rt>み</rt></ruby>つける <ruby>必要<rt>ひつよう</rt></ruby>がある。", "We need to find a solution quickly."]], "n": "Both 問題を解決する (solve) and 問題が解決する (be solved). 解決策 = a solution."}, {"w": "集中", "wf": "<ruby>集中<rt>しゅうちゅう</rt></ruby>", "r": "しゅうちゅう", "m": "concentration; focus", "p": "noun / suru-verb", "t": "verb", "d": 3, "ex": [["うるさくて、 <ruby>勉強<rt>べんきょう</rt></ruby>に <ruby>集中<rt>しゅうちゅう</rt></ruby>できない。", "It is noisy and I cannot concentrate on studying."], ["<ruby>人口<rt>じんこう</rt></ruby>が <ruby>都市<rt>とし</rt></ruby>に <ruby>集中<rt>しゅうちゅう</rt></ruby>している。", "The population is concentrated in the cities."], ["<ruby>集中力<rt>しゅうちゅうりょく</rt></ruby>が <ruby>続<rt>つづ</rt></ruby>かない。", "I cannot keep my concentration going."]], "n": "Takes に. 集中力 = concentration (ability). 集中講義 = intensive course."}, {"w": "迷う", "wf": "<ruby>迷<rt>まよ</rt></ruby>う", "r": "まよう", "m": "to be lost; to hesitate; to be unable to decide", "p": "v5 intransitive", "t": "verb", "d": 3, "ex": [["<ruby>道<rt>みち</rt></ruby>に <ruby>迷<rt>まよ</rt></ruby>って、 <ruby>遅<rt>おく</rt></ruby>れてしまった。", "I got lost and ended up being late."], ["どちらを <ruby>買<rt>か</rt></ruby>うか <ruby>迷<rt>まよ</rt></ruby>っている。", "I cannot decide which one to buy."], ["<ruby>迷<rt>まよ</rt></ruby>ったら、いつでも <ruby>聞<rt>き</rt></ruby>いてください。", "If you are unsure, ask anytime."]], "n": "Lost (道に迷う) and undecided (〜か迷う). 迷子 (まいご) = lost child. 迷惑 (めいわく) is a different word."}, {"w": "悩む", "wf": "<ruby>悩<rt>なや</rt></ruby>む", "r": "なやむ", "m": "to worry; to be troubled; to agonize over", "p": "v5 intransitive", "t": "verb", "d": 3, "ex": [["<ruby>将来<rt>しょうらい</rt></ruby>のことで <ruby>悩<rt>なや</rt></ruby>んでいる。", "I am worried about the future."], ["<ruby>一人<rt>ひとり</rt></ruby>で <ruby>悩<rt>なや</rt></ruby>まないで、 <ruby>相談<rt>そうだん</rt></ruby>してください。", "Do not agonize alone; talk to someone."], ["<ruby>何<rt>なに</rt></ruby>を <ruby>食<rt>た</rt></ruby>べるか <ruby>悩<rt>なや</rt></ruby>むほどメニューが <ruby>多<rt>おお</rt></ruby>い。", "The menu is so big that choosing what to eat is a struggle."]], "n": "悩む = ongoing inner worry; 心配する = worry about someone/something. Noun: 悩み."}, {"w": "断る", "wf": "<ruby>断<rt>ことわ</rt></ruby>る", "r": "ことわる", "m": "to refuse; to decline", "p": "v5 transitive", "t": "verb", "d": 4, "ex": [["<ruby>上司<rt>じょうし</rt></ruby>の <ruby>誘<rt>さそ</rt></ruby>いを <ruby>断<rt>ことわ</rt></ruby>るのは <ruby>難<rt>むずか</rt></ruby>しい。", "It is hard to turn down the boss's invitation."], ["<ruby>忙<rt>いそが</rt></ruby>しかったので、その <ruby>仕事<rt>しごと</rt></ruby>は <ruby>断<rt>ことわ</rt></ruby>った。", "I was busy, so I declined that job."], ["はっきり <ruby>断<rt>ことわ</rt></ruby>った <ruby>方<rt>ほう</rt></ruby>がいい。", "It is better to refuse clearly."]], "n": "Also: 断りもなく = without notice/permission. お断り = no thank you (sign: 勧誘お断り)."}, {"w": "頼る", "wf": "<ruby>頼<rt>たよ</rt></ruby>る", "r": "たよる", "m": "to rely on; to depend on", "p": "v5 intransitive", "t": "verb", "d": 4, "ex": [["<ruby>困<rt>こま</rt></ruby>ったときは、 <ruby>家族<rt>かぞく</rt></ruby>に <ruby>頼<rt>たよ</rt></ruby>っている。", "When in trouble, I rely on my family."], ["<ruby>人<rt>ひと</rt></ruby>に <ruby>頼<rt>たよ</rt></ruby>らないで、 <ruby>自分<rt>じぶん</rt></ruby>でやってみよう。", "Let us try doing it ourselves without relying on others."], ["<ruby>地図<rt>ちず</rt></ruby>に <ruby>頼<rt>たよ</rt></ruby>らず、 <ruby>道<rt>みち</rt></ruby>を <ruby>覚<rt>おぼ</rt></ruby>えた。", "I memorized the route without depending on a map."]], "n": "Takes に. 頼む (N4) = ask; 頼る = rely. 頼りになる = dependable."}, {"w": "信じる", "wf": "<ruby>信<rt>しん</rt></ruby>じる", "r": "しんじる", "m": "to believe; to trust", "p": "v1 transitive", "t": "verb", "d": 4, "ex": [["<ruby>彼<rt>かれ</rt></ruby>の <ruby>話<rt>はなし</rt></ruby>を <ruby>信<rt>しん</rt></ruby>じますか。", "Do you believe his story?"], ["<ruby>自分<rt>じぶん</rt></ruby>を <ruby>信<rt>しん</rt></ruby>じて、 <ruby>頑張<rt>がんば</rt></ruby>ってください。", "Believe in yourself and do your best."], ["<ruby>信<rt>しん</rt></ruby>じられないほど <ruby>美<rt>うつく</rt></ruby>しい <ruby>景色<rt>けしき</rt></ruby>だった。", "The scenery was unbelievably beautiful."]], "n": "Spoken: 信じらんない！ = Unbelievable! Noun: 信用 (しんよう) = trust."}, {"w": "疑う", "wf": "<ruby>疑<rt>うたが</rt></ruby>う", "r": "うたがう", "m": "to doubt; to suspect", "p": "v5 transitive", "t": "verb", "d": 4, "ex": [["<ruby>彼<rt>かれ</rt></ruby>がうそをついていると <ruby>疑<rt>うたが</rt></ruby>っている。", "I suspect he is lying."], ["<ruby>自分<rt>じぶん</rt></ruby>の <ruby>目<rt>め</rt></ruby>を <ruby>疑<rt>うたが</rt></ruby>った。", "I doubted my own eyes."], ["<ruby>友達<rt>ともだち</rt></ruby>を <ruby>疑<rt>うたが</rt></ruby>いたくない。", "I do not want to doubt my friend."]], "n": "Opposite of 信じる. 疑問 (ぎもん) = question/doubt. 目を疑う = cannot believe one's eyes."}, {"w": "済む", "wf": "<ruby>済<rt>す</rt></ruby>む", "r": "すむ", "m": "to be finished; to be settled; to get by (with)", "p": "v5 intransitive", "t": "verb", "d": 4, "ex": [["<ruby>用事<rt>ようじ</rt></ruby>が <ruby>済<rt>す</rt></ruby>んだら、すぐ <ruby>帰<rt>かえ</rt></ruby>ります。", "Once my errand is done, I will come right home."], ["<ruby>手続<rt>てつづ</rt></ruby>きは <ruby>十五分<rt>じゅうごふん</rt></ruby>で <ruby>済<rt>す</rt></ruby>んだ。", "The procedure was done in fifteen minutes."], ["<ruby>軽<rt>かる</rt></ruby>いけがで <ruby>済<rt>す</rt></ruby>んでよかった。", "I am glad you got away with only a light injury."]], "n": "V-ずに済む = manage without having to (払わずに済んだ). Same reading as 住む. Spoken: 済んだ？ = Done?"}, {"w": "済ませる", "wf": "<ruby>済<rt>す</rt></ruby>ませる", "r": "すませる", "m": "to finish; to get (something) done; to make do with", "p": "v1 transitive", "t": "verb", "d": 4, "ex": [["<ruby>昼<rt>ひる</rt></ruby>ご <ruby>飯<rt>はん</rt></ruby>はパンで <ruby>済<rt>す</rt></ruby>ませた。", "I made do with bread for lunch."], ["<ruby>先<rt>さき</rt></ruby>に <ruby>宿題<rt>しゅくだい</rt></ruby>を <ruby>済<rt>す</rt></ruby>ませてから <ruby>遊<rt>あそ</rt></ruby>ぼう。", "Let us finish homework first, then play."], ["<ruby>会計<rt>かいけい</rt></ruby>はもう <ruby>済<rt>す</rt></ruby>ませました。", "I have already settled the bill."]], "n": "Pair: 済む (vi) ↔ 済ませる (vt). 済ます is an alternate form with the same meaning."}, {"w": "届く", "wf": "<ruby>届<rt>とど</rt></ruby>く", "r": "とどく", "m": "to arrive (mail, goods); to reach", "p": "v5 intransitive", "t": "verb", "d": 4, "ex": [["<ruby>注文<rt>ちゅうもん</rt></ruby>した <ruby>本<rt>ほん</rt></ruby>が <ruby>今日<rt>きょう</rt></ruby> <ruby>届<rt>とど</rt></ruby>いた。", "The book I ordered arrived today."], ["<ruby>棚<rt>たな</rt></ruby>の <ruby>上<rt>うえ</rt></ruby>に <ruby>手<rt>て</rt></ruby>が <ruby>届<rt>とど</rt></ruby>かない。", "I cannot reach the top of the shelf."], ["<ruby>私<rt>わたし</rt></ruby>の <ruby>声<rt>こえ</rt></ruby>がみんなに <ruby>届<rt>とど</rt></ruby>いてうれしい。", "I am glad my voice reached everyone."]], "n": "手が届く = within reach, also affordable. Pair: 届ける (vt)."}, {"w": "届ける", "wf": "<ruby>届<rt>とど</rt></ruby>ける", "r": "とどける", "m": "to deliver; to report (to authorities)", "p": "v1 transitive", "t": "verb", "d": 4, "ex": [["<ruby>荷物<rt>にもつ</rt></ruby>を <ruby>明日<rt>あした</rt></ruby>の <ruby>午前<rt>ごぜん</rt></ruby> <ruby>中<rt>ちゅう</rt></ruby>に <ruby>届<rt>とど</rt></ruby>けてください。", "Please deliver the package tomorrow morning."], ["<ruby>財布<rt>さいふ</rt></ruby>を <ruby>拾<rt>ひろ</rt></ruby>ったので、 <ruby>交番<rt>こうばん</rt></ruby>に <ruby>届<rt>とど</rt></ruby>けた。", "I found a wallet, so I turned it in at the police box."], ["<ruby>忘<rt>わす</rt></ruby>れ <ruby>物<rt>もの</rt></ruby>を <ruby>学校<rt>がっこう</rt></ruby>まで <ruby>届<rt>とど</rt></ruby>けた。", "I brought the forgotten item to the school."]], "n": "届け = official notification form (婚姻届, 転入届). Delivery: お届け."}, {"w": "目立つ", "wf": "<ruby>目立<rt>めだ</rt></ruby>つ", "r": "めだつ", "m": "to stand out; to be conspicuous", "p": "v5 intransitive", "t": "verb", "d": 4, "ex": [["<ruby>彼女<rt>かのじょ</rt></ruby>は <ruby>背<rt>せ</rt></ruby>が <ruby>高<rt>たか</rt></ruby>いので、どこにいても <ruby>目立<rt>めだ</rt></ruby>つ。", "She is tall, so she stands out wherever she is."], ["<ruby>赤<rt>あか</rt></ruby>い <ruby>服<rt>ふく</rt></ruby>は <ruby>目立<rt>めだ</rt></ruby>ちますね。", "Red clothes really stand out, do they not."], ["<ruby>最近<rt>さいきん</rt></ruby>、 <ruby>小<rt>ちい</rt></ruby>さなミスが <ruby>目立<rt>めだ</rt></ruby>つ。", "Lately, small mistakes have been noticeable."]], "n": "Neutral or negative (ミスが目立つ). 目立ちたがり = attention-seeker."}, {"w": "表す", "wf": "<ruby>表<rt>あらわ</rt></ruby>す", "r": "あらわす", "m": "to express; to represent; to show", "p": "v5 transitive", "t": "verb", "d": 4, "ex": [["この <ruby>記号<rt>きごう</rt></ruby>は <ruby>何<rt>なに</rt></ruby>を <ruby>表<rt>あらわ</rt></ruby>していますか。", "What does this symbol represent?"], ["<ruby>言葉<rt>ことば</rt></ruby>では <ruby>表<rt>あらわ</rt></ruby>せないほどうれしい。", "I am happier than words can express."], ["グラフは <ruby>人口<rt>じんこう</rt></ruby>の <ruby>変化<rt>へんか</rt></ruby>を <ruby>表<rt>あらわ</rt></ruby>している。", "The graph shows the change in population."]], "n": "表す = express/represent; 現す (same reading) = reveal. Intransitive pair: 表れる／現れる."}, {"w": "現れる", "wf": "<ruby>現<rt>あらわ</rt></ruby>れる", "r": "あらわれる", "m": "to appear; to show up; to emerge", "p": "v1 intransitive", "t": "verb", "d": 4, "ex": [["<ruby>雲<rt>くも</rt></ruby>の <ruby>間<rt>あいだ</rt></ruby>から <ruby>太陽<rt>たいよう</rt></ruby>が <ruby>現<rt>あらわ</rt></ruby>れた。", "The sun appeared from between the clouds."], ["<ruby>薬<rt>くすり</rt></ruby>の <ruby>効果<rt>こうか</rt></ruby>が <ruby>現<rt>あらわ</rt></ruby>れるまで <ruby>時間<rt>じかん</rt></ruby>がかかる。", "It takes time for the medicine's effect to appear."], ["<ruby>約束<rt>やくそく</rt></ruby>の <ruby>時間<rt>じかん</rt></ruby>に <ruby>彼<rt>かれ</rt></ruby>は <ruby>現<rt>あらわ</rt></ruby>れなかった。", "He did not show up at the appointed time."]], "n": "Pair: 現れる (vi) ↔ 現す／表す (vt). 出る is the everyday version; 現れる is exam/literary."}, {"w": "支払う", "wf": "<ruby>支払<rt>しはら</rt></ruby>う", "r": "しはらう", "m": "to pay", "p": "v5 transitive", "t": "verb", "d": 4, "ex": [["<ruby>料金<rt>りょうきん</rt></ruby>はカードで <ruby>支払<rt>しはら</rt></ruby>うことができます。", "You can pay the fee by card."], ["<ruby>今月<rt>こんげつ</rt></ruby>の <ruby>家賃<rt>やちん</rt></ruby>はもう <ruby>支払<rt>しはら</rt></ruby>った。", "I have already paid this month's rent."], ["<ruby>支払<rt>しはら</rt></ruby>い <ruby>期限<rt>きげん</rt></ruby>を <ruby>過<rt>す</rt></ruby>ぎてしまった。", "The payment deadline has passed."]], "n": "Noun 支払い = payment (支払い方法 on every checkout page). 払う (N4) is the casual version."}, {"w": "育てる", "wf": "<ruby>育<rt>そだ</rt></ruby>てる", "r": "そだてる", "m": "to raise; to bring up; to grow (plants)", "p": "v1 transitive", "t": "verb", "d": 4, "ex": [["<ruby>子<rt>こ</rt></ruby>どもを <ruby>育<rt>そだ</rt></ruby>てながら <ruby>働<rt>はたら</rt></ruby>いている。", "I am working while raising a child."], ["ベランダでトマトを <ruby>育<rt>そだ</rt></ruby>てている。", "I am growing tomatoes on the balcony."], ["<ruby>会社<rt>かいしゃ</rt></ruby>は <ruby>若<rt>わか</rt></ruby>い <ruby>社員<rt>しゃいん</rt></ruby>を <ruby>育<rt>そだ</rt></ruby>てるべきだ。", "Companies should develop young employees."]], "n": "子育て (こそだて) = child-rearing. Pair: 育つ (vi)."}, {"w": "育つ", "wf": "<ruby>育<rt>そだ</rt></ruby>つ", "r": "そだつ", "m": "to grow up; to be raised; to grow", "p": "v5 intransitive", "t": "verb", "d": 4, "ex": [["<ruby>私<rt>わたし</rt></ruby>は <ruby>田舎<rt>いなか</rt></ruby>で <ruby>育<rt>そだ</rt></ruby>ちました。", "I grew up in the countryside."], ["この <ruby>野菜<rt>やさい</rt></ruby>は <ruby>寒<rt>さむ</rt></ruby>い <ruby>所<rt>ところ</rt></ruby>でもよく <ruby>育<rt>そだ</rt></ruby>つ。", "This vegetable grows well even in cold places."], ["<ruby>子<rt>こ</rt></ruby>どもは <ruby>親<rt>おや</rt></ruby>の <ruby>愛情<rt>あいじょう</rt></ruby>で <ruby>育<rt>そだ</rt></ruby>つ。", "Children grow up on their parents' love."]], "n": "生まれ育った = born and raised. Self-intro: 東京で生まれ育ちました."}, {"w": "詳しい", "wf": "<ruby>詳<rt>くわ</rt></ruby>しい", "r": "くわしい", "m": "detailed; knowledgeable (about)", "p": "i-adjective", "t": "adj", "d": 4, "ex": [["<ruby>詳<rt>くわ</rt></ruby>しい <ruby>説明<rt>せつめい</rt></ruby>は <ruby>後<rt>あと</rt></ruby>でします。", "I will give a detailed explanation later."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>日本<rt>にほん</rt></ruby>の <ruby>歴史<rt>れきし</rt></ruby>に <ruby>詳<rt>くわ</rt></ruby>しい。", "He is knowledgeable about Japanese history."], ["もっと <ruby>詳<rt>くわ</rt></ruby>しく <ruby>教<rt>おし</rt></ruby>えてください。", "Please tell me in more detail."]], "n": "Two uses: 詳しい説明 (detailed) and Aに詳しい (expert on A). 詳細 (しょうさい) = details, formal."}, {"w": "厳しい", "wf": "<ruby>厳<rt>きび</rt></ruby>しい", "r": "きびしい", "m": "strict; severe; harsh; tough", "p": "i-adjective", "t": "adj", "d": 4, "ex": [["<ruby>父<rt>ちち</rt></ruby>はとても <ruby>厳<rt>きび</rt></ruby>しい <ruby>人<rt>ひと</rt></ruby>だった。", "My father was a very strict person."], ["<ruby>今年<rt>ことし</rt></ruby>の <ruby>冬<rt>ふゆ</rt></ruby>は <ruby>寒<rt>さむ</rt></ruby>さが <ruby>厳<rt>きび</rt></ruby>しい。", "This winter's cold is severe."], ["<ruby>状況<rt>じょうきょう</rt></ruby>は <ruby>厳<rt>きび</rt></ruby>しいが、 <ruby>諦<rt>あきら</rt></ruby>めない。", "The situation is tough, but I will not give up."]], "n": "Beyond strict: weather, situation, budget can all be 厳しい. Spoken: 厳しいなあ = not looking good."}, {"w": "激しい", "wf": "<ruby>激<rt>はげ</rt></ruby>しい", "r": "はげしい", "m": "intense; violent; fierce", "p": "i-adjective", "t": "adj", "d": 4, "ex": [["<ruby>激<rt>はげ</rt></ruby>しい <ruby>雨<rt>あめ</rt></ruby>が <ruby>降<rt>ふ</rt></ruby>っている。", "Heavy rain is falling."], ["<ruby>激<rt>はげ</rt></ruby>しい <ruby>運動<rt>うんどう</rt></ruby>は <ruby>体<rt>からだ</rt></ruby>に <ruby>良<rt>よ</rt></ruby>くない。", "Intense exercise is not good for the body."], ["<ruby>二人<rt>ふたり</rt></ruby>は <ruby>激<rt>はげ</rt></ruby>しく <ruby>言<rt>い</rt></ruby>い <ruby>争<rt>あらそ</rt></ruby>った。", "The two argued fiercely."]], "n": "Weather: 激しい雨 (not 強い). 競争が激しい = competition is fierce."}, {"w": "複雑", "wf": "<ruby>複雑<rt>ふくざつ</rt></ruby>", "r": "ふくざつ", "m": "complicated; complex", "p": "na-adjective", "t": "adj", "d": 4, "ex": [["この <ruby>問題<rt>もんだい</rt></ruby>は <ruby>複雑<rt>ふくざつ</rt></ruby>で、すぐには <ruby>解決<rt>かいけつ</rt></ruby>できない。", "This problem is complicated and cannot be solved quickly."], ["<ruby>東京<rt>とうきょう</rt></ruby>の <ruby>電車<rt>でんしゃ</rt></ruby>は <ruby>路線<rt>ろせん</rt></ruby>が <ruby>複雑<rt>ふくざつ</rt></ruby>だ。", "Tokyo's train lines are complicated."], ["<ruby>彼女<rt>かのじょ</rt></ruby>の <ruby>話<rt>はなし</rt></ruby>を <ruby>聞<rt>き</rt></ruby>いて、 <ruby>複雑<rt>ふくざつ</rt></ruby>な <ruby>気持<rt>きも</rt></ruby>ちになった。", "Hearing her story gave me mixed feelings."]], "n": "複雑な気持ち = mixed feelings. Opposite: 単純 (たんじゅん) / 簡単."}, {"w": "正確", "wf": "<ruby>正確<rt>せいかく</rt></ruby>", "r": "せいかく", "m": "accurate; exact; precise", "p": "na-adjective", "t": "adj", "d": 4, "ex": [["<ruby>正確<rt>せいかく</rt></ruby>な <ruby>時間<rt>じかん</rt></ruby>を <ruby>教<rt>おし</rt></ruby>えてください。", "Please tell me the exact time."], ["この <ruby>時計<rt>とけい</rt></ruby>は <ruby>正確<rt>せいかく</rt></ruby>だ。", "This watch is accurate."], ["<ruby>情報<rt>じょうほう</rt></ruby>を <ruby>正確<rt>せいかく</rt></ruby>に <ruby>伝<rt>つた</rt></ruby>えることが <ruby>大切<rt>たいせつ</rt></ruby>だ。", "It is important to convey information accurately."]], "n": "Homophone with 性格 (personality). 正確 takes な. 正しい (i-adj) = correct."}, {"w": "意外", "wf": "<ruby>意外<rt>いがい</rt></ruby>", "r": "いがい", "m": "unexpected; surprising", "p": "na-adjective", "t": "adj", "d": 4, "ex": [["<ruby>彼<rt>かれ</rt></ruby>が <ruby>料理<rt>りょうり</rt></ruby> <ruby>上手<rt>じょうず</rt></ruby>だなんて、 <ruby>意外<rt>いがい</rt></ruby>だ。", "It is surprising that he is good at cooking."], ["<ruby>試験<rt>しけん</rt></ruby>は <ruby>意外<rt>いがい</rt></ruby>に <ruby>簡単<rt>かんたん</rt></ruby>だった。", "The exam was unexpectedly easy."], ["<ruby>意外<rt>いがい</rt></ruby>な <ruby>人<rt>ひと</rt></ruby>から <ruby>手紙<rt>てがみ</rt></ruby>が <ruby>来<rt>き</rt></ruby>た。", "A letter came from an unexpected person."]], "n": "Homophone trap: 意外 (unexpected) vs 以外 (except for, N4). Spoken: 意外と = surprisingly."}, {"w": "面倒", "wf": "<ruby>面倒<rt>めんどう</rt></ruby>", "r": "めんどう", "m": "troublesome; a bother; care (looking after)", "p": "na-adjective / noun", "t": "adj", "d": 4, "ex": [["<ruby>手続<rt>てつづ</rt></ruby>きが <ruby>面倒<rt>めんどう</rt></ruby>で、まだやっていない。", "The procedure is a hassle, so I have not done it yet."], ["<ruby>面倒<rt>めんどう</rt></ruby>な <ruby>仕事<rt>しごと</rt></ruby>は <ruby>先<rt>さき</rt></ruby>に <ruby>終<rt>お</rt></ruby>わらせよう。", "Let us finish the annoying tasks first."], ["<ruby>妹<rt>いもうと</rt></ruby>の <ruby>面倒<rt>めんどう</rt></ruby>を <ruby>見<rt>み</rt></ruby>た。", "I looked after my little sister."]], "n": "面倒くさい (spoken: めんどくさい) = what a pain. 面倒を見る = take care of someone; different sense."}, {"w": "なるべく", "wf": "なるべく", "r": "なるべく", "m": "as much as possible; if possible", "p": "adverb", "t": "adv", "d": 4, "ex": [["なるべく <ruby>早<rt>はや</rt></ruby>く <ruby>返事<rt>へんじ</rt></ruby>をください。", "Please reply as soon as possible."], ["なるべく <ruby>日本語<rt>にほんご</rt></ruby>で <ruby>話<rt>はな</rt></ruby>すようにしている。", "I try to speak in Japanese as much as I can."], ["<ruby>砂糖<rt>さとう</rt></ruby>はなるべく <ruby>使<rt>つか</rt></ruby>わないで <ruby>作<rt>つく</rt></ruby>った。", "I made it using as little sugar as possible."]], "n": "Synonym: できるだけ (slightly stronger). Always written in kana."}, {"w": "少なくとも", "wf": "<ruby>少<rt>すく</rt></ruby>なくとも", "r": "すくなくとも", "m": "at least", "p": "adverb", "t": "adv", "d": 4, "ex": [["<ruby>少<rt>すく</rt></ruby>なくとも <ruby>一日<rt>いちにち</rt></ruby> <ruby>一時間<rt>いちじかん</rt></ruby>は <ruby>勉強<rt>べんきょう</rt></ruby>した <ruby>方<rt>ほう</rt></ruby>がいい。", "You should study at least an hour a day."], ["<ruby>修理<rt>しゅうり</rt></ruby>には <ruby>少<rt>すく</rt></ruby>なくとも <ruby>一週間<rt>いっしゅうかん</rt></ruby>かかる。", "Repairs will take at least a week."], ["<ruby>少<rt>すく</rt></ruby>なくとも <ruby>私<rt>わたし</rt></ruby>はそう <ruby>思<rt>おも</rt></ruby>う。", "At least, that is what I think."]], "n": "From 少ない + とも. Opposite: せいぜい (at most). Spoken alternative: 最低でも."}, {"w": "突然", "wf": "<ruby>突然<rt>とつぜん</rt></ruby>", "r": "とつぜん", "m": "suddenly; abruptly", "p": "adverb / na-adjective", "t": "adv", "d": 4, "ex": [["<ruby>突然<rt>とつぜん</rt></ruby>、 <ruby>雨<rt>あめ</rt></ruby>が <ruby>降<rt>ふ</rt></ruby>り <ruby>出<rt>だ</rt></ruby>した。", "Suddenly it started raining."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>突然<rt>とつぜん</rt></ruby> <ruby>会社<rt>かいしゃ</rt></ruby>を <ruby>辞<rt>や</rt></ruby>めた。", "He quit the company abruptly."], ["<ruby>突然<rt>とつぜん</rt></ruby>の <ruby>電話<rt>でんわ</rt></ruby>に <ruby>驚<rt>おどろ</rt></ruby>いた。", "I was surprised by the sudden phone call."]], "n": "突然 = sudden/unexpected; 急に = suddenly (rapid change). Both N3; 突然 is more written."}, {"w": "直接", "wf": "<ruby>直接<rt>ちょくせつ</rt></ruby>", "r": "ちょくせつ", "m": "directly; direct", "p": "adverb / noun", "t": "adv", "d": 4, "ex": [["<ruby>分<rt>わ</rt></ruby>からないことは <ruby>先生<rt>せんせい</rt></ruby>に <ruby>直接<rt>ちょくせつ</rt></ruby> <ruby>聞<rt>き</rt></ruby>いてください。", "Ask the teacher directly about anything you do not understand."], ["<ruby>店<rt>みせ</rt></ruby>に <ruby>直接<rt>ちょくせつ</rt></ruby> <ruby>行<rt>い</rt></ruby>った <ruby>方<rt>ほう</rt></ruby>が <ruby>早<rt>はや</rt></ruby>い。", "It is faster to go straight to the shop."], ["この <ruby>問題<rt>もんだい</rt></ruby>は <ruby>私<rt>わたし</rt></ruby>と <ruby>直接<rt>ちょくせつ</rt></ruby> <ruby>関係<rt>かんけい</rt></ruby>がない。", "This problem has no direct connection to me."]], "n": "Opposite: 間接 (かんせつ) = indirect. Reading ちょくせつ."}, {"w": "気づく", "wf": "<ruby>気<rt>き</rt></ruby>づく", "r": "きづく", "m": "to notice; to realize", "p": "v5 intransitive", "t": "verb", "d": 5, "ex": [["<ruby>間違<rt>まちが</rt></ruby>いに <ruby>気<rt>き</rt></ruby>づいたら、すぐ <ruby>直<rt>なお</rt></ruby>してください。", "If you notice a mistake, please fix it right away."], ["<ruby>彼女<rt>かのじょ</rt></ruby>が <ruby>髪<rt>かみ</rt></ruby>を <ruby>切<rt>き</rt></ruby>ったことに <ruby>気<rt>き</rt></ruby>づかなかった。", "I did not notice that she had cut her hair."], ["<ruby>家<rt>いえ</rt></ruby>を <ruby>出<rt>で</rt></ruby>てから、 <ruby>財布<rt>さいふ</rt></ruby>がないことに <ruby>気<rt>き</rt></ruby>づいた。", "After leaving the house, I realized I did not have my wallet."]], "n": "Takes に. Also written 気付く. 気がつく = same meaning."}, {"w": "驚く", "wf": "<ruby>驚<rt>おどろ</rt></ruby>く", "r": "おどろく", "m": "to be surprised", "p": "v5 intransitive", "t": "verb", "d": 5, "ex": [["<ruby>突然<rt>とつぜん</rt></ruby>の <ruby>知<rt>し</rt></ruby>らせに <ruby>驚<rt>おどろ</rt></ruby>いた。", "I was surprised by the sudden news."], ["<ruby>物価<rt>ぶっか</rt></ruby>の <ruby>高<rt>たか</rt></ruby>さに <ruby>驚<rt>おどろ</rt></ruby>きました。", "I was surprised at how high prices are."], ["<ruby>驚<rt>おどろ</rt></ruby>いたことに、 <ruby>二人<rt>ふたり</rt></ruby>は <ruby>同<rt>おな</rt></ruby>じ <ruby>誕生日<rt>たんじょうび</rt></ruby>だった。", "Surprisingly, the two had the same birthday."]], "n": "驚いたことに = to my surprise (written). Spoken: びっくりする."}, {"w": "変化", "wf": "<ruby>変化<rt>へんか</rt></ruby>", "r": "へんか", "m": "change", "p": "noun / suru-verb", "t": "verb", "d": 5, "ex": [["<ruby>気温<rt>きおん</rt></ruby>の <ruby>変化<rt>へんか</rt></ruby>が <ruby>激<rt>はげ</rt></ruby>しい。", "The temperature changes are extreme."], ["<ruby>町<rt>まち</rt></ruby>の <ruby>様子<rt>ようす</rt></ruby>は <ruby>大<rt>おお</rt></ruby>きく <ruby>変化<rt>へんか</rt></ruby>した。", "The look of the town has changed greatly."], ["<ruby>生活<rt>せいかつ</rt></ruby>の <ruby>変化<rt>へんか</rt></ruby>に <ruby>体<rt>からだ</rt></ruby>がついていかない。", "My body cannot keep up with the changes in my life."]], "n": "Formal version of 変わる. 変化する is intransitive."}, {"w": "比べる", "wf": "<ruby>比<rt>くら</rt></ruby>べる", "r": "くらべる", "m": "to compare", "p": "v1 transitive", "t": "verb", "d": 5, "ex": [["<ruby>値段<rt>ねだん</rt></ruby>を <ruby>比<rt>くら</rt></ruby>べてから <ruby>買<rt>か</rt></ruby>います。", "I compare prices before buying."], ["<ruby>去年<rt>きょねん</rt></ruby>と <ruby>比<rt>くら</rt></ruby>べて、 <ruby>今年<rt>ことし</rt></ruby>は <ruby>雨<rt>あめ</rt></ruby>が <ruby>多<rt>おお</rt></ruby>い。", "Compared to last year, this year has a lot of rain."], ["<ruby>人<rt>ひと</rt></ruby>と <ruby>比<rt>くら</rt></ruby>べても <ruby>意味<rt>いみ</rt></ruby>がない。", "There is no point comparing yourself with others."]], "n": "〜に比べて also correct. Formal noun: 比較."}, {"w": "比較", "wf": "<ruby>比較<rt>ひかく</rt></ruby>", "r": "ひかく", "m": "comparison", "p": "noun / suru-verb", "t": "verb", "d": 5, "ex": [["<ruby>二<rt>ふた</rt></ruby>つの <ruby>商品<rt>しょうひん</rt></ruby>を <ruby>比較<rt>ひかく</rt></ruby>した。", "I compared the two products."], ["<ruby>他<rt>ほか</rt></ruby>の <ruby>国<rt>くに</rt></ruby>と <ruby>比較<rt>ひかく</rt></ruby>すると、 <ruby>日本<rt>にほん</rt></ruby>は <ruby>安全<rt>あんぜん</rt></ruby>だ。", "Compared with other countries, Japan is safe."], ["<ruby>比較的<rt>ひかくてき</rt></ruby> <ruby>簡単<rt>かんたん</rt></ruby>な <ruby>問題<rt>もんだい</rt></ruby>だった。", "It was a relatively easy problem."]], "n": "比較的 = relatively (adverb) — exam favourite. Spoken: 比べる."}, {"w": "諦める", "wf": "<ruby>諦<rt>あきら</rt></ruby>める", "r": "あきらめる", "m": "to give up", "p": "v1 transitive", "t": "verb", "d": 5, "ex": [["<ruby>最後<rt>さいご</rt></ruby>まで <ruby>諦<rt>あきら</rt></ruby>めないでください。", "Please do not give up until the end."], ["<ruby>雨<rt>あめ</rt></ruby>なので、 <ruby>花見<rt>はなみ</rt></ruby>は <ruby>諦<rt>あきら</rt></ruby>めた。", "It is raining, so we gave up on the cherry-blossom viewing."], ["<ruby>夢<rt>ゆめ</rt></ruby>を <ruby>諦<rt>あきら</rt></ruby>めるのはまだ <ruby>早<rt>はや</rt></ruby>い。", "It is still too early to give up on your dream."]], "n": "Kanji 諦 is N1-level; often written あきらめる in kana."}, {"w": "確か", "wf": "<ruby>確<rt>たし</rt></ruby>か", "r": "たしか", "m": "certain; (adv) if I remember correctly", "p": "adverb / na-adjective", "t": "adv", "d": 5, "ex": [["<ruby>確<rt>たし</rt></ruby>か、 <ruby>会議<rt>かいぎ</rt></ruby>は <ruby>三時<rt>さんじ</rt></ruby>からだったと <ruby>思<rt>おも</rt></ruby>う。", "If I remember right, the meeting was from three."], ["それは <ruby>確<rt>たし</rt></ruby>かな <ruby>情報<rt>じょうほう</rt></ruby>ですか。", "Is that reliable information?"], ["<ruby>彼<rt>かれ</rt></ruby>が <ruby>来<rt>く</rt></ruby>るかどうか、 <ruby>確<rt>たし</rt></ruby>かではない。", "It is not certain whether he will come."]], "n": "確か = I think, if I recall; 確かに = certainly/indeed. Different! Verb: 確かめる."}, {"w": "当然", "wf": "<ruby>当然<rt>とうぜん</rt></ruby>", "r": "とうぜん", "m": "natural; of course", "p": "adverb / na-adjective", "t": "adv", "d": 5, "ex": [["<ruby>働<rt>はたら</rt></ruby>いたら、 <ruby>給料<rt>きゅうりょう</rt></ruby>をもらうのは <ruby>当然<rt>とうぜん</rt></ruby>だ。", "If you work, it is only natural to get paid."], ["<ruby>彼<rt>かれ</rt></ruby>が <ruby>怒<rt>おこ</rt></ruby>るのも <ruby>当然<rt>とうぜん</rt></ruby>だ。", "It is no wonder he is angry."], ["<ruby>当然<rt>とうぜん</rt></ruby>、 <ruby>準備<rt>じゅんび</rt></ruby>はしてありますよね。", "Naturally, you have prepared, right?"]], "n": "当たり前 (spoken) = 当然 (formal). 当然の結果 = a natural result."}, {"w": "偶然", "wf": "<ruby>偶然<rt>ぐうぜん</rt></ruby>", "r": "ぐうぜん", "m": "by chance; coincidence", "p": "adverb / noun", "t": "adv", "d": 5, "ex": [["<ruby>駅<rt>えき</rt></ruby>で <ruby>偶然<rt>ぐうぜん</rt></ruby>、 <ruby>昔<rt>むかし</rt></ruby>の <ruby>友人<rt>ゆうじん</rt></ruby>に <ruby>会<rt>あ</rt></ruby>った。", "I ran into an old friend at the station by chance."], ["それは <ruby>偶然<rt>ぐうぜん</rt></ruby>ではないと <ruby>思<rt>おも</rt></ruby>う。", "I do not think that is a coincidence."], ["<ruby>偶然<rt>ぐうぜん</rt></ruby>にも、 <ruby>二人<rt>ふたり</rt></ruby>は <ruby>同<rt>おな</rt></ruby>じ <ruby>本<rt>ほん</rt></ruby>を <ruby>読<rt>よ</rt></ruby>んでいた。", "By coincidence, the two were reading the same book."]], "n": "Opposite: 必然. わざと = on purpose. Spoken: たまたま."}, {"w": "途中", "wf": "<ruby>途中<rt>とちゅう</rt></ruby>", "r": "とちゅう", "m": "on the way; midway", "p": "noun", "t": "noun", "d": 5, "ex": [["<ruby>学校<rt>がっこう</rt></ruby>へ <ruby>行<rt>い</rt></ruby>く <ruby>途中<rt>とちゅう</rt></ruby>で、 <ruby>先生<rt>せんせい</rt></ruby>に <ruby>会<rt>あ</rt></ruby>った。", "On the way to school, I met my teacher."], ["<ruby>映画<rt>えいが</rt></ruby>を <ruby>途中<rt>とちゅう</rt></ruby>で <ruby>見<rt>み</rt></ruby>るのをやめた。", "I stopped watching the film partway through."], ["<ruby>話<rt>はなし</rt></ruby>の <ruby>途中<rt>とちゅう</rt></ruby>ですみませんが、 <ruby>電話<rt>でんわ</rt></ruby>です。", "Sorry to interrupt, but there is a phone call for you."]], "n": "途中で = midway through. 中途半端 = half-done (related feel)."}, {"w": "以前", "wf": "<ruby>以前<rt>いぜん</rt></ruby>", "r": "いぜん", "m": "before; previously", "p": "noun / adverb", "t": "noun", "d": 5, "ex": [["<ruby>以前<rt>いぜん</rt></ruby>、この <ruby>近<rt>ちか</rt></ruby>くに <ruby>住<rt>す</rt></ruby>んでいました。", "I used to live near here."], ["<ruby>以前<rt>いぜん</rt></ruby>より <ruby>日本語<rt>にほんご</rt></ruby>が <ruby>上手<rt>じょうず</rt></ruby>になりましたね。", "Your Japanese has gotten better than before."], ["<ruby>五時<rt>ごじ</rt></ruby> <ruby>以前<rt>いぜん</rt></ruby>に <ruby>来<rt>き</rt></ruby>てください。", "Please come before five o'clock."]], "n": "Opposite: 以後／以降. Spoken: 前（に）."}, {"w": "今後", "wf": "<ruby>今後<rt>こんご</rt></ruby>", "r": "こんご", "m": "from now on; in the future", "p": "noun / adverb", "t": "noun", "d": 5, "ex": [["<ruby>今後<rt>こんご</rt></ruby>の <ruby>予定<rt>よてい</rt></ruby>を <ruby>教<rt>おし</rt></ruby>えてください。", "Please tell me the plans from here on."], ["<ruby>今後<rt>こんご</rt></ruby>、このようなことがないように <ruby>気<rt>き</rt></ruby>をつけます。", "I will be careful that this does not happen again."], ["<ruby>今後<rt>こんご</rt></ruby>も、よろしくお <ruby>願<rt>ねが</rt></ruby>いします。", "I look forward to working with you in the future as well."]], "n": "Business staple: 今後とも = going forward (emails). これから is the spoken version."}, {"w": "迷惑", "wf": "<ruby>迷惑<rt>めいわく</rt></ruby>", "r": "めいわく", "m": "trouble; nuisance", "p": "noun / na-adjective", "t": "noun", "d": 5, "ex": [["<ruby>人<rt>ひと</rt></ruby>に <ruby>迷惑<rt>めいわく</rt></ruby>をかけてはいけません。", "You must not cause trouble to others."], ["<ruby>夜中<rt>よなか</rt></ruby>の <ruby>電話<rt>でんわ</rt></ruby>は <ruby>迷惑<rt>めいわく</rt></ruby>だ。", "Phone calls in the middle of the night are a nuisance."], ["ご <ruby>迷惑<rt>めいわく</rt></ruby>をおかけして、 <ruby>申<rt>もう</rt></ruby>し <ruby>訳<rt>わけ</rt></ruby>ありません。", "I am very sorry for the inconvenience."]], "n": "Core Japan word. 迷惑をかける = cause someone trouble. 迷惑メール = spam."}, {"w": "上司", "wf": "<ruby>上司<rt>じょうし</rt></ruby>", "r": "じょうし", "m": "boss; superior", "p": "noun", "t": "noun", "d": 5, "ex": [["<ruby>上司<rt>じょうし</rt></ruby>に <ruby>報告<rt>ほうこく</rt></ruby>しなければならない。", "I have to report to my boss."], ["<ruby>新<rt>あたら</rt></ruby>しい <ruby>上司<rt>じょうし</rt></ruby>は <ruby>話<rt>はな</rt></ruby>しやすい <ruby>人<rt>ひと</rt></ruby>だ。", "My new boss is easy to talk to."], ["<ruby>上司<rt>じょうし</rt></ruby>の <ruby>指示<rt>しじ</rt></ruby>に <ruby>従<rt>したが</rt></ruby>って <ruby>作業<rt>さぎょう</rt></ruby>を <ruby>進<rt>すす</rt></ruby>めた。", "I proceeded with the work following my boss's instructions."]], "n": "Pair: 上司 ↔ 部下 (ぶか, subordinate). 同僚 = colleague."}, {"w": "目標", "wf": "<ruby>目標<rt>もくひょう</rt></ruby>", "r": "もくひょう", "m": "goal; target", "p": "noun", "t": "noun", "d": 5, "ex": [["<ruby>今年<rt>ことし</rt></ruby>の <ruby>目標<rt>もくひょう</rt></ruby>は <ruby>十二月<rt>じゅうにがつ</rt></ruby>の <ruby>試験<rt>しけん</rt></ruby>に <ruby>合格<rt>ごうかく</rt></ruby>することだ。", "This year's goal is to pass the December exam."], ["<ruby>目標<rt>もくひょう</rt></ruby>を <ruby>立<rt>た</rt></ruby>てて、 <ruby>計画的<rt>けいかくてき</rt></ruby>に <ruby>勉強<rt>べんきょう</rt></ruby>しよう。", "Set a goal and study systematically."], ["<ruby>売<rt>う</rt></ruby>り <ruby>上<rt>あ</rt></ruby>げは <ruby>目標<rt>もくひょう</rt></ruby>を <ruby>超<rt>こ</rt></ruby>えた。", "Sales exceeded the target."]], "n": "目標 = measurable target; 目的 = purpose (why). 目標を達成する = achieve a goal."}, {"w": "意識", "wf": "<ruby>意識<rt>いしき</rt></ruby>", "r": "いしき", "m": "consciousness; awareness", "p": "noun / suru-verb", "t": "noun", "d": 5, "ex": [["<ruby>彼<rt>かれ</rt></ruby>は <ruby>事故<rt>じこ</rt></ruby>の <ruby>後<rt>あと</rt></ruby>、 <ruby>意識<rt>いしき</rt></ruby>を <ruby>失<rt>うしな</rt></ruby>った。", "He lost consciousness after the accident."], ["<ruby>健康<rt>けんこう</rt></ruby>を <ruby>意識<rt>いしき</rt></ruby>して、 <ruby>野菜<rt>やさい</rt></ruby>を <ruby>多<rt>おお</rt></ruby>く <ruby>食<rt>た</rt></ruby>べている。", "Being health-conscious, I eat a lot of vegetables."], ["<ruby>日本人<rt>にほんじん</rt></ruby>は <ruby>時間<rt>じかん</rt></ruby>に <ruby>対<rt>たい</rt></ruby>する <ruby>意識<rt>いしき</rt></ruby>が <ruby>高<rt>たか</rt></ruby>い。", "Japanese people have a strong awareness of time."]], "n": "無意識に = unconsciously. Set with 知識, 常識."}, {"w": "常識", "wf": "<ruby>常識<rt>じょうしき</rt></ruby>", "r": "じょうしき", "m": "common sense", "p": "noun", "t": "noun", "d": 5, "ex": [["<ruby>電車<rt>でんしゃ</rt></ruby>の <ruby>中<rt>なか</rt></ruby>で <ruby>電話<rt>でんわ</rt></ruby>しないのは <ruby>常識<rt>じょうしき</rt></ruby>だ。", "Not making phone calls on the train is common sense."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>常識<rt>じょうしき</rt></ruby>がない。", "He has no common sense."], ["<ruby>国<rt>くに</rt></ruby>によって <ruby>常識<rt>じょうしき</rt></ruby>は <ruby>違<rt>ちが</rt></ruby>う。", "Common sense differs by country."]], "n": "非常識 = lacking common sense (strong criticism). Culture-loaded word."}, {"w": "種類", "wf": "<ruby>種類<rt>しゅるい</rt></ruby>", "r": "しゅるい", "m": "kind; type; variety", "p": "noun", "t": "noun", "d": 5, "ex": [["この <ruby>店<rt>みせ</rt></ruby>にはパンの <ruby>種類<rt>しゅるい</rt></ruby>が <ruby>多<rt>おお</rt></ruby>い。", "This shop has many kinds of bread."], ["どんな <ruby>種類<rt>しゅるい</rt></ruby>の <ruby>音楽<rt>おんがく</rt></ruby>が <ruby>好<rt>す</rt></ruby>きですか。", "What kind of music do you like?"], ["ごみは <ruby>種類<rt>しゅるい</rt></ruby>ごとに <ruby>分<rt>わ</rt></ruby>けてください。", "Please separate the garbage by type."]], "n": "Counter: 一種類, 二種類."}, {"w": "順番", "wf": "<ruby>順番<rt>じゅんばん</rt></ruby>", "r": "じゅんばん", "m": "order; turn", "p": "noun", "t": "noun", "d": 5, "ex": [["<ruby>順番<rt>じゅんばん</rt></ruby>を <ruby>守<rt>まも</rt></ruby>って <ruby>並<rt>なら</rt></ruby>んでください。", "Please keep your place in line."], ["<ruby>名前<rt>なまえ</rt></ruby>を <ruby>呼<rt>よ</rt></ruby>ばれるまで、 <ruby>順番<rt>じゅんばん</rt></ruby>を <ruby>待<rt>ま</rt></ruby>った。", "I waited my turn until my name was called."], ["<ruby>順番<rt>じゅんばん</rt></ruby>に <ruby>自己紹介<rt>じこしょうかい</rt></ruby>をしましょう。", "Let us introduce ourselves in order."]], "n": "順番に = in turn. 五十音順 = alphabetical (kana) order."}, {"w": "気に入る", "wf": "<ruby>気<rt>き</rt></ruby>に <ruby>入<rt>い</rt></ruby>る", "r": "きにいる", "m": "to like; to take a liking to", "p": "v5 expression", "t": "verb", "d": 5, "ex": [["この <ruby>部屋<rt>へや</rt></ruby>がとても <ruby>気<rt>き</rt></ruby>に <ruby>入<rt>い</rt></ruby>りました。", "I really like this room."], ["<ruby>彼<rt>かれ</rt></ruby>は <ruby>新<rt>あたら</rt></ruby>しい <ruby>靴<rt>くつ</rt></ruby>を <ruby>気<rt>き</rt></ruby>に <ruby>入<rt>い</rt></ruby>っている。", "He is fond of his new shoes."], ["<ruby>気<rt>き</rt></ruby>に <ruby>入<rt>い</rt></ruby>らなければ、 <ruby>返品<rt>へんぴん</rt></ruby>できます。", "If you do not like it, you can return it."]], "n": "お気に入り = a favourite (also browser bookmarks). 好き (state) vs 気に入る (take a liking)."}, {"w": "付き合う", "wf": "<ruby>付<rt>つ</rt></ruby>き <ruby>合<rt>あ</rt></ruby>う", "r": "つきあう", "m": "to date; to keep company; to accompany", "p": "v5 intransitive", "t": "verb", "d": 5, "ex": [["<ruby>二人<rt>ふたり</rt></ruby>は <ruby>三年間<rt>さんねんかん</rt></ruby> <ruby>付<rt>つ</rt></ruby>き <ruby>合<rt>あ</rt></ruby>っている。", "The two have been dating for three years."], ["<ruby>買<rt>か</rt></ruby>い <ruby>物<rt>もの</rt></ruby>に <ruby>付<rt>つ</rt></ruby>き <ruby>合<rt>あ</rt></ruby>ってくれない？", "Will you come shopping with me?"], ["<ruby>彼<rt>かれ</rt></ruby>とは <ruby>仕事<rt>しごと</rt></ruby>の <ruby>上<rt>うえ</rt></ruby>だけの <ruby>付<rt>つ</rt></ruby>き <ruby>合<rt>あ</rt></ruby>いだ。", "My relationship with him is strictly work."]], "n": "と = relationship; に = tag along. Noun: 付き合い."}, {"w": "役立つ", "wf": "<ruby>役立<rt>やくだ</rt></ruby>つ", "r": "やくだつ", "m": "to be useful", "p": "v5 intransitive", "t": "verb", "d": 5, "ex": [["この <ruby>辞書<rt>じしょ</rt></ruby>は <ruby>勉強<rt>べんきょう</rt></ruby>に <ruby>役立<rt>やくだ</rt></ruby>つ。", "This dictionary is useful for studying."], ["<ruby>旅行<rt>りょこう</rt></ruby>で <ruby>学<rt>まな</rt></ruby>んだことが <ruby>仕事<rt>しごと</rt></ruby>に <ruby>役立<rt>やくだ</rt></ruby>った。", "What I learned from traveling was useful in my work."], ["<ruby>皆<rt>みな</rt></ruby>さんの <ruby>役<rt>やく</rt></ruby>に <ruby>立<rt>た</rt></ruby>てば、うれしいです。", "I will be glad if this is of use to you all."]], "n": "役立つ = 役に立つ. 役立たず = useless (person) — harsh."}, {"w": "効く", "wf": "<ruby>効<rt>き</rt></ruby>く", "r": "きく", "m": "to be effective; to work", "p": "v5 intransitive", "t": "verb", "d": 5, "ex": [["この <ruby>薬<rt>くすり</rt></ruby>は <ruby>頭痛<rt>ずつう</rt></ruby>によく <ruby>効<rt>き</rt></ruby>く。", "This medicine works well on headaches."], ["<ruby>冷房<rt>れいぼう</rt></ruby>が <ruby>効<rt>き</rt></ruby>きすぎて <ruby>寒<rt>さむ</rt></ruby>い。", "The air conditioning is working too well and it is cold."], ["<ruby>宣伝<rt>せんでん</rt></ruby>が <ruby>効<rt>き</rt></ruby>いて、 <ruby>客<rt>きゃく</rt></ruby>が <ruby>増<rt>ふ</rt></ruby>えた。", "The advertising worked and customers increased."]], "n": "Homophone 聞く／聴く. 効き目 = effect. Related noun: 効果 (batch 1)."}, {"w": "かなり", "wf": "かなり", "r": "かなり", "m": "quite; considerably", "p": "adverb", "t": "adv", "d": 5, "ex": [["<ruby>今日<rt>きょう</rt></ruby>はかなり <ruby>寒<rt>さむ</rt></ruby>いですね。", "It is quite cold today, is it not."], ["<ruby>駅<rt>えき</rt></ruby>までかなり <ruby>距離<rt>きょり</rt></ruby>がある。", "It is a fair distance to the station."], ["<ruby>彼<rt>かれ</rt></ruby>の <ruby>日本語<rt>にほんご</rt></ruby>はかなりのレベルだ。", "His Japanese is at quite a high level."]], "n": "Between まあまあ and 非常に. Written in kana."}, {"w": "とにかく", "wf": "とにかく", "r": "とにかく", "m": "anyway; in any case", "p": "adverb", "t": "adv", "d": 5, "ex": [["<ruby>難<rt>むずか</rt></ruby>しいことは <ruby>後<rt>あと</rt></ruby>で <ruby>考<rt>かんが</rt></ruby>えて、とにかく <ruby>始<rt>はじ</rt></ruby>めよう。", "Think about the hard parts later — anyway, let us start."], ["とにかく <ruby>暑<rt>あつ</rt></ruby>い <ruby>一日<rt>いちにち</rt></ruby>だった。", "It was, above all, a hot day."], ["<ruby>理由<rt>りゆう</rt></ruby>はとにかく、ルールはルールだ。", "Whatever the reason, rules are rules."]], "n": "とりあえず = for now; とにかく = at any rate. Kana only."}, {"w": "述べる", "wf": "<ruby>述<rt>の</rt></ruby>べる", "r": "のべる", "m": "to state; to mention", "p": "v1 transitive", "t": "verb", "d": 6, "ex": [["<ruby>会議<rt>かいぎ</rt></ruby>で <ruby>意見<rt>いけん</rt></ruby>を <ruby>述<rt>の</rt></ruby>べた。", "I stated my opinion at the meeting."], ["<ruby>筆者<rt>ひっしゃ</rt></ruby>はこの <ruby>問題<rt>もんだい</rt></ruby>について <ruby>何<rt>なに</rt></ruby>と <ruby>述<rt>の</rt></ruby>べていますか。", "What does the author say about this problem?"], ["<ruby>理由<rt>りゆう</rt></ruby>を <ruby>簡単<rt>かんたん</rt></ruby>に <ruby>述<rt>の</rt></ruby>べます。", "I will state the reasons briefly."]], "n": "THE reading-section verb: 筆者が述べていること appears in almost every N3 exam. Written/formal 言う."}, {"w": "従う", "wf": "<ruby>従<rt>したが</rt></ruby>う", "r": "したがう", "m": "to follow; to obey", "p": "v5 intransitive", "t": "verb", "d": 6, "ex": [["<ruby>社員<rt>しゃいん</rt></ruby>は <ruby>会社<rt>かいしゃ</rt></ruby>のルールに <ruby>従<rt>したが</rt></ruby>わなければならない。", "Employees must fo
