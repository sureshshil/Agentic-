name: Rain Alert

# The alert actually runs via VPS cron (rain_alert_cron.py, see
# deploy/cron-notifications.md) - that's what replaced this workflow, so
# the schedule trigger stays off to avoid a duplicate/spammy alert (this
# workflow also can't persist ALERT_COOLDOWN_MIN state between runs).
# Kept only for workflow_dispatch (manual "Run workflow" testing).
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python simple_agent/scheduled/rain_alert.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_LAT: ${{ vars.ALERT_LAT }}
          ALERT_LON: ${{ vars.ALERT_LON }}
          ALERT_LABEL: ${{ vars.ALERT_LABEL }}
          ALERT_LOCATION: ${{ vars.ALERT_LOCATION || secrets.ALERT_LOCATION }}
          ALERT_CONTACT: ${{ vars.ALERT_CONTACT }}
          RAIN_THRESHOLD_MM: ${{ vars.RAIN_THRESHOLD_MM || secrets.RAIN_THRESHOLD_MM }}
          ALERT_LOOKAHEAD_HOURS: ${{ vars.ALERT_LOOKAHEAD_HOURS }}
          # Actions runners are ephemeral, so the cooldown state file
          # never survives between runs - dedupe has to be off here.
          ALERT_COOLDOWN_MIN: "0"
