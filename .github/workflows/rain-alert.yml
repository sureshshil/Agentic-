name: Rain Alert

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python simple_agent/scheduled/rain_alert.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_LOCATION: ${{ vars.ALERT_LOCATION }}
          RAIN_THRESHOLD_MM: ${{ vars.RAIN_THRESHOLD_MM }}
